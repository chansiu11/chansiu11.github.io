function recalc(h){const j=JOBS[h.job],bonus={atk:0,def:0,hp:0,spd:0};for(const it of Object.values(h.gear)){if(it)for(const k of Object.keys(bonus))bonus[k]+=it.stats[k]||0;}h.maxHp=j.hp+(h.level-1)*13+bonus.hp;h.maxMp=j.mp+Math.floor((h.level-1)/2);h.atk=j.atk+(h.level-1)*3+bonus.atk+h.talent;h.def=j.def+Math.floor((h.level-1)/2)+bonus.def;h.spd=j.spd+bonus.spd;h.move=j.move+(hasTrait(h,'agility')?1:0);h.hp=Math.min(h.hp,h.maxHp);h.mp=Math.min(h.mp,h.maxMp);}

function setJob(s,id,job){const h=s.heroes.find(h=>h.id===id);if(!h||!JOBS[job]||s.phase!=='lobby')throw Error('지금은 직업을 바꿀 수 없습니다.');const other=s.heroes.find(a=>a.job===job&&a.id!==id);if(other&&other.owner)throw Error('다른 플레이어가 선택한 직업입니다.');if(s.resumePhase){if(h.job===job)return s;if(!h.owner||!other)throw Error('저장된 파티에 있는 AI 동료만 맡을 수 있습니다.');Object.assign(other,{owner:h.owner,name:h.name,connected:h.connected,ready:false});Object.assign(h,{owner:null,name:JOBS[h.job].name,connected:false,ready:false});return s;}if(other){const repl=baseHero(h.job,other.id,other.owner,other.owner?other.name:JOBS[h.job].name);Object.assign(other,repl);}const old={owner:h.owner,name:h.name,connected:h.connected};Object.assign(h,baseHero(job,h.id,old.owner,old.owner?old.name:JOBS[job].name),{connected:old.connected});return s;}

function item(s,h,quality=1,slot=null){const slots=['weapon','armor','charm'];slot=slot||slots[Math.floor(rnd(s)*3)];const r=clamp(quality,1,3);const pre=['','별빛','서약','황혼'];const nouns={weapon:{knight:'수호검',ranger:'장궁',mage:'마도봉',cleric:'성물',rogue:'단검'},armor:{knight:'판금 갑주',ranger:'숲의 망토',mage:'별무늬 로브',cleric:'성역의 예복',rogue:'그림자 외투'},charm:{knight:'사자 인장',ranger:'바람 깃털',mage:'수정 조각',cleric:'여명의 목걸이',rogue:'달빛 반지'}};const stats=slot==='weapon'?{atk:3+r*3+Math.floor(s.depth/3)}:slot==='armor'?{hp:8+r*10,def:r+1}:{spd:r,atk:r+1};const pool={knight:['counter','ward','focus'],ranger:['hunter','agility','focus'],mage:['echo','hunter','ward'],cleric:['warmth','echo','ward'],rogue:['hunter','venom','agility']};return{id:uid(s,'item'),name:pre[r]+' '+nouns[slot][h.job],slot,rarity:r,stats,trait:pool[h.job][Math.floor(rnd(s)*pool[h.job].length)],price:48+r*30};}

function reach(s,h,steps=h.move){const b=s.battle,result=[{x:h.x,y:h.y,d:0}],seen=new Set([h.x+','+h.y]);for(let q=0;q<result.length;q++){const p=result[q];if(p.d>=steps)continue;for(const [dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=p.x+dx,y=p.y+dy,key=x+','+y;if(!seen.has(key)&&!blocked(b,x,y)&&!occupied(s,x,y,h.id)){seen.add(key);result.push({x,y,d:p.d+1});}}}return result;}

class="order-label">행동 순서</span>'+queue.slice(0,8).map((u,i)=>(i?'<span class="arrow">›</span>':'')+'<span class="'+(u.job?'':'enemy')+'">'+(u.job?E.JOBS[u.job].name:u.kind==='boss'?'보스':u.kind==='wisp'?'별불':'적')+'</span>').join('')+'</div></div><div class="skill-grid">'+keys.map((k,i)=>{const a=E.SKILLS[k];return'<button class="skill-btn '+(p?.skill===k?'selected':'')+' '+(a.ultimate?'ultimate':'')+'" data-a="skill" data-skill="'+k+'" title="'+esc(a.name+' · '+a.desc)+'" '+(!planning||locked||!E.alive(h)||!E.canUse(h,k)?'disabled':'')+'><span class="keycap">'+(i+1)+'</span>'+I(a.icon)+'<strong>'+a.name+'</strong><small>'+ (a.ultimate?'궁극기 '+h.charge+'%':'기력 '+a.cost)+'</small></button>';}).join('')+'</div><div class="utility-row"><button data-a="move" class="'+(G.ui.mode==='move'?'active':'')+'" '+(!planning||locked||!E.alive(h)?'disabled':'')+'>'+I('move')+'이동 [M]</button>'+['guard','potion','revive'].map(k=>'<button data-a="skill" data-skill="'+k+'" class="'+(p?.skill===k?'active':'')+'" '+(!planning||locked||!E.alive(h)?'disabled':'')+'>'+I(E.SKILLS[k].icon)+(k==='guard'?'방어':k==='potion'?'물약 '+s.potions:'구조')+'</button>').join('')+'<button data-a="suggest" '+(!planning||locked||!E.alive(h)?'disabled':'')+'>'+I('star')+'추천 행동</button></div><div class="tiny" style="font-size:10px">예약: '+esc(sk.name)+(target&&target.id!==h.id?' → '+esc(target.name):p?.cell?' → ('+(p.cell.x+1)+','+(p.cell.y+1)+')':'')+' · 이동 '+(p?.move?'('+(p.move.x+1)+','+(p.move.y+1)+')':'없음')+'</div></div><div class="confirm-area"><div class="timer-row"><span>선택 제한 시간</span><strong id="turn-clock">—</strong></div>'+btn('confirm',planning?(locked?'확정 취소':'행동 확정'):'행동 실행 중',locked?'clock':'check',locked?'ghost':'primary',!planning||!E.alive(h)?'disabled':'')+'<div class="ready-count">'+s.heroes.filter(u=>E.alive(u)&&b.plans[u.id]?.ready).length+' / '+s.heroes.filter(E.alive).length+'명 준비 · Enter</div>'+btn('guide','조작 방법','book','ghost small')+'</div></section></div>';},
 reward(s){return'<section class="screen room-screen"><div class="room-heading"><div class="eyebrow">THE OATH ENDURES</div><h2 class="victory-title">전투 승리</h2><p>서로를 믿은 선택이, 새로운 길을 열었습니다.</p></div><div class="stat-cards"><div><b>'+s.reward.gold+'</b><span>획득 골드</span></div><div><b>'+s.reward.xp+'</b><span>각자 경험치</span></div><div><b>+1</b><span>공용 물약</span></div></div><div class="loot-grid">'+s.loot.map(l=>{const h=s.heroes.find(x=>x.id===l.hero),it=l.item,equipped=h.gear[it.slot]?.id===it.id;return'<article class="panel loot-card"><div class="row spread"><span class="tiny">'+esc(h.name)+' · '+E.JOBS[h.job].name+'</span><span class="badge rarity-'+it.rarity+'">'+rarities[it.rarity]+'</span></div><div class="loot-icon">'+I(it.slot==='weapon'?h.job==='rogue'?'dagger':'sword':it.slot==='armor'?'shield':'rune')+'</div><h3 class="rarity-'+it.rarity+'">'+esc(it.name)+'</h3><div class="item-stats">'+stats(it)+'</div><p class="item-trait">'+trait(it)+'</p>'+btn('equip',equipped?'장착 중':'획득 장비 착용',equipped?'check':'bag','small ghost',(!canManage(h)||equipped?'disabled ':'')+'data-hero="'+h.id+'" data-item="'+it.id+'"')+'</article>';}).join('')+'</div><div class="route-hint">장비는 각자의 가방에 보관되었습니다. AI 동료는 더 좋은 장비를 자동 착용합니다.</div><div class="room-actions">'+btn('inventory','파티 장비 확인','bag','ghost')+btn('next','다음 길로','arrow','primary',G.isHost?'':'disabled')+'</div></section>';},
 rest(s){return'<section class="screen room-screen"><div class="room-heading"><div class="eyebrow">A MOMENT OF RESPITE</div><h2>별지기의 야영지</h2><p>오래된 등불이 아직 따뜻합니다. 함께 다음 걸음을 준비하세요.</p></div>'+miniParty(s)+'<div class="route-grid two"><button class="route-card" data-a="vote" data-choice="heal"><div class="route-art">'+I('camp')+'</div><div class="route-text"><span class="badge green">휴식</span><h3>등불 아래에서 쉬기</h3><p>파티 체력 65% 회복 · 기력 전체 회복<br>상태 이상 해제 · 물약 2개 보급</p>'+votes(s,'heal')+'</div><div class="route-bottom">회복과 보급 '+I('arrow')+'</div></button><button class="route-card" data-a="vote" data-choice="train"><div class="route-art">'+I('sword')+'</div><div class="route-text"><span class="badge">훈련</span><h3>합동 전술 연습</h3><p>파티 체력 28% · 기력 전체 회복<br>다음 전투 공격력 +20% · 궁극기 +20</p>'+votes(s,'train')+'</div><div class="route-bottom">다음 전투 강화 '+I('arrow')+'</div></button></div></section>';},
 shop(s){return'<section class="screen room-screen"><div class="room-heading"><div class="eyebrow">THE WANDERING MERCHANT</div><h2>방랑 상인의 수레</h2><p>“좋은 장비보다 귀한 건, 그 장비를 믿고 함께 걷는 동료지요.”</p></div><div class="row spread" style="margin-bottom:19px"><span class="pill">'+I('coin')+'파티 공용 골드 '+s.gold+' G</span>'+btn('buyPotions','물약 3개 · 35G','potion','small ghost',s.gold<35||s.potions>=12?'disabled':'')+'</div><div class="loot-grid">'+s.shop.map(l=>{const h=s.heroes.find(x=>x.id===l.hero),it=l.item,bought=s.purchased[it.id];return'<article class="panel loot-card"><span class="tiny">'+E.JOBS[h.job].name+' 전용 · '+esc(h.name)+'</span><div class="loot-icon">'+I(it.slot==='weapon'?'sword':it.slot==='armor'?'shield':'rune')+'</div><span class="badge rarity-'+it.rarity+'">'+rarities[it.rarity]+' '+slotNames[it.slot]+'</span><h3 style="margin-top:10px" class="rarity-'+it.rarity+'">'+it.name+'</h3><div class="item-stats">'+stats(it)+'</div><p class="item-trait">'+trait(it)+'</p>'+btn('buy',bought?'구입 완료':it.price+' G · 구입',bought?'check':'coin','small ghost',(!canManage(h)||bought||s.gold<it.price?'disabled ':'')+'data-hero="'+h.id+'" data-item="'+it.id+'"')+'</article>';}).join('')+'</div><div class="room-actions">'+btn('inventory','구입 장비 착용','bag','ghost')+btn('next','다음 길로','arrow','primary',G.isHost?'':'disabled')+'</div></section>';},
 puzzle(s){return'<section class="screen room-screen"><div class="room-heading"><div class="eyebrow">THE STARKEEPER’S RIDDLE</div><h2>세 개의 별 문양</h2><p>마모된 석판에 마지막 문장 하나가 남아 있습니다.</p></div><div class="panel puzzle-box">'+I('rune')+'<blockquote>“'+s.riddle.text+'”</blockquote>'+(s.riddle.solved?'<div class="description-box" style="justify-content:center">'+s.puzzleResult+'</div><div class="room-actions">'+btn('next','열린 길로 나아가기','arrow','primary',G.isHost?'':'disabled')+'</div>':'<div class="puzzle-answers">'+s.riddle.answers.map((t,i)=>'<button class="btn ghost" data-a="answer" data-choice="'+i+'">'+t+'</button>').join('')+'</div><div class="route-hint">'+s.riddle.answers.map((_,i)=>votes(s,i)).join('')+'모두의 투표로 하나의 답을 고릅니다.</div>')+'</div></section>';},

 defeat(s){return'<section class="screen room-screen"><div class="room-heading"><div class="eyebrow">THE LANTERN STILL BURNS</div>'+I('camp','big-symbol')+'<h2>등불은 아직 꺼지지 않았습니다</h2><p style="line-height:2;margin-top:18px">파티가 잠시 물러났습니다. 적의 공격 예고를 살펴보고<br>다른 위치와 연계 기술로 다시 도전해 보세요.</p></div>'+miniParty(s)+'<div class="room-actions">'+btn('retry','체크포인트에서 재도전','save','primary',G.isHost?'':'disabled')+btn('leave','타이틀로','home','ghost')+'</div></section>';},
 modal(title,body,wide=false,type='generic'){G.ui.modal=type;this.returnFocus=document.activeElement;$('modal').className='modal'+(wide?' wide':'');$('modal').innerHTML='<div class="modal-title"><h2 id="modal-heading">'+title+'</h2><button data-a="close" aria-label="닫기">'+I('close')+'</button></div>'+body;$('modal-wrap').hidden=false;setTimeout(()=>{$('modal').querySelector('input,button,select')?.focus();},0);},
 closeModal(){if($('modal-wrap').hidden)return;$('modal-wrap').hidden=true;G.ui.modal=null;if(this.returnFocus?.isConnected)this.returnFocus.focus();},
 online(kind){const create=kind==='host',saved=G.readSave();this.modal(create?'함께할 원정을 만드세요':'동료의 원정에 합류하세요','<div class="form-field"><label for="player-name">플레이어 이름</label><input id="player-name" maxlength="12" value="'+esc(G.name)+'" placeholder="모험가 이름"></div>'+(!create?'<div class="form-field"><label for="room-input">방 코드</label><input id="room-input" maxlength="12" style="text-transform:uppercase;letter-spacing:3px" placeholder="7자리 방 코드" autocomplete="off"></div>':'')+'<div class="form-field"><label for="connection-mode">연결 방식</label><select id="connection-mode">'+(G.relayAvailable?'<option value="relay">서버 연결 · 이 주소에서 함께하기</option>':'')+'<option value="peer">인터넷 연결 · 방 코드로 함께하기</option></select></div>'+(create&&saved?'<label class="help-text"><input type="checkbox" id="resume-online"> 저장된 원정을 이어서 시작</label>':'')+'<p class="help-text" style="margin-top:13px">1~4명까지 참가할 수 있습니다. 방장은 플레이하는 동안 게임을 열어 두세요. 인터넷 연결은 네트워크 환경에 따라 제한될 수 있습니다.</p><div id="connect-note" class="loading-note"></div><div class="modal-actions">'+btn('close','취소','','ghost')+btn(create?'createOnline':'joinOnline',create?'방 만들기':'방 참가','wifi','primary','id="connect-btn"')+'</div>',false,'online');},

 enableConnect(){if($('connect-btn'))$('connect-btn').disabled=false;},
 jobs(id){const h=G.state.heroes.find(x=>x.id===id);if(!h)return;this.modal('직업 선택 · '+esc(h.owner?h.name:'AI 동료'),'<p class="help-text" style="margin-bottom:20px">서로 다른 4개 직업으로 파티를 구성합니다. AI가 맡은 직업을 선택하면 서로 자리를 바꿉니다.</p><div class="job-picks">'+Object.entries(E.JOBS).map(([k,j])=>{const taken=G.state.heroes.some(x=>x.job===k&&x.id!==id&&x.owner)||G.state.resumePhase&&!G.state.heroes.some(x=>x.job===k);return'<button class="job-pick '+(h.job===k?'active':'')+'" data-a="chooseJob" data-id="'+id+'" data-job="'+k+'" '+(taken?'disabled':'')+'>'+P(k)+'<strong>'+j.name+'</strong><small>'+j.desc+'</small><span class="badge">'+(taken?'다른 플레이어 선택':h.job===k?'선택 중':'체력 '+j.hp+' · 속도 '+j.spd)+'</span></button>';}).join('')+'</div>',true,'jobs');},
 inventory(id){const s=G.state;if(!s)return;G.ui.invHero=id||G.ui.invHero||G.me()?.id||s.heroes[0].id;const h=s.heroes.find(x=>x.id===G.ui.invHero)||s.heroes[0];const manage=canManage(h)&&s.phase!=='battle';this.modal('파티 장비','<div class="inv-tabs">'+s.heroes.map(x=>'<button class="'+(h.id===x.id?'active':'')+'" data-a="invHero" data-id="'+x.id+'">'+E.JOBS[x.job].name+' · Lv.'+x.level+'</button>').join('')+'</div><div class="row spread" style="margin-bottom:16px"><div><h3 style="font-weight:500">'+esc(h.name)+'</h3><span class="tiny">체력 '+h.maxHp+' · 공격 '+h.atk+' · 방어 '+h.def+' · 속도 '+h.spd+'</span></div><span class="badge">'+(s.phase==='battle'?'전투 중 교체 불가':canManage(h)?'장비 교체 가능':'팀원 장비 보기')+'</span></div><div class="equipped">'+Object.entries(h.gear).map(([k,it])=>'<div class="equip-slot"><div class="slot-label">'+slotNames[k]+'</div><span class="rarity-'+(it?.rarity||0)+'">'+esc(it?.name||'장착하지 않음')+'</span></div>').join('')+'</div><div class="side-title">보관 중인 장비 · '+h.inventory.length+' / 36</div><div class="inventory-list">'+h.inventory.slice().reverse().map(it=>{const wearing=h.gear[it.slot]?.id===it.id;return'<div class="inventory-item">'+I(it.slot==='weapon'?'sword':it.slot==='armor'?'shield':'rune')+'<div><h3 class="rarity-'+it.rarity+'">'+esc(it.name)+'</h3><div class="item-stats">'+stats(it)+'</div><div class="item-trait">'+trait(it)+'</div></div><button data-a="invEquip" data-hero="'+h.id+'" data-item="'+it.id+'" '+(!manage||wearing?'disabled':'')+'>'+(wearing?'착용 중':'착용')+'</button></div>';}).join('')+'</div><p class="help-text" style="margin-top:16px">무기·방어구·장신구의 특수 효과는 모두 적용됩니다. 가방이 가득 차면 착용하지 않은 가장 낮은 가치의 장비부터 정리됩니다.</p>',true,'inventory');},
 guide(){const cards=[['move','이동과 행동','매 라운드 이동 1회와 행동 1회를 예약합니다. [M] 또는 이동 버튼 → 밝은 칸을 클릭하세요. 이동을 정한 뒤 기술과 대상을 선택합니다.'],['check','동시에 선택하고, 함께 실행','4명의 선택을 모두 확정하면 속도가 높은 순으로 실행합니다. 다른 동료가 고르는 동안 확정을 취소할 수 있습니다. 선택 제한 시간이 지나면 자동 방어합니다.'],['target','적의 행동을 읽으세요','붉은 칸은 적이 예고한 공격 범위입니다. 전장의 ! 표식과 오른쪽 목록을 확인하세요. 이동으로 범위 공격을 피하고, 기본 공격은 사거리와 장애물의 영향을 받습니다.'],['spark','연계 공격','궁수의 표식 → 도적의 기습, 마법사의 냉기·물 지형 → 번개로 연계합니다. 표식 대상에 기사가 공격하면 방어도 약화됩니다. 궁극기는 충전 100일 때 사용합니다.'],['heart','회복과 동료 구조','체력 0인 동료는 3라운드 안에 인접한 칸에서 구조할 수 있습니다. 구조 직후에는 잠시 보호됩니다. 회복 대상이 건강해지면 유효한 다른 부상자로 자동 전환합니다.'],['users','1~4인 온라인과 저장','혼자 시작해도 나머지 세 명은 AI가 조작합니다. 온라인에서는 방 코드를 공유해 참가하세요. 접속이 끊기면 캐릭터를 유지하며 재접속합니다. 방장이 나가면 설정의 저장 기록으로 새 방을 만들 수 있습니다.']];this.modal('게임 방법','<div class="guide-grid">'+cards.map(([i,t,p])=>'<article class="guide-card"><h3>'+I(i)+t+'</h3><p>'+p+'</p></article>').join('')+'</div><div class="guide-controls"><b>단축키</b> · M 이동 · 1 기본 공격 · 2~5 기술 · 6 궁극기 · G 방어 · Q 물약 · E 구조 · Enter/Space 확정 · B 장비 · H 도움말 · Esc 닫기<br><br>처음에는 「추천 행동」을 누르고 예약 내용을 확인해 보세요. 이 버튼은 행동을 확정하지 않습니다.</div>',true,'guide');},
 codex(){this.modal('모험가 도감','<p class="help-text" style="margin-bottom:20px">모든 직업은 기본 공격, 방어, 물약, 동료 구조를 사용할 수 있습니다. 기술 4개와 궁극기 1개는 처음부터 사용할 수 있습니다.</p><div class="codex-classes">'+Object.entries(E.JOBS).map(([k,j])=>'<div><div class="portrait">'+P(k)+'</div><h3>'+j.name+'</h3><p>'+j.passive+'</p>'+j.skills.map(key=>{const sk=E.SKILLS[key];return'<div class="codex-skill">'+sk.name+(sk.ultimate?' [궁극기]':' · 기력 '+sk.cost)+'<span>'+sk.desc+'</span></div>';}).join('')+'</div>').join('')+'</div><div class="description-box">'+I('crown')+'<div>보스의 공명 결정은 본체를 회복합니다. 먼저 장치를 처리하고, 붉은 공격 예고에서 벗어나세요. 보스는 체력 55% 아래에서 강화됩니다.</div></div>',true,'codex');},
 settings(){const saved=G.readSave();this.modal('설정과 원정 기록','<div class="settings-row"><span>소리와 배경음</span>'+btn('sound',G.audio.enabled?'켜짐':'꺼짐',G.audio.enabled?'sound':'mute','small ghost')+'</div><div class="settings-row"><label for="effect-quality">화면 효과</label><select id="effect-quality"><option value="high" '+(!G.painter.low?'selected':'')+'>높음</option><option value="low" '+(G.painter.low?'selected':'')+'>가볍게 · 30fps</option></select></div><div class="settings-row"><label for="battle-speed">행동 연출 속도</label><select id="battle-speed">'+[1,1.5,2].map(v=>'<option value="'+v+'" '+(G.ui.speed===v?'selected':'')+'>'+v+'배</option>').join('')+'</select></div><p class="help-text">온라인 전투의 연출 속도는 방장 설정을 따릅니다. 브라우저의 동작 줄이기 설정도 반영합니다.</p><div class="sep"></div><div class="stack">'+btn('save','지금 저장','save','ghost',G.state?'':'disabled')+btn('exportSave','저장 파일 내보내기','save','ghost',saved||G.checkpoint?'':'disabled')+btn('importSave','저장 파일 가져오기','book','ghost')+'</div><p class="help-text" style="margin-top:14px">체크포인트를 자동 저장합니다. 다른 컴퓨터나 브라우저로 옮길 때는 저장 파일을 내보내세요.</p>'+(G.state?'<div class="sep"></div>'+btn('leave','타이틀로 돌아가기','home','ghost','style="width:100%"'):'')+'<p class="tiny" style="margin-top:20px">OATHBOUND v1.0 · 원본 벡터 아트 및 절차적 오디오<br>PeerJS 1.5.5 · MIT License · 네트워크 연결에만 사용</p>',false,'settings');},
 connection(){const s=G.state;if(s&&G.transport!=='solo'&&!G.isHost&&!G.net.connected){$('connection').innerHTML='<div class="connection-banner"><span><span class="spinner"></span>방장과 다시 연결하고 있습니다. 캐릭터와 진행 기록은 유지됩니다.</span>'+btn('takeSolo','혼자 이어하기','save','small ghost')+'</div>';}else $('connection').replaceChildren();if(s&&G.transport!=='solo'){const footer=$('footer-state');if(footer)footer.textContent='방 '+G.room+' · '+(G.isHost?'방장':G.net.connected?'연결됨 · '+G.net.ping+' ms':'재접속 중')+' · '+(s.phase==='lobby'?'원정 준비':'자동 저장');}},
 timer(){const s=G.state,clock=$('turn-clock');if(clock&&s?.phase==='battle'){clock.textContent=s.battle.phase==='resolve'?'실행 중':s.settings.turnSeconds===0?'∞':Math.max(0,Math.ceil((s.battle.deadline-(Date.now()-(G.clockOffset||0)))/1000))+'s';}},
 exportSave(){G.save();const data=G.checkpoint||G.readSave();if(!data){G.toast('내보낼 저장 기록이 없습니다.',true);return;}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='oathbound_save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},
 leave(){if(!G.state)return G.quit();if(G.state.phase==='lobby'||G.state.phase==='ending')return G.quit();this.modal('원정을 잠시 멈출까요?','<p class="help-text">마지막 행동 선택 단계까지의 진행은 저장됩니다.'+(G.transport!=='solo'&&G.isHost?' 방장이 나가면 친구들의 연결도 중단됩니다.':'')+'</p><div class="modal-actions">'+btn('close','계속하기','','ghost')+btn('quit','저장하고 타이틀로','home','primary')+'</div>');}
};
window.UI=U;
document.addEventListener('click',async event=>{const el=event.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,s=G.state,h=G.selected();try{switch(a){
case'solo':G.name=G.storage.get('oathbound.name')||G.name;await G.solo();if(G.state)G.command({type:'settings',seconds:0});break;
case'continue':await G.solo(true);break;
case'host':case'join':U.online(a);break;
case'createOnline':case'joinOnline':await G.online(a==='createOnline',$('connection-mode').value,$('room-input')?.value,$('player-name').value,$('resume-online')?.checked);break;
case'close':U.closeModal();break;
case'jobs':U.jobs(el.dataset.id);break;
case'chooseJob':G.command({type:'class',hero:el.dataset.id,job:el.dataset.job});U.closeModal();break;
case'ready':G.command({type:'ready'});break;
case'start':G.command({type:'start'});break;
case'map':G.command({type:'map'});break;
case'vote':G.command({type:'vote',choice:el.dataset.choice});break;
case'answer':G.command({type:'vote',choice:Number(el.dataset.choice)});break;
case'next':G.command({type:'next'});break;
case'equip':case'invEquip':G.command({type:'equip',hero:el.dataset.hero,item:el.dataset.item});if(a==='invEquip'){if(G.isHost)U.inventory(el.dataset.hero);else setTimeout(()=>{if(G.ui.modal==='inventory')U.inventory(el.dataset.hero);},350);}break;
case'buy':G.command({type:'buy',hero:el.dataset.hero,item:el.dataset.item});break;
case'buyPotions':G.command({type:'buy',hero:G.me().id,item:'potions'});break;
case'heroTarget':{if(s?.phase!=='battle')break;const target=s.heroes.find(x=>x.id===el.dataset.id),sk=E.SKILLS[G.ui.draft?.skill];if(['ally','down'].includes(sk?.target)){G.ui.draft.target=target.id;G.publishDraft(true);}else if(target.owner===G.identity){G.ui.selected=target.id;G.render();}else G.toast(E.JOBS[target.job].name+' · '+planText(s,target));break;}
case'skill':G.skill(el.dataset.skill);break;
case'move':if(h&&E.alive(h)&&s.battle.phase==='plan'&&!s.battle.plans[h.id]?.ready){G.ui.mode=G.ui.mode==='move'?'target':'move';G.render();}break;
case'confirm':G.confirm();break;
case'suggest':G.suggest();break;
case'ping':G.command({type:'ping',text:el.dataset.text});break;
case'guide':U.guide();break;
case'codex':U.codex();break;
case'settings':U.settings();break;
case'inventory':U.inventory();break;
case'invHero':U.inventory(el.dataset.id);break;
case'sound':G.audio.enable(!G.audio.enabled);G.render();if(G.ui.modal==='settings')U.settings();break;
case'save':G.save(G.state,true);break;
case'exportSave':U.exportSave();break;
case'importSave':$('import-save').click();break;
case'copyCode':try{await navigator.clipboard.writeText(G.room);G.toast('방 코드를 복사했습니다.');}catch{G.toast('방 코드: '+G.room);}break;
case'leave':U.leave();break;
case'quit':G.quit();break;
case'takeSolo':G.takeSolo();break;
case'retry':{const saved=G.checkpoint||G.readSave();if(!saved)throw Error('저장한 체크포인트가 없습니다.');const owners=s.heroes.map(x=>({id:x.id,owner:x.owner,name:x.name,connected:x.connected}));G.state=E.clone(saved);for(const x of G.state.heroes){const o=owners.find(y=>y.id===x.id);if(o)Object.assign(x,o);}G.state.rev=s.rev+1;G.state.epoch=s.epoch;G.state.battle.deadline=Date.now()+G.state.settings.turnSeconds*1000;G.ui.key='';G.ui.draft=null;G.commit();break;}
}}catch(error){G.toast(error.message||'처리 중 오류가 발생했습니다.',true);}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='difficulty')G.command({type:'settings',difficulty:el.value});if(el.id==='turn-seconds')G.command({type:'settings',seconds:Number(el.value)});if(el.id==='effect-quality'){G.painter.low=el.value==='low';}if(el.id==='battle-speed'){G.ui.speed=Number(el.value);G.storage.set('oathbound.speed',String(G.ui.speed));}});
$('modal-wrap').addEventListener('click',event=>{if(event.target===$('modal-wrap'))U.closeModal();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){U.closeModal();return;}if(! $('modal-wrap').hidden){if(event.key==='Tab'){const items=[...$('modal').querySelectorAll('button:not(:disabled),input,select,a[href]')].filter(x=>x.offsetParent!==null);if(items.length&&event.shiftKey&&document.activeElement===items[0]){event.preventDefault();items[items.length-1].focus();}else if(items.length&&!event.shiftKey&&document.activeElement===items[items.length-1]){event.preventDefault();items[0].focus();}}return;}if(/INPUT|SELECT|TEXTAREA/.test(event.target.tagName)||event.ctrlKey||event.metaKey||event.altKey)return;const k=event.key.toLowerCase();if(k==='h'){U.guide();return;}if(k==='b'){U.inventory();return;}const s=G.state,h=G.selected();if(s?.phase!=='battle'||!h)return;if(['enter',' ','m','g','q','e','1','2','3','4','5','6'].includes(k))event.preventDefault();if(k==='enter'||k===' ')G.confirm();else if(k==='m'){if(s.battle.phase==='plan'&&!s.battle.plans[h.id]?.ready){G.ui.mode=G.ui.mode==='move'?'target':'move';G.render();}}else if(k==='g')G.skill('guard');else if(k==='q')G.skill('potion');else if(k==='e')G.skill('revive');else if(/^[1-6]$/.test(k))G.skill(['attack',...E.JOBS[h.job].skills][Number(k)-1]);});
$('import-save').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('저장 파일이 너무 큽니다.');const data=JSON.parse(await file.text());E.resume(data,G.identity,G.name);G.imported=data;G.storage.set('oathbound.save',JSON.stringify(data));G.toast('저장 파일을 가져왔습니다. 타이틀의 이어하기 또는 온라인 방 만들기에서 사용할 수 있습니다.');U.closeModal();G.render();}catch(e){G.toast('저장 파일을 열 수 없습니다. '+e.message,true);}event.target.value='';});
G.boot();
})();
</script>
