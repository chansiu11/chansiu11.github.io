<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>온라인 멀티플레이어 슈팅 게임</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            flex-direction: column;
        }
        #loginScreen {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            background: #222;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #00ffcc;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #111111;
            display: none;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="loginScreen">
    <h2>닉네임을 입력하세요</h2>
    <input type="text" id="nicknameInput" placeholder="플레이어 이름" maxlength="10">
    <button onclick="startGame()">게임 시작</button>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const socket = io();
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let myId = null;
let nickname = "";
const keys = {};
const mouse = { x: 0, y: 0 };

let serverPlayers = {};
let serverBullets = [];

// 플레이어 자체 좌표 (키보드 이동 처리용)
const myPlayer = { x: 400, y: 300, speed: 4, angle: 0 };

function startGame() {
    const input = document.getElementById('nicknameInput');
    nickname = input.value.trim() || "플레이어";
    
    document.getElementById('loginScreen').style.display = 'none';
    canvas.style.display = 'block';

    // 서버에 접속 및 닉네임 전달
    socket.emit('joinGame', nickname);
    
    // 이벤트 등록
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('click', shoot);

    gameLoop();
}

socket.on('connect', () => { myId = socket.id; });

// 서버로부터 실시간 데이터 수신
socket.on('gameState', (data) => {
    serverPlayers = data.players;
    serverBullets = data.bullets;
});

function shoot() {
    socket.emit('shoot', {
        x: myPlayer.x,
        y: myPlayer.y,
        dx: Math.cos(myPlayer.angle) * 8,
        dy: Math.sin(myPlayer.angle) * 8
    });
}

function update() {
    // 이동 처리
    if (keys['w'] || keys['W']) myPlayer.y -= myPlayer.speed;
    if (keys['s'] || keys['S']) myPlayer.y += myPlayer.speed;
    if (keys['a'] || keys['A']) myPlayer.x -= myPlayer.speed;
    if (keys['d'] || keys['D']) myPlayer.x += myPlayer.speed;

    // 조준 각도
    myPlayer.angle = Math.atan2(mouse.y - myPlayer.y, mouse.x - myPlayer.x);

    // 위치 정보를 서버로 전송
    socket.emit('playerMove', {
        x: myPlayer.x,
        y: myPlayer.y,
        angle: myPlayer.angle
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 총알 그리시
    serverBullets.forEach(bullet => {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffff00';
        ctx.fill();
    });

    // 2. 다른/자신 플레이어들 그리기
    Object.values(serverPlayers).forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        
        // 닉네임 표시
        ctx.fillStyle = '#ffffff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, 0, -25);

        // 캐릭터 회전 및 그리기
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(0, -3, 22, 6); // 총구
        ctx.restore();
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
