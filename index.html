<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 RPG 게임</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background-color: #2d2d2d;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #4caf50;
    }
    .screen {
      display: none;
    }
    .active {
      display: block;
    }
    /* Form & Button Styles */
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #ccc;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background-color: #3e3e3e;
      color: #fff;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #45a049;
    }
    button.secondary {
      background-color: #555;
    }
    button.secondary:hover {
      background-color: #666;
    }
    button.danger {
      background-color: #e53935;
    }
    button.danger:hover {
      background-color: #d32f2f;
    }
    .switch-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
      cursor: pointer;
      text-decoration: underline;
    }
    /* Game Info & Log Box */
    .status-board {
      background-color: #383838;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .log-box {
      height: 150px;
      background-color: #111;
      border-radius: 6px;
      padding: 10px;
      overflow-y: auto;
      font-size: 13px;
      color: #00ff66;
      font-family: monospace;
      margin-bottom: 15px;
    }
    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. 로그인 화면 -->
  <div id="screen-login" class="screen active">
    <h1>로그인</h1>
    <div class="form-group">
      <label>아이디</label>
      <input type="text" id="login-username" placeholder="아이디를 입력하세요">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="login-password" placeholder="비밀번호를 입력하세요">
    </div>
    <button onclick="handleLogin()">로그인</button>
    <div class="switch-link" onclick="showScreen('screen-signup')">계정이 없으신가요? 회원가입</div>
  </div>

  <!-- 2. 회원가입 화면 -->
  <div id="screen-signup" class="screen">
    <h1>회원가입</h1>
    <div class="form-group">
      <label>아이디</label>
      <input type="text" id="signup-username" placeholder="새 아이디 입력">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="signup-password" placeholder="새 비밀번호 입력">
    </div>
    <button onclick="handleSignup()">가입하기</button>
    <div class="switch-link" onclick="showScreen('screen-login')">로그인 화면으로 돌아가기</div>
  </div>

  <!-- 3. 메인 메뉴 화면 -->
  <div id="screen-menu" class="screen">
    <h1 id="user-welcome">환영합니다!</h1>
    <p style="text-align: center; margin-bottom: 20px; color: #bbb;">원하는 메뉴를 선택하세요.</p>
    <button onclick="showScreen('screen-game')">⚔️ RPG 게임 시작</button>
    <button class="secondary" onclick="saveGameData()">💾 데이터 저장하기</button>
    <button class="danger" onclick="handleLogout()">로그아웃</button>
  </div>

  <!-- 4. RPG 게임 화면 -->
  <div id="screen-game" class="screen">
    <h2>⚔️ 미니 RPG</h2>
    
    <div class="status-board">
      <div><strong>플레이어:</strong> <span id="p-name">-</span> (Lv.<span id="p-level">1</span>)</div>
      <div><strong>체력:</strong> <span id="p-hp">100</span> / <span id="p-max-hp">100</span></div>
      <div><strong>공격력:</strong> <span id="p-atk">10</span></div>
      <div><strong>경험치:</strong> <span id="p-exp">0</span> / <span id="p-max-exp">20</span></div>
      <div><strong>골드:</strong> <span id="p-gold">0</span> G</div>
    </div>

    <div class="log-box" id="game-log">
      게임에 접속했습니다.<br>
    </div>

    <div class="button-grid">
      <button onclick="hunt()">👹 몬스터 사냥</button>
      <button onclick="heal()" class="secondary">🍺 휴식하기 (10 Gold)</button>
      <button onclick="upgradeAtk()" class="secondary">⚔️ 공격력 강화 (20 Gold)</button>
      <button onclick="showScreen('screen-menu')" class="danger">🚪 메인 메뉴로</button>
    </div>
  </div>
</div>

<script>
  // 사용자 정보 및 게임 데이터 State
  let users = JSON.parse(localStorage.getItem('rpg_users')) || {};
  let currentUser = null;

  // 화면 전환 함수
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // 로그 출력 함수
  function log(message) {
    const logBox = document.getElementById('game-log');
    logBox.innerHTML += message + '<br>';
    logBox.scrollTop = logBox.scrollHeight;
  }

  // 1. 회원가입
  function handleSignup() {
    const user = document.getElementById('signup-username').value.trim();
    const pass = document.getElementById('signup-password').value.trim();

    if (!user || !pass) {
      alert('아이디와 비밀번호를 올바르게 입력해주세요.');
      return;
    }
    if (users[user]) {
      alert('이미 존재하는 아이디입니다.');
      return;
    }

    // 신규 유저 생성 및 초기 RPG 데이터
    users[user] = {
      password: pass,
      gameData: {
        level: 1,
        hp: 100,
        maxHp: 100,
        atk: 10,
        exp: 0,
        maxExp: 20,
        gold: 0
      }
    };

    localStorage.setItem('rpg_users', JSON.stringify(users));
    alert('회원가입이 완료되었습니다! 로그인 해주세요.');
    showScreen('screen-login');
  }

  // 2. 로그인
  function handleLogin() {
    const user = document.getElementById('login-username').value.trim();
    const pass = document.getElementById('login-password').value.trim();

    if (!users[user] || users[user].password !== pass) {
      alert('아이디 또는 비밀번호가 일치하지 않습니다.');
      return;
    }

    currentUser = user;
    document.getElementById('user-welcome').innerText = `${currentUser}님 환영합니다!`;
    updateGameUI();
    showScreen('screen-menu');
  }

  // 3. 로그아웃
  function handleLogout() {
    saveGameData();
    currentUser = null;
    alert('로그아웃 되었습니다.');
    showScreen('screen-login');
  }

  // 4. 게임 데이터 UI 업데이트
  function updateGameUI() {
    if (!currentUser) return;
    const data = users[currentUser].gameData;
    
    document.getElementById('p-name').innerText = currentUser;
    document.getElementById('p-level').innerText = data.level;
    document.getElementById('p-hp').innerText = data.hp;
    document.getElementById('p-max-hp').innerText = data.maxHp;
    document.getElementById('p-atk').innerText = data.atk;
    document.getElementById('p-exp').innerText = data.exp;
    document.getElementById('p-max-exp').innerText = data.maxExp;
    document.getElementById('p-gold').innerText = data.gold;
  }

  // 5. 게임 데이터 저장
  function saveGameData() {
    if (currentUser) {
      localStorage.setItem('rpg_users', JSON.stringify(users));
      log("💾 게임 데이터가 저장되었습니다.");
    }
  }

  // --- RPG 게임 시스템 ---

  // 몬스터 사냥
  function hunt() {
    const data = users[currentUser].gameData;

    if (data.hp <= 0) {
      log("❌ 체력이 없습니다! 휴식을 취하세요.");
      return;
    }

    const monsterHp = Math.floor(Math.random() * 20) + 10;
    const monsterAtk = Math.floor(Math.random() * 5) + 3;
    const earnedExp = Math.floor(Math.random() * 5) + 5;
    const earnedGold = Math.floor(Math.random() * 10) + 5;

    // 전투 처리
    data.hp = Math.max(0, data.hp - monsterAtk);
    data.exp += earnedExp;
    data.gold += earnedGold;

    log(`⚔️ 몬스터를 처치했습니다! (-${monsterAtk} HP / +${earnedExp} EXP / +${earnedGold} G)`);

    // 레벨업 체크
    if (data.exp >= data.maxExp) {
      data.level += 1;
      data.exp -= data.maxExp;
      data.maxExp = Math.floor(data.maxExp * 1.5);
      data.maxHp += 20;
      data.hp = data.maxHp; // 레벨업 시 체력 회복
      data.atk += 3;
      log(`🎉 **레벨업!** (Level ${data.level} 달성! 능력치가 증가합니다)`);
    }

    updateGameUI();
    saveGameData();
  }

  // 체력 회복
  function heal() {
    const data = users[currentUser].gameData;
    const cost = 10;

    if (data.gold < cost) {
      log("❌ 골드가 부족합니다! (필요: 10 Gold)");
      return;
    }
    if (data.hp >= data.maxHp) {
      log("이미 체력이 가득 차 있습니다.");
      return;
    }

    data.gold -= cost;
    data.hp = Math.min(data.maxHp, data.hp + 30);
    log(`🍺 휴식을 취하여 체력을 30 회복했습니다. (-10 Gold)`);
    
    updateGameUI();
    saveGameData();
  }

  // 공격력 강화
  function upgradeAtk() {
    const data = users[currentUser].gameData;
    const cost = 20;

    if (data.gold < cost) {
      log("❌ 골드가 부족합니다! (필요: 20 Gold)");
      return;
    }

    data.gold -= cost;
    data.atk += 2;
    log(`⚔️ 무기를 강화하여 공격력이 2 증가했습니다! (-20 Gold)`);

    updateGameUI();
    saveGameData();
  }
</script>

</body>
</html>
