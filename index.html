<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키보드 전용 스네이크 게임</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #gameContainer {
            text-align: center;
        }
        canvas {
            border: 3px solid #00ffcc;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        #ui {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #help {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui">점수: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="help">조작법: 키보드 방향키 (↑, ↓, ←, →) | 재시작: Spacebar</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameOver = false;
        let gameLoop;

        // 키보드 입력 처리
        window.addEventListener('keydown', (e) => {
            // 방향키로 이동 (반대 방향 전환 방지)
            if (e.key === 'ArrowUp' && dy === 0) {
                dx = 0; dy = -1;
            } else if (e.key === 'ArrowDown' && dy === 0) {
                dx = 0; dy = 1;
            } else if (e.key === 'ArrowLeft' && dx === 0) {
                dx = -1; dy = 0;
            } else if (e.key === 'ArrowRight' && dx === 0) {
                dx = 1; dy = 0;
            } else if (e.key === ' ' && gameOver) {
                // 스페이스바로 게임 재시작
                resetGame();
            }
        });

        function draw() {
            if (gameOver) return;

            // 뱀 위치 업데이트
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 벽 충돌 검사
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // 자기 자신과 충돌 검사
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // 음식 섭취 처리
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                spawnFood();
            } else {
                snake.pop();
            }

            // 화면 그리기
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 음식 그리기
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            // 뱀 그리기
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#00ffcc' : '#00b390';
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // 음식 위치가 뱀 몸통과 겹치지 않게 조율
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameLoop);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('게임 오버!', canvas.width / 2, canvas.height / 2 - 10);

            ctx.font = '18px Arial';
            ctx.fillText('Spacebar를 눌러 다시 시작', canvas.width / 2, canvas.height / 2 + 30);
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            gameOver = false;
            scoreEl.innerText = score;
            spawnFood();
            clearInterval(gameLoop);
            gameLoop = setInterval(draw, 100);
        }

        // 게임 시작
        gameLoop = setInterval(draw, 100);
    </script>
</body>
</html>
