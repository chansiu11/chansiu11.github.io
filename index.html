<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>암 치료 및 종양 성장 예측 시뮬레이션 (Cellular Automata)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a24;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 10px;
            color: #4da6ff;
            font-size: 1.5rem;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }
        .panel {
            background: #242432;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .controls {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .simulation {
            flex: 2;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            background: #181820;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
        }
        input[type="range"] {
            padding: 0;
            accent-color: #4da6ff;
        }
        .preset-info {
            background: #181820;
            border-left: 3px solid #4da6ff;
            padding: 8px 10px;
            font-size: 0.8rem;
            color: #ccc;
            line-height: 1.4;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start { background-color: #2e7d32; color: white; }
        .btn-start:hover { background-color: #388e3c; }
        .btn-pause { background-color: #f57f17; color: white; }
        .btn-pause:hover { background-color: #fbc02d; }
        .btn-reset { background-color: #c62828; color: white; }
        .btn-reset:hover { background-color: #d32f2f; }
        
        canvas {
            border: 2px solid #333;
            border-radius: 4px;
            background-color: #111;
        }
        .stats {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .stat-card {
            background: #181820;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid #4da6ff;
        }
        .stat-card.red { border-left-color: #ff5252; }
        .stat-card.purple { border-left-color: #ab47bc; }
        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 3px;
        }
        .legend {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <h1>암종별 치료 및 종양 성장 예측 시뮬레이션</h1>

    <div class="container">
        <div class="panel controls">
            <div class="control-group">
                <label for="cancer-type">암종 선택</label>
                <select id="cancer-type">
                    <option value="breast">유방암 (중등도 증식 / 중간 내성)</option>
                    <option value="gbm">뇌교종/GBM (고속 증식 / 높은 내성)</option>
                    <option value="prostate">전립선암 (저속 증식 / 낮은 내성)</option>
                    <option value="nsclc">비소세포폐암 (고속 증식 / 중등도 내성)</option>
                </select>
            </div>

            <div class="preset-info" id="preset-details">
                </div>

            <div class="control-group">
                <label>치료 주기 <span id="val-interval">7일 (1주)</span></label>
                <input type="range" id="param-interval" min="1" max="30" step="1" value="7">
            </div>

            <div class="btn-group">
                <button class="btn-start" id="btn-start">시작</button>
                <button class="btn-pause" id="btn-pause">일시정지</button>
                <button class="btn-reset" id="btn-reset">초기화</button>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="color-box" style="background:#ff5252;"></div>일반 암세포</div>
                <div class="legend-item"><div class="color-box" style="background:#ab47bc;"></div>내성 암세포</div>
                <div class="legend-item"><div class="color-box" style="background:#111; border:1px solid #333;"></div>빈 공간</div>
            </div>
        </div>

        <div class="panel simulation">
            <canvas id="simCanvas" width="400" height="400"></canvas>
            
            <div class="stats">
                <div class="stat-card">
                    <div>경과 시간</div>
                    <div class="stat-value" id="stat-step">0일</div>
                </div>
                <div class="stat-card red">
                    <div>일반 암세포 수</div>
                    <div class="stat-value" id="stat-normal">0</div>
                </div>
                <div class="stat-card purple">
                    <div>내성 암세포 수</div>
                    <div class="stat-value" id="stat-resistant">0</div>
                </div>
            </div>

            <canvas id="chartCanvas" width="400" height="100"></canvas>
        </div>
    </div>

    <script>
        const GRID_SIZE = 100;
        const CELL_SIZE = 4;
        
        const EMPTY = 0;
        const NORMAL = 1;
        const RESISTANT = 2;

        // 암종별 생물학적 파라미터 프리셋
        const CANCER_PRESETS = {
            breast: {
                name: "유방암",
                growth: 0.15,
                kill: 0.70,
                resist: 0.05,
                desc: "증식 속도: 보통 | 치료 반응성: 양호 | 내성 변이율: 보통"
            },
            gbm: {
                name: "뇌교종 (GBM)",
                growth: 0.35,
                kill: 0.45,
                resist: 0.12,
                desc: "증식 속도: 매우 빠름 | 치료 반응성: 낮음 | 내성 변이율: 높음"
            },
            prostate: {
                name: "전립선암",
                growth: 0.08,
                kill: 0.85,
                resist: 0.02,
                desc: "증식 속도: 느림 | 치료 반응성: 높음 | 내성 변이율: 낮음"
            },
            nsclc: {
                name: "비소세포폐암",
                growth: 0.25,
                kill: 0.60,
                resist: 0.08,
                desc: "증식 속도: 빠름 | 치료 반응성: 보통 | 내성 변이율: 높음"
            }
        };

        let currentPreset = CANCER_PRESETS.breast;

        let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(EMPTY));
        let isRunning = false;
        let dayCount = 0;
        let animId = null;

        let historyNormal = [];
        let historyResistant = [];

        const simCanvas = document.getElementById('simCanvas');
        const simCtx = simCanvas.getContext('2d');
        const chartCanvas = document.getElementById('chartCanvas');
        const chartCtx = chartCanvas.getContext('2d');

        const cancerSelect = document.getElementById('cancer-type');
        const presetDetails = document.getElementById('preset-details');
        const paramInterval = document.getElementById('param-interval');

        function updatePresetUI() {
            currentPreset = CANCER_PRESETS[cancerSelect.value];
            presetDetails.innerHTML = `<strong>${currentPreset.name} 특성</strong><br>${currentPreset.desc}`;
        }

        cancerSelect.onchange = () => {
            updatePresetUI();
            initSimulation();
        };

        paramInterval.oninput = () => {
            document.getElementById('val-interval').innerText = `${paramInterval.value}일 (${(paramInterval.value / 7).toFixed(1)}주)`;
        };

        function initSimulation() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(EMPTY));
            dayCount = 0;
            historyNormal = [];
            historyResistant = [];

            const center = Math.floor(GRID_SIZE / 2);
            for (let i = -2; i <= 2; i++) {
                for (let j = -2; j <= 2; j++) {
                    if (Math.random() < 0.8) {
                        grid[center + i][center + j] = NORMAL;
                    }
                }
            }
            
            drawGrid();
            drawChart();
            updateStats();
        }

        function drawGrid() {
            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] !== EMPTY) {
                        simCtx.fillStyle = grid[r][c] === NORMAL ? '#ff5252' : '#ab47bc';
                        simCtx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 0.5, CELL_SIZE - 0.5);
                    }
                }
            }
        }

        function updateSimulation() {
            dayCount++;
            const newGrid = grid.map(arr => [...arr]);
            
            let totalCells = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] !== EMPTY) totalCells++;
                }
            }

            const maxCapacity = GRID_SIZE * GRID_SIZE * 0.7;
            const densityFactor = Math.max(0.01, 1 - Math.log(totalCells + 1) / Math.log(maxCapacity));
            
            const baseGrowthRate = currentPreset.growth;
            const killRate = currentPreset.kill;
            const resistRate = currentPreset.resist;
            const interval = parseInt(paramInterval.value);

            const isTreatmentDay = (dayCount % interval === 0);

            const getEmptyNeighbors = (r, c) => {
                const neighbors = [];
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                            if (grid[nr][nc] === EMPTY) {
                                neighbors.push([nr, nc]);
                            }
                        }
                    }
                }
                return neighbors;
            };

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const current = grid[r][c];

                    if (current !== EMPTY) {
                        if (isTreatmentDay) {
                            if (current === NORMAL && Math.random() < killRate) {
                                newGrid[r][c] = EMPTY;
                                continue;
                            }
                        }

                        const emptyNeighbors = getEmptyNeighbors(r, c);
                        if (emptyNeighbors.length > 0) {
                            const effectiveGrowth = baseGrowthRate * densityFactor;
                            if (Math.random() < effectiveGrowth) {
                                const [targetR, targetC] = emptyNeighbors[Math.floor(Math.random() * emptyNeighbors.length)];
                                
                                if (current === NORMAL) {
                                    newGrid[targetR][targetC] = (Math.random() < resistRate) ? RESISTANT : NORMAL;
                                } else {
                                    newGrid[targetR][targetC] = RESISTANT;
                                }
                            }
                        }
                    }
                }
            }

            grid = newGrid;
            
            let normalCnt = 0, resistCnt = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === NORMAL) normalCnt++;
                    if (grid[r][c] === RESISTANT) resistCnt++;
                }
            }
            
            historyNormal.push(normalCnt);
            historyResistant.push(resistCnt);
            if (historyNormal.length > 100) {
                historyNormal.shift();
                historyResistant.shift();
            }

            updateStats(normalCnt, resistCnt);
            drawGrid();
            drawChart();

            if (isTreatmentDay) {
                simCtx.fillStyle = 'rgba(77, 166, 255, 0.3)';
                simCtx.fillRect(0, 0, simCanvas.width, simCanvas.height);
            }
        }

        function drawChart() {
            chartCtx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
            
            const w = chartCanvas.width;
            const h = chartCanvas.height;
            const maxVal = Math.max(...historyNormal, ...historyResistant, 500);

            chartCtx.strokeStyle = '#333';
            chartCtx.beginPath();
            chartCtx.moveTo(0, h/2); chartCtx.lineTo(w, h/2);
            chartCtx.stroke();

            chartCtx.strokeStyle = '#ff5252';
            chartCtx.lineWidth = 2;
            chartCtx.beginPath();
            for (let i = 0; i < historyNormal.length; i++) {
                const x = (i / 100) * w;
                const y = h - (historyNormal[i] / maxVal) * h;
                if (i === 0) chartCtx.moveTo(x, y);
                else chartCtx.lineTo(x, y);
            }
            chartCtx.stroke();

            chartCtx.strokeStyle = '#ab47bc';
            chartCtx.beginPath();
            for (let i = 0; i < historyResistant.length; i++) {
                const x = (i / 100) * w;
                const y = h - (historyResistant[i] / maxVal) * h;
                if (i === 0) chartCtx.moveTo(x, y);
                else chartCtx.lineTo(x, y);
            }
            chartCtx.stroke();
        }

        function updateStats(normal = 0, resistant = 0) {
            document.getElementById('stat-step').innerText = `${dayCount}일`;
            document.getElementById('stat-normal').innerText = normal;
            document.getElementById('stat-resistant').innerText = resistant;
        }

        function loop() {
            if (isRunning) {
                updateSimulation();
                animId = setTimeout(loop, 100);
            }
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                loop();
            }
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isRunning = false;
            clearTimeout(animId);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            isRunning = false;
            clearTimeout(animId);
            initSimulation();
        });

        updatePresetUI();
        initSimulation();
    </script>
</body>
</html>
