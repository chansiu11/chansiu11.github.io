<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 피하기 게임</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
    <!-- 3D 그래픽용 Three.js 라이브러리 불러오기 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">점수: <span id="score">0</span></div>

    <script>
        // 1. 장면(Scene), 카메라(Camera), 렌더러(Renderer) 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 조명 추가
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. 바닥 및 플레이어 생성
        const floorGeo = new THREE.PlaneGeometry(10, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x16213e });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -40;
        scene.add(floor);

        const playerGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x00fff5 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0.4, 3);
        scene.add(player);

        // 4. 변수 및 이벤트 처리
        const obstacles = [];
        let score = 0;
        let gameOver = false;
        let playerX = 0;

        window.addEventListener('keydown', (e) => {
            if (gameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && playerX > -4) {
                playerX -= 1.5;
            }
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && playerX < 4) {
                playerX += 1.5;
            }
        });

        // 5. 장애물 생성 함수
        function spawnObstacle() {
            if (gameOver) return;
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff4d4d });
            const obstacle = new THREE.Mesh(geo, mat);

            // -4 ~ 4 사이 무작위 X 위치 지정
            obstacle.position.x = (Math.random() - 0.5) * 8;
            obstacle.position.y = 0.5;
            obstacle.position.z = -50;

            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        setInterval(spawnObstacle, 600);

        // 6. 메인 애니메이션 루프
        function animate() {
            if (gameOver) return;
            requestAnimationFrame(animate);

            // 플레이어 좌우 이동 보정 (부드러운 이동)
            player.position.x += (playerX - player.position.x) * 0.2;

            // 장애물 이동 및 충돌 체크
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += 0.4; // 장애물 접근 속도

                // 간단한 AABB 충돌 판정
                const dx = Math.abs(player.position.x - obs.position.x);
                const dz = Math.abs(player.position.z - obs.position.z);

                if (dx < 0.8 && dz < 0.8) {
                    gameOver = true;
                    alert(`게임 오버! 최종 점수: ${Math.floor(score)}`);
                    location.reload();
                }

                // 지나간 장애물 제거 및 점수 증가
                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                }
            }

            renderer.render(scene, camera);
        }

        // 창 크기 변경 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
