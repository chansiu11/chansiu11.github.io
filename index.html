<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2D 배틀필드 로얄</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: white; font-family: sans-serif; overflow: hidden;
        }
        #ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); padding: 25px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 12px; align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); width: 360px; z-index: 10;
        }
        #waitingRoom {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95); padding: 30px; border-radius: 12px;
            display: none; flex-direction: column; gap: 15px; align-items: center;
            box-shadow: 0 0 25px rgba(0,255,200,0.3); width: 400px; z-index: 10; text-align: center;
        }
        input[type="text"] {
            padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid #444;
            text-align: center; width: 90%; background: #222; color: white;
        }
        button {
            padding: 12px; font-size: 15px; background-color: #00ffcc; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; color: #000; width: 100%;
        }
        button:hover { background-color: #00cc88; }
        #statusHUD {
            position: absolute; top: 20px; left: 20px; font-size: 15px; font-weight: bold;
            text-shadow: 2px 2px 4px #000; z-index: 5; display: none; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px;
        }
        #inventory {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; height: 380px; background: rgba(20, 20, 20, 0.95);
            border: 2px solid #00ffcc; border-radius: 10px; z-index: 20; display: none;
            padding: 20px; flex-direction: column; gap: 12px;
        }
        .inv-section { border: 1px solid #444; padding: 10px; border-radius: 6px; background: #1a1a1a; }
        .inv-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        .inv-item {
            padding: 8px 12px; background: #333; border: 1px solid #666; border-radius: 4px;
            cursor: pointer; font-size: 13px;
        }
        .inv-item:hover { background: #00ffcc; color: #000; }
        canvas { width: 100vw; height: 100vh; display: none; background-color: #1a1a1a; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="ui">
    <h2>2D 배틀필드 로얄</h2>
    <input type="text" id="nicknameInput" placeholder="닉네임 입력" maxlength="10">

    <button onclick="createRoom()">비밀 방 생성 (호스트)</button>
    <div id="roomCodeDisplay" style="color:#00ffcc; font-weight:bold;"></div>

    <hr style="width:100%; border-color:#444; margin: 2px 0;">
    
    <input type="text" id="joinIdInput" placeholder="비워두면 공용서버 접속" maxlength="5">
    <button onclick="joinRoom()" style="background-color: #ffcc00;">공동 서버 접속</button>
    
    <button onclick="enterBattleRoyaleLobby()" style="background-color: #ff4444; color: white;">배틀로얄 접속 (AI 대치)</button>
</div>

<div id="waitingRoom">
    <h2>배틀로얄 대기실</h2>
    <p>참가 인원: <span id="playerCount" style="color:#00ffcc; font-size:22px; font-weight:bold;">1</span> / 10</p>
    <p>남은 시간: <span id="timerDisplay" style="color:#ff4444; font-size:24px; font-weight:bold;">10</span>초</p>
    <div style="font-size: 13px; color: #aaa;">인원이 부족할 경우 AI 봇으로 자동 대체됩니다.</div>
</div>

<div id="statusHUD">
    [무기]: <span id="hudWeapon" style="color:#00ffcc;">맨손</span> | 
    [장착 스코프]: <span id="hudScope" style="color:#ffcc00;">없음</span> <br>
    [조작법]: E(아이템 줍기) / Tab(가방) / 우클릭(시야 조준)
</div>

<div id="inventory">
    <h3 style="margin:0; text-align:center; color:#00ffcc;">가방 (인벤토리)</h3>
    <div class="inv-section">
        <strong>현재 무기:</strong>
        <div id="equippedWeaponArea" style="margin-top:5px; color:#aaa;">맨손</div>
    </div>
    <div class="inv-section">
        <strong>현재 장착 스코프:</strong>
        <div id="equippedScopeArea" style="margin-top:5px; color:#aaa;">없음</div>
    </div>
    <div class="inv-section">
        <strong>보유 중인 스코프:</strong>
        <div id="scopeList" class="inv-grid"></div>
    </div>
    <button onclick="toggleInventory()" style="margin-top:auto;">닫기 (Tab)</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const WORLD_SIZE = 12000; 

const SCOPES = {
    '1x': { name: "1배율 (레드닷)", viewOffset: 300 },
    '2x': { name: "2배율", viewOffset: 550 },
    '3x': { name: "3배율", viewOffset: 850 },
    '4x': { name: "4배율", viewOffset: 1200 },
    '8x': { name: "8배율", viewOffset: 1800 }
};

const WEAPONS = {
    ar: { name: "돌격소총", cooldown: 110, bulletSpeed: 55, damage: 12.5, pellets: 1, spread: 0.03 },
    sniper: { name: "스나이퍼", cooldown: 900, bulletSpeed: 110, damage: 65, pellets: 1, spread: 0.005 },
    shotgun: { name: "샷건", cooldown: 800, bulletSpeed: 45, damage: 10, pellets: 8, spread: 0.18 }
};

const PUBLIC_ROOM_ID = "gungame-public-server-room-v1";
let peer = null, conn = null;

let gameStarted = false;
let waitingTimer = null;
let timeLeft = 10;
let realPlayerCount = 1;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// 시작 시 총기 및 스코프 없음 (맨손 시작)
const myPlayer = {
    id: Math.random().toString(36).substring(2, 9),
    x: WORLD_SIZE / 2, y: WORLD_SIZE / 2,
    angle: 0, speed: 3.0, hp: 100, maxHp: 100,
    name: '플레이어', weapon: null,
    equippedScope: null,
    inventory: { scopes: [] },
    isAiming: false, isShooting: false, lastShootTime: 0
};

const camera = { x: myPlayer.x, y: myPlayer.y };
const keys = {};
const mouse = { x: 0, y: 0 };
const bullets = [];
const droppedItems = [];
const aiBots = [];
const obstacles = [];

// 장애물 생성 (건물/엄폐물)
for(let i = 0; i < 120; i++) {
    obstacles.push({
        x: Math.random() * (WORLD_SIZE - 600) + 300,
        y: Math.random() * (WORLD_SIZE - 600) + 300,
        w: Math.random() * 200 + 100,
        h: Math.random() * 200 + 100
    });
}

// 아이템 드랍 생성
for(let i = 0; i < 250; i++) {
    const types = ['ar', 'sniper', 'shotgun', '1x', '2x', '3x', '4x', '8x'];
    droppedItems.push({
        x: Math.random() * (WORLD_SIZE - 200) + 100,
        y: Math.random() * (WORLD_SIZE - 200) + 100,
        type: types[Math.floor(Math.random() * types.length)]
    });
}

function generateShortId() { return Math.random().toString(36).substring(2, 7).toLowerCase(); }

function createRoom() {
    const nick = document.getElementById('nicknameInput').value.trim();
    if(nick) myPlayer.name = nick;
    const code = generateShortId();
    peer = new Peer('gungame-room-' + code);
    peer.on('open', () => { document.getElementById('roomCodeDisplay').innerText = "코드: " + code; });
    peer.on('connection', c => { conn = c; startGame(); });
}

function joinRoom() {
    const input = document.getElementById('joinIdInput').value.trim().toLowerCase();
    const nick = document.getElementById('nicknameInput').value.trim();
    if(nick) myPlayer.name = nick;

    peer = new Peer();
    peer.on('open', () => {
        const targetPeerId = input === "" ? PUBLIC_ROOM_ID : 'gungame-room-' + input;
        conn = peer.connect(targetPeerId);
        conn.on('open', () => startGame());
        conn.on('error', () => alert('접속 실패'));
    });
}

function enterBattleRoyaleLobby() {
    const nick = document.getElementById('nicknameInput').value.trim();
    if(nick) myPlayer.name = nick;

    document.getElementById('ui').style.display = 'none';
    document.getElementById('waitingRoom').style.display = 'flex';

    waitingTimer = setInterval(() => {
        timeLeft--;
        document.getElementById('timerDisplay').innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(waitingTimer);
            spawnAIBots(10 - realPlayerCount);
            startGame();
        }
    }, 1000);
}

function spawnAIBots(count) {
    for (let i = 0; i < count; i++) {
        aiBots.push({
            id: 'bot_' + i,
            x: myPlayer.x + (Math.random() - 0.5) * 2000,
            y: myPlayer.y + (Math.random() - 0.5) * 2000,
            angle: 0, hp: 100, maxHp: 100,
            name: `AI 봇_${i+1}`,
            weapon: null, // AI도 맨손으로 시작하여 아이템 탐색
            equippedScope: null,
            lastShootTime: 0
        });
    }
}

function startGame() {
    document.getElementById('ui').style.display = 'none';
    document.getElementById('waitingRoom').style.display = 'none';
    document.getElementById('statusHUD').style.display = 'block';
    canvas.style.display = 'block';
    gameStarted = true;
    updateHUD();
    resizeCanvas();
    initEvents();
    gameLoop();
}

function initEvents() {
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if(e.key === 'Tab') { e.preventDefault(); toggleInventory(); }
        if(e.key.toLowerCase() === 'e') pickupItem();
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('mousedown', e => {
        if (e.button === 2) myPlayer.isAiming = true;
        if (e.button === 0) myPlayer.isShooting = true;
    });
    canvas.addEventListener('mouseup', e => {
        if (e.button === 2) myPlayer.isAiming = false;
        if (e.button === 0) myPlayer.isShooting = false;
    });
}

function toggleInventory() {
    const inv = document.getElementById('inventory');
    inv.style.display = (inv.style.display === 'flex') ? 'none' : 'flex';
    if(inv.style.display === 'flex') renderInventory();
}

function renderInventory() {
    const weapArea = document.getElementById('equippedWeaponArea');
    const scopeArea = document.getElementById('equippedScopeArea');
    const scopeList = document.getElementById('scopeList');
    
    weapArea.innerHTML = myPlayer.weapon 
        ? `${WEAPONS[myPlayer.weapon].name} <button style="width:auto; padding:2px 8px; margin-left:10px;" onclick="unequipWeapon()">해제(버리기)</button>` 
        : "맨손";

    scopeArea.innerHTML = myPlayer.equippedScope 
        ? `${SCOPES[myPlayer.equippedScope].name} <button style="width:auto; padding:2px 8px; margin-left:10px;" onclick="unequipScope()">해제</button>` 
        : "없음";
        
    scopeList.innerHTML = "";
    myPlayer.inventory.scopes.forEach(sc => {
        const item = document.createElement('div');
        item.className = 'inv-item';
        item.innerText = SCOPES[sc].name;
        item.onclick = () => equipScope(sc);
        scopeList.appendChild(item);
    });
}

// 총기 해제 함수
function unequipWeapon() {
    if(myPlayer.weapon) {
        droppedItems.push({ x: myPlayer.x, y: myPlayer.y, type: myPlayer.weapon });
        myPlayer.weapon = null;
        myPlayer.equippedScope = null;
        updateHUD();
        renderInventory();
    }
}

function equipScope(scKey) {
    if(!myPlayer.weapon) {
        alert("총기를 먼저 장착해야 스코프를 사용할 수 있습니다!");
        return;
    }
    myPlayer.equippedScope = scKey; 
    updateHUD(); 
    renderInventory(); 
}

function unequipScope() { myPlayer.equippedScope = null; updateHUD(); renderInventory(); }

function pickupItem() {
    for(let i = droppedItems.length - 1; i >= 0; i--) {
        const item = droppedItems[i];
        if(Math.hypot(myPlayer.x - item.x, myPlayer.y - item.y) < 50) {
            if(['ar', 'sniper', 'shotgun'].includes(item.type)) {
                if(myPlayer.weapon) droppedItems.push({ x: myPlayer.x, y: myPlayer.y, type: myPlayer.weapon });
                myPlayer.weapon = item.type;
            } else {
                myPlayer.inventory.scopes.push(item.type);
            }
            droppedItems.splice(i, 1);
            updateHUD();
            break;
        }
    }
}

function updateHUD() {
    document.getElementById('hudWeapon').innerText = myPlayer.weapon ? WEAPONS[myPlayer.weapon].name : "맨손";
    document.getElementById('hudScope').innerText = myPlayer.equippedScope ? SCOPES[myPlayer.equippedScope].name : "없음";
}

// 장애물이 시야/총알을 가리는지 체크하는 레이캐스팅 알고리즘
function hasLineOfSight(p1, p2) {
    const steps = 20;
    for(let i = 0; i <= steps; i++) {
        const checkX = p1.x + (p2.x - p1.x) * (i / steps);
        const checkY = p1.y + (p2.y - p1.y) * (i / steps);
        for(let obs of obstacles) {
            if(checkX >= obs.x && checkX <= obs.x + obs.w && checkY >= obs.y && checkY <= obs.y + obs.h) {
                return false; // 장애물에 가려짐
            }
        }
    }
    return true;
}

function shoot(shooter) {
    if(!shooter.weapon) return;
    const w = WEAPONS[shooter.weapon];
    for(let i=0; i < w.pellets; i++) {
        const spread = (Math.random() - 0.5) * w.spread;
        const angle = shooter.angle + spread;
        bullets.push({
            x: shooter.x, y: shooter.y,
            dx: Math.cos(angle) * w.bulletSpeed,
            dy: Math.sin(angle) * w.bulletSpeed,
            damage: w.damage,
            ownerId: shooter.id
        });
    }
}

// AI 봇 로직 (주변 파밍 및 플레이어/다른 AI 교전)
function updateAI() {
    aiBots.forEach(bot => {
        // 무기가 없으면 근처 아이템 파밍
        if(!bot.weapon) {
            let nearestItem = null;
            let minDst = 1000;
            droppedItems.forEach(item => {
                if(['ar', 'sniper', 'shotgun'].includes(item.type)) {
                    const d = Math.hypot(item.x - bot.x, item.y - bot.y);
                    if(d < minDst) { minDst = d; nearestItem = item; }
                }
            });

            if(nearestItem) {
                bot.angle = Math.atan2(nearestItem.y - bot.y, nearestItem.x - bot.x);
                bot.x += Math.cos(bot.angle) * 2.0;
                bot.y += Math.sin(bot.angle) * 2.0;
                if(minDst < 30) {
                    bot.weapon = nearestItem.type;
                    droppedItems.splice(droppedItems.indexOf(nearestItem), 1);
                }
            }
            return;
        }

        // 감지 대상 타겟 선정 (플레이어 또는 다른 AI 봇)
        let targets = [myPlayer, ...aiBots.filter(b => b.id !== bot.id)];
        let closestTarget = null;
        let minDst = 800;

        targets.forEach(target => {
            const dst = Math.hypot(target.x - bot.x, target.y - bot.y);
            // 시야 범위 내에 있고 장애물로 가려지지 않은 대상 감지
            if(dst < minDst && hasLineOfSight(bot, target)) {
                minDst = dst;
                closestTarget = target;
            }
        });

        if(closestTarget) {
            bot.angle = Math.atan2(closestTarget.y - bot.y, closestTarget.x - bot.x);
            if(minDst > 150) {
                bot.x += Math.cos(bot.angle) * 1.8;
                bot.y += Math.sin(bot.angle) * 1.8;
            }

            const now = Date.now();
            if (now - bot.lastShootTime >= WEAPONS[bot.weapon].cooldown) {
                shoot(bot);
                bot.lastShootTime = now;
            }
        } else {
            // 타겟이 없으면 로밍
            bot.x += Math.cos(bot.angle) * 1.0;
            bot.y += Math.sin(bot.angle) * 1.0;
            if(Math.random() < 0.02) bot.angle += (Math.random() - 0.5) * 2;
        }
    });
}

function checkObstacleCollision(x, y) {
    for (let obs of obstacles) {
        if (x + 15 > obs.x && x - 15 < obs.x + obs.w && y + 15 > obs.y && y - 15 < obs.y + obs.h) {
            return true;
        }
    }
    return false;
}

function update() {
    if(!gameStarted) return;

    let dx = 0, dy = 0;
    if (keys['w']) dy -= 1;
    if (keys['s']) dy += 1;
    if (keys['a']) dx -= 1;
    if (keys['d']) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
    
    let nextX = Math.max(50, Math.min(WORLD_SIZE - 50, myPlayer.x + dx * myPlayer.speed));
    let nextY = Math.max(50, Math.min(WORLD_SIZE - 50, myPlayer.y + dy * myPlayer.speed));

    if(!checkObstacleCollision(nextX, myPlayer.y)) myPlayer.x = nextX;
    if(!checkObstacleCollision(myPlayer.x, nextY)) myPlayer.y = nextY;

    if (myPlayer.isShooting) {
        const now = Date.now();
        if (myPlayer.weapon && now - myPlayer.lastShootTime >= WEAPONS[myPlayer.weapon].cooldown) {
            shoot(myPlayer);
            myPlayer.lastShootTime = now;
        }
    }

    updateAI();

    const screenCenterX = canvas.width / 2;
    const screenCenterY = canvas.height / 2;
    let targetCamX = myPlayer.x;
    let targetCamY = myPlayer.y;

    if (myPlayer.isAiming) {
        const sc = (myPlayer.weapon && myPlayer.equippedScope) ? SCOPES[myPlayer.equippedScope] : { viewOffset: 200 };
        const mouseOffsetX = mouse.x - screenCenterX;
        const mouseOffsetY = mouse.y - screenCenterY;
        const dist = Math.hypot(mouseOffsetX, mouseOffsetY);

        if (dist > 0) {
            const actualOffset = Math.min(dist * 2.0, sc.viewOffset);
            targetCamX += (mouseOffsetX / dist) * actualOffset;
            targetCamY += (mouseOffsetY / dist) * actualOffset;
        }
    }

    camera.x += (targetCamX - camera.x) * 0.1;
    camera.y += (targetCamY - camera.y) * 0.1;

    myPlayer.angle = Math.atan2((camera.y + (mouse.y - screenCenterY)) - myPlayer.y, (camera.x + (mouse.x - screenCenterX)) - myPlayer.x);

    // 총알 이동 및 충돌
    for(let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.dx; b.y += b.dy;

        if(checkObstacleCollision(b.x, b.y)) {
            bullets.splice(i, 1);
            continue;
        }

        // AI 봇 간 타격 / 플레이어의 AI 타격
        aiBots.forEach((bot, bIdx) => {
            if (b.ownerId !== bot.id && Math.hypot(b.x - bot.x, b.y - bot.y) < 20) {
                bot.hp -= b.damage;
                bullets.splice(i, 1);
                if (bot.hp <= 0) aiBots.splice(bIdx, 1);
            }
        });

        // AI 봇이 플레이어를 타격
        if (b.ownerId !== myPlayer.id && Math.hypot(b.x - myPlayer.x, b.y - myPlayer.y) < 20) {
            myPlayer.hp -= b.damage;
            bullets.splice(i, 1);
            if (myPlayer.hp <= 0) {
                alert("사망하셨습니다!");
                location.reload();
            }
        }

        if(b.x < 0 || b.x > WORLD_SIZE || b.y < 0 || b.y > WORLD_SIZE) bullets.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(!gameStarted) return;

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.translate(-camera.x, -camera.y);

    // 격자 맵
    ctx.strokeStyle = '#252525'; ctx.lineWidth = 2;
    for (let x = 0; x <= WORLD_SIZE; x += 300) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
    }
    for (let y = 0; y <= WORLD_SIZE; y += 300) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
    }

    // 장애물(건물) 렌더링
    ctx.fillStyle = '#444'; ctx.strokeStyle = '#666'; ctx.lineWidth = 3;
    obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    });

    // 아이템 드랍 (시야 가림 체크 적용)
    droppedItems.forEach(item => {
        if(hasLineOfSight(myPlayer, item)) {
            ctx.fillStyle = ['ar', 'sniper', 'shotgun'].includes(item.type) ? '#ffcc00' : '#00ffcc';
            ctx.beginPath(); ctx.arc(item.x, item.y, 8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(item.type.toUpperCase(), item.x, item.y - 12);
        }
    });

    // 총알
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 3;
    bullets.forEach(b => {
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.dx*0.2, b.y - b.dy*0.2); ctx.stroke();
    });

    // 내 플레이어 렌더링
    drawCharacter(myPlayer, '#00ffcc');

    // AI 봇 렌더링 (장애물 뒤 시야 차단 처리)
    aiBots.forEach(bot => {
        if(hasLineOfSight(myPlayer, bot)) {
            drawCharacter(bot, '#ff4444');
        }
    });

    ctx.restore();

    if(myPlayer.isAiming && myPlayer.weapon) drawScopeCrosshair(myPlayer.equippedScope);
}

function drawCharacter(p, color) {
    ctx.save();
    ctx.translate(p.x, p.y);
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-20, -30, 40, 5);
    ctx.fillStyle = '#00ff55'; ctx.fillRect(-20, -30, 40 * (p.hp / p.maxHp), 5);

    ctx.rotate(p.angle);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
    
    // 무기 보유 시 총열 그리기
    if(p.weapon) {
        ctx.fillStyle = '#aaa'; 
        ctx.fillRect(0, -3, p.weapon === 'sniper' ? 30 : 22, 6);
    }
    ctx.restore();
}

function drawScopeCrosshair(scopeType) {
    const cx = mouse.x, cy = mouse.y;
    ctx.save();

    if (!scopeType || scopeType === '1x') {
        ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    } else if (scopeType === '2x') {
        ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();
    } else if (scopeType === '3x') {
        ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx - 8, cy + 8); ctx.lineTo(cx, cy); ctx.lineTo(cx + 8, cy + 8); ctx.stroke();
    } else if (scopeType === '4x') {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx - 25, cy); ctx.lineTo(cx + 25, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - 25); ctx.lineTo(cx, cy + 25); ctx.stroke();
        ctx.strokeStyle = 'red'; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.stroke();
    } else if (scopeType === '8x') {
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx - 50, cy); ctx.lineTo(cx + 50, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - 50); ctx.lineTo(cx, cy + 50); ctx.stroke();
        ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
