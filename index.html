<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>물불 어드벤처</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;
}

html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#101827;

    font-family:Arial,sans-serif;
}

canvas{

    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    display:block;
}


/* ===================================
   화면
=================================== */

.screen{

    position:fixed;

    inset:0;

    z-index:20;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        #172944,
        #0c1422
    );

    color:white;

}


.title{

    font-size:42px;

    font-weight:900;

    margin-bottom:30px;

    text-shadow:
    4px 4px #000;

    text-align:center;

}


.menuButton{

    width:240px;

    height:60px;

    margin:8px;

    border:3px solid white;

    border-radius:15px;

    background:#298bdc;

    color:white;

    font-size:20px;

    font-weight:bold;

    box-shadow:
    0 5px 0 #125486;

}


.menuButton:active{

    transform:translateY(4px);

    box-shadow:
    0 1px 0 #125486;

}


/* ===================================
   스테이지
=================================== */

#stageScreen{

    display:none;

}


.stageGrid{

    display:grid;

    grid-template-columns:
    repeat(3,85px);

    gap:13px;

}


.stage{

    width:85px;
    height:85px;

    border-radius:15px;

    border:3px solid white;

    background:#347fbe;

    color:white;

    font-size:28px;

    font-weight:bold;

}


.stage.locked{

    background:#444;

    opacity:.5;

}


.back{

    background:#555;

    box-shadow:
    0 5px 0 #222;

}


/* ===================================
   게임 UI
=================================== */

#gameUI{

    display:none;

    position:fixed;

    inset:0;

    z-index:10;

    pointer-events:none;

}


#levelText{

    position:absolute;

    top:10px;

    left:50%;

    transform:
    translateX(-50%);

    color:white;

    font-size:18px;

    font-weight:bold;

    text-shadow:
    2px 2px #000;

}


/* ===================================
   조작 버튼
=================================== */

.controls{

    position:absolute;

    bottom:12px;

    display:flex;

    gap:7px;

    pointer-events:auto;

}


#waterControls{

    left:10px;

}


#fireControls{

    right:10px;

}


.control{

    width:54px;

    height:54px;

    border-radius:14px;

    border:3px solid white;

    background:#293a50;

    color:white;

    font-size:20px;

    font-weight:bold;

    box-shadow:
    0 4px 0 #111;

}


.control:active{

    transform:
    translateY(3px);

}


/* ===================================
   결과
=================================== */

#resultScreen{

    display:none;

}


.resultTitle{

    font-size:40px;

    font-weight:900;

    margin-bottom:15px;

    text-align:center;

}


.resultText{

    color:#ddd;

    margin-bottom:20px;

    text-align:center;

}

</style>

</head>


<body>


<canvas id="game"></canvas>


<!-- ===================================
     메인 메뉴
=================================== -->

<div
id="menuScreen"
class="screen">

    <div class="title">

        💧🔥<br>
        물불 어드벤처

    </div>


    <button
    id="startButton"
    class="menuButton">

        게임 시작

    </button>

</div>


<!-- ===================================
     스테이지 선택
=================================== -->

<div
id="stageScreen"
class="screen">


    <div class="title">

        스테이지 선택

    </div>


    <div class="stageGrid">


        <button
        class="stage"
        data-stage="1">

            1

        </button>


        <button
        class="stage"
        data-stage="2">

            2

        </button>


        <button
        class="stage"
        data-stage="3">

            3

        </button>


        <button
        class="stage"
        data-stage="4">

            4

        </button>


        <button
        class="stage"
        data-stage="5">

            5

        </button>


        <button
        class="stage locked">

            🔒

        </button>


    </div>


    <button
    id="stageBack"
    class="menuButton back">

        뒤로

    </button>

</div>


<!-- ===================================
     게임 UI
=================================== -->

<div id="gameUI">


    <div id="levelText">

        STAGE 1

    </div>


    <div
    id="waterControls"
    class="controls">


        <button
        class="control"
        id="waterLeft">

            ◀

        </button>


        <button
        class="control"
        id="waterRight">

            ▶

        </button>


        <button
        class="control"
        id="waterJump">

            ▲

        </button>


    </div>


    <div
    id="fireControls"
    class="controls">


        <button
        class="control"
        id="fireLeft">

            ◀

        </button>


        <button
        class="control"
        id="fireRight">

            ▶

        </button>


        <button
        class="control"
        id="fireJump">

            ▲

        </button>


    </div>

</div>


<!-- ===================================
     결과 화면
=================================== -->

<div
id="resultScreen"
class="screen">


    <div
    id="resultTitle"
    class="resultTitle">

        게임 오버

    </div>


    <div
    id="resultText"
    class="resultText">

        다시 도전해보세요.

    </div>


    <button
    id="retryButton"
    class="menuButton">

        다시 시작

    </button>


    <button
    id="resultMenuButton"
    class="menuButton back">

        스테이지 선택

    </button>

</div>


<script>


/* =================================================
   CANVAS
================================================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


let W=innerWidth;

let H=innerHeight;


function resize(){

    W=innerWidth;

    H=innerHeight;

    canvas.width=W;

    canvas.height=H;

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =================================================
   게임 상태
================================================= */

let currentStage=1;

let gameState="menu";


/* =================================================
   큰 맵
================================================= */

const WORLD_WIDTH=5000;

const WORLD_HEIGHT=650;


/* =================================================
   캐릭터
================================================= */

/*
   캐릭터 크기를 작게 만들었습니다.
*/

const water={

    x:150,
    y:0,

    w:22,
    h:32,

    vx:0,
    vy:0,

    speed:3.5,

    jump:10,

    grounded:false,

    dead:false,

    color:"#299be8"

};


const fire={

    x:190,
    y:0,

    w:22,
    h:32,

    vx:0,
    vy:0,

    speed:3.5,

    jump:10,

    grounded:false,

    dead:false,

    color:"#ee5034"

};


/* =================================================
   맵
================================================= */

let platforms=[];

let waterHazards=[];

let fireHazards=[];

let gems=[];

let doors=[];


/* =================================================
   스테이지 생성
================================================= */

function createStage(stage){

    platforms=[];

    waterHazards=[];

    fireHazards=[];

    gems=[];

    doors=[];


    /* ---------------------------------------------
       바닥
    --------------------------------------------- */

    platforms.push({

        x:0,

        y:570,

        w:WORLD_WIDTH,

        h:80

    });


    /* ---------------------------------------------
       높은 플랫폼
    --------------------------------------------- */

    platforms.push({

        x:300,

        y:470,

        w:300,

        h:25

    });


    platforms.push({

        x:800,

        y:390,

        w:300,

        h:25

    });


    platforms.push({

        x:1250,

        y:470,

        w:300,

        h:25

    });


    platforms.push({

        x:1700,

        y:350,

        w:350,

        h:25

    });


    platforms.push({

        x:2250,

        y:450,

        w:300,

        h:25

    });


    platforms.push({

        x:2750,

        y:330,

        w:350,

        h:25

    });


    platforms.push({

        x:3300,

        y:450,

        w:300,

        h:25

    });


    platforms.push({

        x:3800,

        y:350,

        w:350,

        h:25

    });


    platforms.push({

        x:4350,

        y:450,

        w:350,

        h:25

    });


    /* ---------------------------------------------
       물 위험
    --------------------------------------------- */

    waterHazards.push({

        x:650,

        y:545,

        w:140,

        h:25

    });


    waterHazards.push({

        x:1550,

        y:545,

        w:150,

        h:25

    });


    waterHazards.push({

        x:2550,

        y:545,

        w:190,

        h:25

    });


    waterHazards.push({

        x:3600,

        y:545,

        w:190,

        h:25

    });


    /* ---------------------------------------------
       불 위험
    --------------------------------------------- */

    fireHazards.push({

        x:1100,

        y:545,

        w:150,

        h:25

    });


    fireHazards.push({

        x:2050,

        y:545,

        w:200,

        h:25

    });


    fireHazards.push({

        x:3100,

        y:545,

        w:200,

        h:25

    });


    fireHazards.push({

        x:4150,

        y:545,

        w:200,

        h:25

    });


    /* ---------------------------------------------
       보석
    --------------------------------------------- */

    for(
        let i=0;
        i<16;
        i++
    ){

        gems.push({

            x:350+i*290,

            y:
            420-(i%3)*55,

            type:
            i%2===0
            ?"water"
            :"fire",

            taken:false

        });

    }


    /* ---------------------------------------------
       출구
    --------------------------------------------- */

    doors.push({

        x:4700,

        y:510,

        w:30,

        h:60,

        type:"water"

    });


    doors.push({

        x:4750,

        y:510,

        w:30,

        h:60,

        type:"fire"

    });

}


/* =================================================
   안전한 시작 위치
================================================= */

function setSafeStart(){

    /*
       바닥의 Y가 570이므로
       캐릭터 높이 32를 빼서
       정확하게 바닥 위에서 시작합니다.
    */

    water.x=150;

    water.y=570-water.h;

    water.vx=0;

    water.vy=0;

    water.grounded=true;

    water.dead=false;


    fire.x=195;

    fire.y=570-fire.h;

    fire.vx=0;

    fire.vy=0;

    fire.grounded=true;

    fire.dead=false;

}


/* =================================================
   스테이지 시작
================================================= */

function startStage(stage){

    currentStage=stage;

    createStage(stage);

    setSafeStart();

    gameState="playing";


    document
    .getElementById("menuScreen")
    .style.display="none";


    document
    .getElementById("stageScreen")
    .style.display="none";


    document
    .getElementById("resultScreen")
    .style.display="none";


    document
    .getElementById("gameUI")
    .style.display="block";


    document
    .getElementById("levelText")
    .textContent=
    "STAGE "+stage;

}


/* =================================================
   메뉴
================================================= */

document
.getElementById("startButton")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("menuScreen")
        .style.display="none";


        document
        .getElementById("stageScreen")
        .style.display="flex";

    }
);


/* =================================================
   스테이지 버튼
================================================= */

document
.querySelectorAll(".stage:not(.locked)")
.forEach(
    button=>{

        button.addEventListener(
            "click",
            function(){

                startStage(
                    Number(
                        button.dataset.stage
                    )
                );

            }
        );

    }
);


/* =================================================
   뒤로
================================================= */

document
.getElementById("stageBack")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("stageScreen")
        .style.display="none";


        document
        .getElementById("menuScreen")
        .style.display="flex";

    }
);


/* =================================================
   키보드
================================================= */

const keys={};


window.addEventListener(
    "keydown",
    function(e){

        keys[e.key]=true;

        /*
           R = 재시작
        */

        if(
            (e.key==="r" ||
             e.key==="R") &&
            gameState==="dead"
        ){

            startStage(
                currentStage
            );

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[e.key]=false;

    }
);


/* =================================================
   모바일 버튼
================================================= */

function mobileButton(
    id,
    key
){

    const button=
    document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            keys[key]=true;

        }
    );


    button.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            keys[key]=false;

        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[key]=false;

        }
    );


    button.addEventListener(
        "pointerleave",
        function(){

            keys[key]=false;

        }
    );

}


mobileButton(
    "waterLeft",
    "a"
);

mobileButton(
    "waterRight",
    "d"
);

mobileButton(
    "waterJump",
    "w"
);


mobileButton(
    "fireLeft",
    "ArrowLeft"
);

mobileButton(
    "fireRight",
    "ArrowRight"
);

mobileButton(
    "fireJump",
    "ArrowUp"
);


/* =================================================
   충돌
================================================= */

function collision(a,b){

    return(

        a.x < b.x+b.w &&

        a.x+a.w > b.x &&

        a.y < b.y+b.h &&

        a.y+a.h > b.y

    );

}


/* =================================================
   캐릭터 이동
================================================= */

function updateCharacter(
    p,
    left,
    right,
    jump
){

    p.vx=0;


    if(keys[left]){

        p.vx=-p.speed;

    }


    if(keys[right]){

        p.vx=p.speed;

    }


    /*
       점프
    */

    if(
        keys[jump] &&
        p.grounded
    ){

        p.vy=-p.jump;

        p.grounded=false;

    }


    /*
       중력
    */

    p.vy+=0.45;


    /*
       X 이동
    */

    p.x+=p.vx;


    /*
       벽/맵 경계
    */

    if(p.x<0){

        p.x=0;

    }


    if(
        p.x+p.w>
        WORLD_WIDTH
    ){

        p.x=
        WORLD_WIDTH-p.w;

    }


    /*
       Y 이동
    */

    const oldBottom=
    p.y+p.h;

    p.y+=p.vy;

    p.grounded=false;


    /*
       플랫폼 충돌

       아래로 떨어질 때만
       플랫폼 위에 착지합니다.
    */

    for(
        const platform
        of platforms
    ){

        const newBottom=
        p.y+p.h;


        if(

            p.x < platform.x+
            platform.w &&

            p.x+p.w >
            platform.x &&

            oldBottom <=
            platform.y &&

            newBottom >=
            platform.y &&

            p.vy>=0

        ){

            p.y=
            platform.y-p.h;

            p.vy=0;

            p.grounded=true;

        }

    }


    /*
       맵 아래로 떨어짐
    */

    if(p.y>WORLD_HEIGHT){

        p.dead=true;

    }

}


/* =================================================
   위험지역
================================================= */

function checkHazards(
    p,
    type
){

    /*
       물 캐릭터는 불에 닿으면 죽음
    */

    if(type==="water"){

        for(
            const h
            of fireHazards
        ){

            if(
                collision(p,h)
            ){

                p.dead=true;

            }

        }

    }


    /*
       불 캐릭터는 물에 닿으면 죽음
    */

    if(type==="fire"){

        for(
            const h
            of waterHazards
        ){

            if(
                collision(p,h)
            ){

                p.dead=true;

            }

        }

    }

}


/* =================================================
   보석
================================================= */

function collectGems(){

    for(
        const g
        of gems
    ){

        if(g.taken)
            continue;


        const p=
        g.type==="water"
        ?water
        :fire;


        if(

            Math.abs(
                p.x+p.w/2-g.x
            )<25 &&

            Math.abs(
                p.y+p.h/2-g.y
            )<30

        ){

            g.taken=true;

        }

    }

}


/* =================================================
   출구
================================================= */

function checkDoors(){

    let waterReady=false;

    let fireReady=false;


    for(
        const d
        of doors
    ){

        if(
            d.type==="water" &&
            collision(water,d)
        ){

            waterReady=true;

        }


        if(
            d.type==="fire" &&
            collision(fire,d)
        ){

            fireReady=true;

        }

    }


    if(
        waterReady &&
        fireReady
    ){

        gameState="win";

        showResult(true);

    }

}


/* =================================================
   결과 화면
================================================= */

function showResult(win){

    document
    .getElementById("gameUI")
    .style.display="none";


    document
    .getElementById("resultScreen")
    .style.display="flex";


    if(win){

        document
        .getElementById("resultTitle")
        .textContent=
        "🎉 스테이지 클리어!";


        document
        .getElementById("resultText")
        .textContent=
        "두 캐릭터가 모두 출구에 도착했습니다.";

    }
    else{

        document
        .getElementById("resultTitle")
        .textContent=
        "💥 게임 오버!";


        document
        .getElementById("resultText")
        .textContent=
        "위험 지역에 닿았습니다.";

    }

}


/* =================================================
   다시 시작
================================================= */

document
.getElementById("retryButton")
.addEventListener(
    "click",
    function(){

        startStage(
            currentStage
        );

    }
);


/* =================================================
   스테이지 선택으로
================================================= */

document
.getElementById("resultMenuButton")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("resultScreen")
        .style.display="none";


        document
        .getElementById("stageScreen")
        .style.display="flex";


        gameState="stage";

    }
);


/* =================================================
   전체 맵을 한 화면에 맞추는 기능
================================================= */

function getScale(){

    /*
       맵 전체가 화면에 들어오도록
       자동으로 축소합니다.

       좌우 여백 20px
       위아래 여백 90px
    */

    const scaleX=
    (W-20)/
    WORLD_WIDTH;


    const scaleY=
    (H-90)/
    WORLD_HEIGHT;


    return Math.min(
        scaleX,
        scaleY
    );

}


function worldToScreenX(x){

    const scale=
    getScale();


    return(
        10+x*scale
    );

}


function worldToScreenY(y){

    const scale=
    getScale();


    /*
       맵을 화면 중앙에 배치
    */

    const mapHeight=
    WORLD_HEIGHT*scale;


    const offsetY=
    60+
    (H-60-mapHeight)/2;


    return(
        offsetY+y*scale
    );

}


/* =================================================
   배경
================================================= */

function drawBackground(){

    const gradient=
    ctx.createLinearGradient(
        0,
        0,
        0,
        H
    );


    gradient.addColorStop(
        0,
        "#182943"
    );


    gradient.addColorStop(
        1,
        "#354c61"
    );


    ctx.fillStyle=
    gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       별/장식
    */

    ctx.fillStyle=
    "rgba(255,255,255,.12)";


    for(
        let i=0;
        i<35;
        i++
    ){

        const x=
        (i*137)%W;

        const y=
        30+
        (i*83)%(H/2);


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =================================================
   맵 그리기
================================================= */

function drawMap(){

    const scale=
    getScale();


    /* 플랫폼 */

    for(
        const p
        of platforms
    ){

        const x=
        worldToScreenX(p.x);

        const y=
        worldToScreenY(p.y);


        ctx.fillStyle=
        "#604837";


        ctx.fillRect(

            x,
            y,

            p.w*scale,
            p.h*scale

        );


        ctx.fillStyle=
        "#9a7553";


        ctx.fillRect(

            x,
            y,

            p.w*scale,
            Math.max(
                3,
                7*scale
            )

        );

    }


    /* 물 */

    for(
        const h
        of waterHazards
    ){

        const x=
        worldToScreenX(h.x);

        const y=
        worldToScreenY(h.y);


        ctx.fillStyle=
        "#178ddd";


        ctx.fillRect(

            x,
            y,

            h.w*scale,
            h.h*scale

        );

    }


    /* 불 */

    for(
        const h
        of fireHazards
    ){

        const x=
        worldToScreenX(h.x);

        const y=
        worldToScreenY(h.y);


        ctx.fillStyle=
        "#e94c2f";


        ctx.fillRect(

            x,
            y,

            h.w*scale,
            h.h*scale

        );

    }

}


/* =================================================
   보석 그리기
================================================= */

function drawGems(){

    const scale=
    getScale();


    for(
        const g
        of gems
    ){

        if(g.taken)
            continue;


        const x=
        worldToScreenX(g.x);

        const y=
        worldToScreenY(g.y);


        const size=
        Math.max(
            4,
            12*scale
        );


        ctx.beginPath();


        ctx.moveTo(
            x,
            y-size
        );


        ctx.lineTo(
            x+size,
            y
        );


        ctx.lineTo(
            x,
            y+size
        );


        ctx.lineTo(
            x-size,
            y
        );


        ctx.closePath();


        ctx.fillStyle=
        g.type==="water"
        ?" #36baff"
        :"#ff603d";


        ctx.fill();


        ctx.strokeStyle=
        "white";


        ctx.lineWidth=1;


        ctx.stroke();

    }

}


/* =================================================
   출구
================================================= */

function drawDoors(){

    const scale=
    getScale();


    for(
        const d
        of doors
    ){

        const x=
        worldToScreenX(d.x);

        const y=
        worldToScreenY(d.y);


        ctx.fillStyle=
        d.type==="water"
        ?" #258fdd"
        :"#e94d34";


        ctx.fillRect(

            x,
            y,

            d.w*scale,
            d.h*scale

        );

    }

}


/* =================================================
   캐릭터
================================================= */

function drawCharacter(p){

    const scale=
    getScale();


    const x=
    worldToScreenX(p.x);

    const y=
    worldToScreenY(p.y);


    const w=
    Math.max(
        5,
        p.w*scale
    );


    const h=
    Math.max(
        8,
        p.h*scale
    );


    /*
       몸
    */

    ctx.fillStyle=
    p.color;


    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    /*
       머리
    */

    const r=
    Math.max(
        5,
        12*scale
    );


    ctx.beginPath();


    ctx.arc(

        x+w/2,

        y-r*.4,

        r,

        0,
        Math.PI*2

    );


    ctx.fillStyle=
    p.color;


    ctx.fill();


    /*
       외곽선
    */

    ctx.strokeStyle=
    "#111";


    ctx.lineWidth=
    Math.max(
        1,
        2*scale
    );


    ctx.stroke();


}


/* =================================================
   화면 정보
================================================= */

function drawInfo(){

    ctx.fillStyle=
    "rgba(0,0,0,.35)";


    ctx.fillRect(
        0,
        0,
        W,
        42
    );


    ctx.fillStyle=
    "white";


    ctx.font=
    "bold 15px Arial";


    ctx.textAlign=
    "center";


    ctx.fillText(

        "💧 물 + 🔥 불  |  STAGE "+
        currentStage,

        W/2,
        27

    );

}


/* =================================================
   업데이트
================================================= */

function update(){

    /*
       게임이 플레이 중일 때만 움직임
    */

    if(
        gameState!=="playing"
    ){

        return;

    }


    updateCharacter(

        water,

        "a",

        "d",

        "w"

    );


    updateCharacter(

        fire,

        "ArrowLeft",

        "ArrowRight",

        "ArrowUp"

    );


    checkHazards(
        water,
        "water"
    );


    checkHazards(
        fire,
        "fire"
    );


    collectGems();


    checkDoors();


    /*
       한 명이라도 죽으면
       즉시 게임을 멈춥니다.
    */

    if(
        water.dead ||
        fire.dead
    ){

        showResult(false);

        return;

    }

}


/* =================================================
   그리기
================================================= */

function draw(){

    drawBackground();

    drawMap();

    drawHazardsForVisual();

    drawGems();

    drawDoors();

    drawCharacter(water);

    drawCharacter(fire);

    drawInfo();

}


/*
   위험지역은 drawMap에서 이미 그렸기 때문에
   별도의 함수는 빈 상태로 둡니다.
*/

function drawHazardsForVisual(){

}


/* =================================================
   루프
================================================= */

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


createStage(1);

setSafeStart();

gameLoop();

</script>
