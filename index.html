<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 및 회원가입</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 로그인 폼 -->
        <div id="loginForm" class="form-box">
            <h2>로그인</h2>
            <form id="login">
                <input type="text" id="loginId" placeholder="아이디" required>
                <input type="password" id="loginPw" placeholder="비밀번호" required>
                <button type="submit">로그인</button>
            </form>
            <p>계정이 없으신가요? <a href="#" id="toSignup">회원가입</a></p>
        </div>

        <!-- 회원가입 폼 -->
        <div id="signupForm" class="form-box hidden">
            <h2>회원가입</h2>
            <form id="signup">
                <input type="text" id="signupId" placeholder="아이디" required>
                <input type="text" id="signupName" placeholder="이름" required>
                <input type="password" id="signupPw" placeholder="비밀번호" required>
                <button type="submit">가입하기</button>
            </form>
            <p>이미 계정이 있으신가요? <a href="#" id="toLogin">로그인</a></p>
        </div>

        <!-- 로그인 성공 화면 -->
        <div id="welcomeBox" class="form-box hidden">
            <h2>환영합니다!</h2>
            <p><span id="userName"></span>님, 로그인되었습니다.</p>
            <button id="logoutBtn">로그아웃</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
