<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100x Ultra Large Map RPG - Multiple Stone Houses</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #111118;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas#gameCanvas {
            background-color: #1e1e2d;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .stats-panel {
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            width: fit-content;
        }
        .bar-container {
            width: 200px;
            height: 14px;
            background: #444;
            border-radius: 7px;
            margin-top: 6px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.05s linear;
        }
        #hp-fill { background: #e74c3c; }
        #stamina-fill { background: #2ecc71; }
        #stamina-fill.exhausted { background: #e67e22; }
        #exp-fill { background: #f1c40f; }
        .text-stat {
            font-size: 14px;
            margin-top: 6px;
            font-weight: bold;
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 90px;
            height: 90px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.7);
        }
        canvas#minimapCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #fullmap-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        #fullmap-modal.hidden {
            display: none;
        }
        canvas#fullmapCanvas {
            border: 2px solid #555;
            border-radius: 8px;
            background: #000;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game-over-screen.hidden {
            display: none;
        }
        .restart-hint {
            margin-top: 15px;
            font-size: 16px;
            color: #f1c40f;
            font-weight: bold;
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-layer">
        <div class="stats-panel">
            <div class="bar-container">
                <div id="hp-fill" class="bar-fill"></div>
            </div>
            <div class="bar-container">
                <div id="stamina-fill" class="bar-fill"></div>
            </div>
            <div class="text-stat" id="level-txt">LV. 1</div>
            <div class="bar-container">
                <div id="exp-fill" class="bar-fill"></div>
            </div>
            <div class="text-stat" id="score-txt">Score: 0</div>
            <div class="text-stat" style="color: #2ecc71;">SafeZone: 맵 중앙 (0,0) / R: 700px</div>
        </div>

        <div id="minimap-container">
            <canvas id="minimapCanvas" width="90" height="90"></canvas>
        </div>

        <div class="controls-hint">
            이동: WASD (Shift: 달리기 - 속도 2.5)<br>
            시점/타겟지정: 방향키 (↑ ↓ ← →)<br>
            공격: 스페이스바<br>
            대시: Q | 전체지도: M
        </div>
    </div>

    <div id="fullmap-modal" class="hidden">
        <h2 style="margin-bottom: 10px; color: #3498db;">WORLD MAP (M으로 닫기)</h2>
        <canvas id="fullmapCanvas" width="500" height="375"></canvas>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1 style="font-size: 40px; color: #e74c3c; margin-bottom: 10px;">GAME OVER</h1>
        <p id="final-score" style="font-size: 18px;">최종 점수: 0</p>
        <p class="restart-hint">Q 또는 스페이스바를 눌러 다시 시작</p>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

const fullmapCanvas = document.getElementById('fullmapCanvas');
const fullmapCtx = fullmapCanvas.getContext('2d');

const WORLD = {
    width: 24000,
    height: 18000
};

const DETECT_RANGE = 350;
const SAFE_ZONE_CENTER = { x: WORLD.width / 2, y: WORLD.height / 2 };
const SAFE_ZONE_RADIUS = DETECT_RANGE * 2; // 700px
const AUTO_TARGET_RANGE = 300;

// 10개의 다양한 크기와 스타일의 석조 집 정의 (맵 전체 배치)
const houses = [
    // 1. 안전지대 중앙 기본 집
    { id: 1, x: SAFE_ZONE_CENTER.x - 150, y: SAFE_ZONE_CENTER.y - 120, width: 300, height: 240, wallThickness: 16, doorWidth: 70, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#373a40', floorColor: '#4a4e54' },
    // 2. 좌측 상단 대형 요새 집
    { id: 2, x: 3000, y: 2500, width: 450, height: 350, wallThickness: 20, doorWidth: 90, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#2c3e50', floorColor: '#34495e' },
    // 3. 우측 상단 오두막 집
    { id: 3, x: 20000, y: 3000, width: 220, height: 180, wallThickness: 14, doorWidth: 55, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#4a3b32', floorColor: '#5c4a3e' },
    // 4. 좌측 하단 정사각형 집
    { id: 4, x: 4000, y: 14000, width: 280, height: 280, wallThickness: 16, doorWidth: 65, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#34495e', floorColor: '#2c3e50' },
    // 5. 우측 하단 대형 저택
    { id: 5, x: 19000, y: 13500, width: 500, height: 380, wallThickness: 22, doorWidth: 100, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#1a252f', floorColor: '#2c3e50' },
    // 6. 중앙 상단 긴 창고형 집
    { id: 6, x: 11500, y: 2000, width: 400, height: 200, wallThickness: 16, doorWidth: 80, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#342224', floorColor: '#4a3335' },
    // 7. 중앙 하단 소형 경비 초소
    { id: 7, x: 12500, y: 15500, width: 180, height: 160, wallThickness: 12, doorWidth: 50, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#2e4053', floorColor: '#34495e' },
    // 8. 좌측 중앙 중형 집
    { id: 8, x: 2500, y: 8500, width: 320, height: 250, wallThickness: 16, doorWidth: 70, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#3e2723', floorColor: '#4e342e' },
    // 9. 우측 중앙 긴 타원형 느낌의 석조 집
    { id: 9, x: 20500, y: 8000, width: 360, height: 220, wallThickness: 18, doorWidth: 75, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#212f3d', floorColor: '#283747' },
    // 10. 안전지대 약간 우측 상단 전초기지
    { id: 10, x: 15000, y: 6500, width: 260, height: 220, wallThickness: 15, doorWidth: 60, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#1b2631', floorColor: '#2e4053' }
];

const camera = {
    x: 0,
    y: 0,
    width: canvas.width,
    height: canvas.height,
    update(targetX, targetY) {
        this.x = targetX - this.width / 2;
        this.y = targetY - this.height / 2;
        this.x = Math.max(0, Math.min(WORLD.width - this.width, this.x));
        this.y = Math.max(0, Math.min(WORLD.height - this.height, this.y));
    }
};

let keys = {};
let lockedTarget = null;
let lastAttackTime = 0;
let gameOver = false;
let isFullMapOpen = false;

let player;
let projectiles = [];
let enemyProjectiles = [];
let enemies = [];
let particles = [];
let popups = [];
let score = 0;

let usedSpawnPoints = [];

window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
        e.preventDefault();
    }
    
    keys[e.code] = true;
    if (e.code === 'KeyM' && !gameOver) {
        isFullMapOpen = !isFullMapOpen;
        const modal = document.getElementById('fullmap-modal');
        if (isFullMapOpen) {
            modal.classList.remove('hidden');
        } else {
            modal.classList.add('hidden');
        }
    }

    if (gameOver && (e.code === 'KeyQ' || e.code === 'Space')) {
        restartGame();
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

class Player {
    constructor() {
        this.x = SAFE_ZONE_CENTER.x;
        this.y = SAFE_ZONE_CENTER.y + 160;
        this.radius = 16;
        this.baseSpeed = 1.3;
        this.runSpeed = 2.5;
        this.speed = 1.3;
        this.maxHp = 100;
        this.hp = 100;
        
        this.maxStamina = 100;
        this.stamina = 100;
        this.staminaDrainRun = 0.4;
        this.staminaCostDash = 25;
        this.staminaRegen = 0.3;
        this.lastStaminaUseTime = 0;
        this.isExhausted = false;
        
        this.level = 1;
        this.exp = 0;
        this.nextExp = 50;
        this.attackSpeed = 200;
        this.damage = 25;
        this.angle = 0;
        
        this.dashCooldown = 600;
        this.lastDashTime = 0;
    }

    // 모든 집의 벽과의 충돌 처리 함수
    checkWallCollision(nextX, nextY) {
        let correctedX = nextX;
        let correctedY = nextY;

        houses.forEach(house => {
            const t = house.wallThickness;
            const doorLeft = house.x + (house.width - house.doorWidth) / 2;
            const doorRight = house.x + (house.width + house.doorWidth) / 2;

            // 특정 집의 벽 영역 정의
            const walls = [
                { x: house.x, y: house.y, w: house.width, h: t }, // 상단 벽
                { x: house.x, y: house.y, w: t, h: house.height }, // 좌측 벽
                { x: house.x + house.width - t, y: house.y, w: t, h: house.height }, // 우측 벽
                { x: house.x, y: house.y + house.height - t, w: doorLeft - house.x, h: t }, // 하단 좌측 벽
                { x: doorRight, y: house.y + house.height - t, w: (house.x + house.width) - doorRight, h: t } // 하단 우측 벽
            ];

            walls.forEach(w => {
                const closestX = Math.max(w.x, Math.min(correctedX, w.x + w.w));
                const closestY = Math.max(w.y, Math.min(correctedY, w.y + w.h));
                const distX = correctedX - closestX;
                const distY = correctedY - closestY;
                const distance = Math.hypot(distX, distY);

                if (distance < this.radius) {
                    const overlap = this.radius - distance;
                    if (distance === 0) {
                        correctedY += overlap;
                    } else {
                        correctedX += (distX / distance) * overlap;
                        correctedY += (distY / distance) * overlap;
                    }
                }
            });
        });

        return { x: correctedX, y: correctedY };
    }

    update() {
        if (isFullMapOpen) return;

        const now = Date.now();
        const hasKeyMove = keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'];
        const hasKeyAim = keys['ArrowUp'] || keys['ArrowDown'] || keys['ArrowLeft'] || keys['ArrowRight'];
        
        let dx = 0, dy = 0;

        if (hasKeyMove) {
            if (keys['KeyW']) dy -= 1;
            if (keys['KeyS']) dy += 1;
            if (keys['KeyA']) dx -= 1;
            if (keys['KeyD']) dx += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }
        }

        const isMoving = (dx !== 0 || dy !== 0);
        const isShiftPressed = keys['ShiftLeft'] || keys['ShiftRight'];

        if (this.isExhausted && this.stamina >= this.maxStamina) {
            this.isExhausted = false;
        }

        if (isMoving && isShiftPressed && !this.isExhausted && this.stamina > 0) {
            this.speed = this.runSpeed;
            this.stamina = Math.max(0, this.stamina - this.staminaDrainRun);
            this.lastStaminaUseTime = now;

            if (this.stamina === 0) {
                this.isExhausted = true;
            }
        } else {
            this.speed = this.baseSpeed;
            if (now - this.lastStaminaUseTime > 500) {
                this.stamina = Math.min(this.maxStamina, this.stamina + this.staminaRegen);
            }
        }

        let targetX = this.x;
        let targetY = this.y;

        if (keys['KeyQ'] && now - this.lastDashTime > this.dashCooldown && isMoving && !this.isExhausted) {
            if (this.stamina >= this.staminaCostDash) {
                this.stamina -= this.staminaCostDash;
                this.lastStaminaUseTime = now;
                targetX += dx * 110;
                targetY += dy * 110;
                this.lastDashTime = now;
                for (let i = 0; i < 10; i++) {
                    particles.push(new Particle(this.x, this.y, '#3498db'));
                }

                if (this.stamina === 0) {
                    this.isExhausted = true;
                }
            }
        } else {
            targetX += dx * this.speed;
            targetY += dy * this.speed;
        }

        // 벽 충돌 체크 적용
        const posAfterWall = this.checkWallCollision(targetX, targetY);
        this.x = Math.max(this.radius, Math.min(WORLD.width - this.radius, posAfterWall.x));
        this.y = Math.max(this.radius, Math.min(WORLD.height - this.radius, posAfterWall.y));

        if (lockedTarget && (lockedTarget.markedForDeletion || lockedTarget.hp <= 0)) {
            lockedTarget = null;
        }

        if (hasKeyAim) {
            let aimDx = 0, aimDy = 0;
            if (keys['ArrowUp']) aimDy -= 1;
            if (keys['ArrowDown']) aimDy += 1;
            if (keys['ArrowLeft']) aimDx -= 1;
            if (keys['ArrowRight']) aimDx += 1;

            if (aimDx !== 0 || aimDy !== 0) {
                const keyAngle = Math.atan2(aimDy, aimDx);
                let foundEnemy = null;
                let minDiff = Math.PI / 3;

                for (let enemy of enemies) {
                    const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                    if (dist <= AUTO_TARGET_RANGE) {
                        const enemyAngle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
                        let diff = Math.abs(keyAngle - enemyAngle);
                        if (diff > Math.PI) diff = Math.PI * 2 - diff;

                        if (diff < minDiff) {
                            minDiff = diff;
                            foundEnemy = enemy;
                        }
                    }
                }

                if (foundEnemy) {
                    lockedTarget = foundEnemy;
                } else {
                    lockedTarget = null;
                    this.angle = keyAngle;
                }
            }
        }

        if (lockedTarget) {
            this.angle = Math.atan2(lockedTarget.y - this.y, lockedTarget.x - this.x);
        }

        if (keys['Space']) {
            this.attack();
        }

        updateUI();
    }

    attack() {
        const now = Date.now();
        if (now - lastAttackTime > this.attackSpeed) {
            projectiles.push(new Projectile(this.x, this.y, this.angle, this.damage));
            lastAttackTime = now;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y);

        const barWidth = 36;
        const barHeight = 5;
        const barX = -barWidth / 2;
        const barY = -this.radius - 12;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(barX, barY, barWidth, barHeight);

        const currentHpWidth = Math.max(0, (this.hp / this.maxHp) * barWidth);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(barX, barY, currentHpWidth, barHeight);

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barWidth, barHeight);

        ctx.rotate(this.angle);
        ctx.fillStyle = '#bdc3c7';
        ctx.fillRect(10, -3, 16, 6);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#3498db';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2980b9';
        ctx.stroke();

        ctx.restore();
    }

    addExp(amount) {
        this.exp += amount;
        if (this.exp >= this.nextExp) {
            this.exp -= this.nextExp;
            this.level++;
            this.nextExp = Math.floor(this.nextExp * 1.5);
            this.maxHp += 15;
            this.hp = this.maxHp;
            this.maxStamina += 10;
            this.stamina = this.maxStamina;
            this.damage += 5;
            createPopup(this.x, this.y - 20, "LEVEL UP!", "#f1c40f");
        }
        updateUI();
    }
}

// 각 집의 내부 투명도 업데이트
function updateHousesVisibility() {
    houses.forEach(house => {
        const isInside = (
            player.x >= house.x + house.wallThickness &&
            player.x <= house.x + house.width - house.wallThickness &&
            player.y >= house.y + house.wallThickness &&
            player.y <= house.y + house.height - house.wallThickness
        );

        house.targetAlpha = isInside ? 0.25 : 1.0;
        house.roofAlpha += (house.targetAlpha - house.roofAlpha) * house.fadeSpeed;
    });
}

// 모든 집의 내부, 벽, 문 및 입구 표시 레이어 렌더링
function drawHousesInterior() {
    houses.forEach(house => {
        const screenX = house.x - camera.x;
        const screenY = house.y - camera.y;

        if (screenX + house.width < -100 || screenX > canvas.width + 100 ||
            screenY + house.height < -100 || screenY > canvas.height + 100) {
            return;
        }

        ctx.save();
        
        // 석재 타일 바닥
        ctx.fillStyle = house.floorColor;
        ctx.fillRect(screenX, screenY, house.width, house.height);

        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        for (let x = screenX; x < screenX + house.width; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, screenY); ctx.lineTo(x, screenY + house.height); ctx.stroke();
        }
        for (let y = screenY; y < screenY + house.height; y += 30) {
            ctx.beginPath(); ctx.moveTo(screenX, y); ctx.lineTo(screenX + house.width, y); ctx.stroke();
        }

        // 석조 외벽
        const t = house.wallThickness;
        const doorLeft = house.width / 2 - house.doorWidth / 2;
        const doorRight = house.width / 2 + house.doorWidth / 2;

        ctx.fillStyle = '#686d76';
        
        // 상/좌/우 벽
        ctx.fillRect(screenX, screenY, house.width, t);
        ctx.fillRect(screenX, screenY, t, house.height);
        ctx.fillRect(screenX + house.width - t, screenY, t, house.height);
        
        // 하단 벽 (출입구 제외)
        ctx.fillRect(screenX, screenY + house.height - t, doorLeft, t);
        ctx.fillRect(screenX + doorRight, screenY + house.height - t, house.width - doorRight, t);

        // 벽 테두리 선
        ctx.strokeStyle = '#2b2d31';
        ctx.lineWidth = 2;
        ctx.strokeRect(screenX, screenY, house.width, house.height);

        // 문 통로 바닥
        ctx.fillStyle = '#333538';
        ctx.fillRect(screenX + doorLeft, screenY + house.height - t, house.doorWidth, t);

        // --- [문 입구 시각적 표식] ---
        const doorCenterX = screenX + house.width / 2;
        const doorBottomY = screenY + house.height;

        // 1. 문 앞 진입 매트/발판
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(doorCenterX - house.doorWidth / 2, doorBottomY, house.doorWidth, 12);
        
        // 2. 문 앞 밝은 노란색 진입 화살표
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.moveTo(doorCenterX, doorBottomY + 3);
        ctx.lineTo(doorCenterX - 10, doorBottomY + 18);
        ctx.lineTo(doorCenterX + 10, doorBottomY + 18);
        ctx.closePath();
        ctx.fill();

        // 3. 문 좌우 기둥 강조 (안내등)
        ctx.fillStyle = '#e67e22';
        ctx.fillRect(doorCenterX - house.doorWidth / 2 - 4, doorBottomY - t - 2, 6, t + 4);
        ctx.fillRect(doorCenterX + house.doorWidth / 2 - 2, doorBottomY - t - 2, 6, t + 4);

        ctx.restore();
    });
}

// 모든 집의 석조 지붕 레이어 렌더링
function drawHousesRoof() {
    houses.forEach(house => {
        const screenX = house.x - camera.x;
        const screenY = house.y - camera.y;

        if (screenX + house.width < -100 || screenX > canvas.width + 100 ||
            screenY + house.height < -100 || screenY > canvas.height + 100) {
            return;
        }

        ctx.save();
        ctx.globalAlpha = house.roofAlpha;

        // 개별 지붕 색상 적용
        ctx.fillStyle = house.roofColor;
        ctx.fillRect(screenX - 12, screenY - 12, house.width + 24, house.height + 24);

        // 지붕 음영 패턴 및 테두리
        ctx.strokeStyle = '#1e2022';
        ctx.lineWidth = 3;
        ctx.strokeRect(screenX - 12, screenY - 12, house.width + 24, house.height + 24);

        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 2;
        for (let i = screenY - 12; i <= screenY + house.height + 12; i += 20) {
            ctx.beginPath();
            ctx.moveTo(screenX - 12, i);
            ctx.lineTo(screenX + house.width + 12, i);
            ctx.stroke();
        }

        ctx.restore();
    });
}

class Projectile {
    constructor(x, y, angle, damage) {
        this.x = x;
        this.y = y;
        this.speed = 13;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.radius = 5;
        this.damage = damage;
        this.markedForDeletion = false;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        
        if (this.x < camera.x || this.x > camera.x + camera.width ||
            this.y < camera.y || this.y > camera.y + camera.height) {
            this.markedForDeletion = true;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#f39c12';
        ctx.fill();
    }
}

class EnemyProjectile {
    constructor(x, y, angle, damage) {
        this.x = x;
        this.y = y;
        this.speed = 6;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.radius = 6;
        this.damage = damage;
        this.markedForDeletion = false;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        const distFromCenter = Math.hypot(this.x - SAFE_ZONE_CENTER.x, this.y - SAFE_ZONE_CENTER.y);
        if (distFromCenter <= SAFE_ZONE_RADIUS) {
            this.markedForDeletion = true;
            return;
        }
        
        if (this.x < camera.x || this.x > camera.x + camera.width ||
            this.y < camera.y || this.y > camera.y + camera.height) {
            this.markedForDeletion = true;
        }

        const dist = Math.hypot(player.x - this.x, player.y - this.y);
        if (dist < player.radius + this.radius) {
            player.hp -= this.damage;
            createPopup(player.x, player.y - 15, `-${this.damage}`, '#e74c3c');
            this.markedForDeletion = true;
            if (player.hp <= 0) endGame();
            updateUI();
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#9b59b6';
        ctx.fill();
    }
}

class Enemy {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        
        if (type === 0) {
            this.radius = 14;
            this.speed = 2.8;
            this.hp = 40;
            this.color = '#e74c3c';
            this.expValue = 15;
            this.scoreValue = 100;
            
            this.attackState = 'idle';
            this.chargeTimer = 0;
            this.slashTimer = 0;
            this.slashAngle = 0;
        } else if (type === 1) {
            this.radius = 10;
            this.speed = 3.6;
            this.hp = 20;
            this.color = '#e67e22';
            this.expValue = 20;
            this.scoreValue = 150;
        } else {
            this.radius = 28;
            this.speed = 1.3;
            this.hp = 220;
            this.color = '#9b59b6';
            this.expValue = 80;
            this.scoreValue = 500;
            this.lastShootTime = 0;
            this.shootInterval = 1800;
        }
        
        this.maxHp = this.hp;
        this.markedForDeletion = false;
    }

    keepOutOfSafeZone() {
        const distFromCenter = Math.hypot(this.x - SAFE_ZONE_CENTER.x, this.y - SAFE_ZONE_CENTER.y);
        const minAllowedDist = SAFE_ZONE_RADIUS + this.radius;

        if (distFromCenter < minAllowedDist) {
            const angleFromCenter = Math.atan2(this.y - SAFE_ZONE_CENTER.y, this.x - SAFE_ZONE_CENTER.x);
            this.x = SAFE_ZONE_CENTER.x + Math.cos(angleFromCenter) * minAllowedDist;
            this.y = SAFE_ZONE_CENTER.y + Math.sin(angleFromCenter) * minAllowedDist;
        }
    }

    update() {
        const dist = Math.hypot(player.x - this.x, player.y - this.y);
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        const now = Date.now();

        if (this.type === 0) {
            if (this.attackState === 'idle') {
                if (dist <= DETECT_RANGE) {
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                }
                if (dist <= 45) {
                    this.attackState = 'charging';
                    this.chargeTimer = now;
                }
            } else if (this.attackState === 'charging') {
                if (now - this.chargeTimer > 500) {
                    this.attackState = 'slashing';
                    this.slashTimer = now;
                    this.slashAngle = angle;
                    
                    if (dist <= 60) {
                        player.hp -= 40;
                        createPopup(player.x, player.y - 15, "-40", "#e74c3c");
                        if (player.hp <= 0) endGame();
                        updateUI();
                    }
                }
            } else if (this.attackState === 'slashing') {
                if (now - this.slashTimer > 200) {
                    this.attackState = 'idle';
                }
            }
        } else if (this.type === 1) {
            if (dist <= DETECT_RANGE) {
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }
            if (dist < player.radius + this.radius) {
                player.hp -= 0.3;
                if (player.hp <= 0) endGame();
                updateUI();
            }
        } else if (this.type === 2) {
            if (dist <= DETECT_RANGE && dist > 180) {
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            } else if (dist < 120) {
                this.x -= Math.cos(angle) * (this.speed * 0.8);
                this.y -= Math.sin(angle) * (this.speed * 0.8);
            }

            if (dist <= DETECT_RANGE && now - this.lastShootTime > this.shootInterval) {
                const playerDistFromCenter = Math.hypot(player.x - SAFE_ZONE_CENTER.x, player.y - SAFE_ZONE_CENTER.y);
                if (playerDistFromCenter > SAFE_ZONE_RADIUS) {
                    enemyProjectiles.push(new EnemyProjectile(this.x, this.y, angle, 15));
                }
                this.lastShootTime = now;
            }
        }

        this.keepOutOfSafeZone();
    }

    draw() {
        if (this.x < camera.x - 100 || this.x > camera.x + camera.width + 100 ||
            this.y < camera.y - 100 || this.y > camera.y + camera.height + 100) {
            return;
        }

        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y);

        if (lockedTarget === this) {
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
            ctx.stroke();
        }

        if (this.type === 0 && this.attackState === 'charging') {
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 12, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.fillStyle = this.color;
        ctx.beginPath();

        if (this.type === 0) {
            ctx.rect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
        } else if (this.type === 1) {
            ctx.moveTo(0, -this.radius * 1.3);
            ctx.lineTo(this.radius, this.radius);
            ctx.lineTo(-this.radius, this.radius);
            ctx.closePath();
        } else {
            for (let i = 0; i < 5; i++) {
                const a = (Math.PI * 2 / 5) * i;
                const px = Math.cos(a) * this.radius;
                const py = Math.sin(a) * this.radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        }
        ctx.fill();

        if (this.type === 0 && this.attackState === 'slashing') {
            ctx.rotate(this.slashAngle);
            ctx.beginPath();
            ctx.arc(0, 0, 45, -Math.PI / 3, Math.PI / 3);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-this.radius, -this.radius - 8, this.radius * 2, 4);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(-this.radius, -this.radius - 8, (this.radius * 2) * (this.hp / this.maxHp), 4);
        }

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.03;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
    }
}

class Popup {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.alpha = 1;
        this.vy = -1;
    }

    update() {
        this.y += this.vy;
        this.alpha -= 0.02;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = 'bold 14px Segoe UI';
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, this.x - camera.x, this.y - camera.y);
        ctx.restore();
    }
}

function createPopup(x, y, text, color = '#fff') {
    popups.push(new Popup(x, y, text, color));
}

function isSpawnPointUsed(x, y) {
    return usedSpawnPoints.some(pt => Math.hypot(pt.x - x, pt.y - y) < 150);
}

function spawnEnemies() {
    if (enemies.length >= 30) return;

    if (Math.random() < 0.03) {
        const minDistance = 300;
        const maxDistance = 800;
        const distance = Math.random() * (maxDistance - minDistance) + minDistance;
        const angle = Math.random() * Math.PI * 2;

        let centerX = player.x + Math.cos(angle) * distance;
        let centerY = player.y + Math.sin(angle) * distance;

        centerX = Math.max(200, Math.min(WORLD.width - 200, centerX));
        centerY = Math.max(200, Math.min(WORLD.height - 200, centerY));

        const distFromZero = Math.hypot(centerX - SAFE_ZONE_CENTER.x, centerY - SAFE_ZONE_CENTER.y);
        if (distFromZero <= SAFE_ZONE_RADIUS + 50) return;

        if (isSpawnPointUsed(centerX, centerY)) return;

        usedSpawnPoints.push({ x: centerX, y: centerY });

        const groupSize = Math.floor(Math.random() * 2) + 1;
        const groupTypeRand = Math.random();
        let type = 0;
        if (groupTypeRand > 0.7 && groupTypeRand < 0.92) type = 1;
        else if (groupTypeRand >= 0.92) type = 2;

        for (let i = 0; i < groupSize; i++) {
            const offsetX = (Math.random() - 0.5) * 60;
            const offsetY = (Math.random() - 0.5) * 60;
            enemies.push(new Enemy(centerX + offsetX, centerY + offsetY, type));
        }
    }
}

function updateUI() {
    document.getElementById('hp-fill').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    
    const staminaFill = document.getElementById('stamina-fill');
    staminaFill.style.width = `${Math.max(0, (player.stamina / player.maxStamina) * 100)}%`;
    if (player.isExhausted) {
        staminaFill.classList.add('exhausted');
    } else {
        staminaFill.classList.remove('exhausted');
    }

    document.getElementById('level-txt').innerText = `LV. ${player.level}`;
    document.getElementById('exp-fill').style.width = `${(player.exp / player.nextExp) * 100}%`;
    document.getElementById('score-txt').innerText = `Score: ${score}`;
}

function drawSafeZone() {
    const screenX = SAFE_ZONE_CENTER.x - camera.x;
    const screenY = SAFE_ZONE_CENTER.y - camera.y;

    ctx.save();
    ctx.beginPath();
    ctx.arc(screenX, screenY, SAFE_ZONE_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(46, 204, 113, 0.15)';
    ctx.fill();
    ctx.strokeStyle = '#2ecc71';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#2ecc71';
    ctx.font = 'bold 16px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText("SAFE ZONE (0,0)", screenX, screenY - houses[0].height / 2 - 20);
    ctx.restore();
}

function drawMinimap() {
    minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);

    const rangeX = canvas.width * 3;
    const rangeY = canvas.height * 3;

    const startX = player.x - rangeX / 2;
    const startY = player.y - rangeY / 2;

    const scaleX = minimapCanvas.width / rangeX;
    const scaleY = minimapCanvas.height / rangeY;

    const szMinimapX = (SAFE_ZONE_CENTER.x - startX) * scaleX;
    const szMinimapY = (SAFE_ZONE_CENTER.y - startY) * scaleY;
    minimapCtx.fillStyle = 'rgba(46, 204, 113, 0.3)';
    minimapCtx.beginPath();
    minimapCtx.arc(szMinimapX, szMinimapY, SAFE_ZONE_RADIUS * scaleX, 0, Math.PI * 2);
    minimapCtx.fill();

    // 모든 집을 미니맵에 표시
    houses.forEach(h => {
        minimapCtx.fillStyle = '#686d76';
        minimapCtx.fillRect(
            (h.x - startX) * scaleX,
            (h.y - startY) * scaleY,
            h.width * scaleX,
            h.height * scaleY
        );
    });

    minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    minimapCtx.lineWidth = 1;
    minimapCtx.strokeRect(
        (camera.x - startX) * scaleX,
        (camera.y - startY) * scaleY,
        camera.width * scaleX,
        camera.height * scaleY
    );

    enemies.forEach(e => {
        if (e.x >= startX && e.x <= startX + rangeX &&
            e.y >= startY && e.y <= startY + rangeY) {
            minimapCtx.fillStyle = e.color;
            minimapCtx.fillRect((e.x - startX) * scaleX - 1, (e.y - startY) * scaleY - 1, 2, 2);
        }
    });

    minimapCtx.fillStyle = '#00ffcc';
    minimapCtx.beginPath();
    minimapCtx.arc((player.x - startX) * scaleX, (player.y - startY) * scaleY, 2.5, 0, Math.PI * 2);
    minimapCtx.fill();
}

function drawFullMap() {
    if (!isFullMapOpen) return;

    fullmapCtx.clearRect(0, 0, fullmapCanvas.width, fullmapCanvas.height);

    const scaleX = fullmapCanvas.width / WORLD.width;
    const scaleY = fullmapCanvas.height / WORLD.height;

    fullmapCtx.strokeStyle = '#333';
    fullmapCtx.strokeRect(0, 0, fullmapCanvas.width, fullmapCanvas.height);

    fullmapCtx.beginPath();
    fullmapCtx.arc(SAFE_ZONE_CENTER.x * scaleX, SAFE_ZONE_CENTER.y * scaleY, SAFE_ZONE_RADIUS * scaleX, 0, Math.PI * 2);
    fullmapCtx.fillStyle = 'rgba(46, 204, 113, 0.4)';
    fullmapCtx.fill();

    // 모든 집을 전체 지도에 표시
    houses.forEach(h => {
        fullmapCtx.fillStyle = '#8e99a2';
        fullmapCtx.fillRect(h.x * scaleX, h.y * scaleY, h.width * scaleX, h.height * scaleY);
    });

    fullmapCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    fullmapCtx.lineWidth = 1;
    fullmapCtx.strokeRect(
        camera.x * scaleX,
        camera.y * scaleY,
        camera.width * scaleX,
        camera.height * scaleY
    );

    enemies.forEach(e => {
        fullmapCtx.fillStyle = e.color;
        fullmapCtx.fillRect(e.x * scaleX, e.y * scaleY, 2, 2);
    });

    fullmapCtx.fillStyle = '#00ffcc';
    fullmapCtx.beginPath();
    fullmapCtx.arc(player.x * scaleX, player.y * scaleY, 4, 0, Math.PI * 2);
    fullmapCtx.fill();
}

function init() {
    player = new Player();
    projectiles = [];
    enemyProjectiles = [];
    enemies = [];
    particles = [];
    popups = [];
    usedSpawnPoints = [];
    lockedTarget = null;
    score = 0;
    gameOver = false;
    isFullMapOpen = false;
    document.getElementById('fullmap-modal').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');

    for (let i = 0; i < 5; i++) {
        spawnEnemies();
    }
    updateUI();
}

function endGame() {
    gameOver = true;
    document.getElementById('final-score').innerText = `최종 점수: ${score}`;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

function restartGame() {
    init();
}

function loop() {
    if (!gameOver && !isFullMapOpen) {
        spawnEnemies();
        player.update();
        updateHousesVisibility();
        camera.update(player.x, player.y);

        projectiles.forEach(p => p.update());
        enemyProjectiles.forEach(ep => ep.update());
        enemies.forEach(e => e.update());
        particles.forEach(p => p.update());
        popups.forEach(p => p.update());

        projectiles.forEach(p => {
            enemies.forEach(e => {
                const dist = Math.hypot(p.x - e.x, p.y - e.y);
                if (dist < p.radius + e.radius) {
                    p.markedForDeletion = true;
                    e.hp -= p.damage;

                    for (let i = 0; i < 5; i++) {
                        particles.push(new Particle(p.x, p.y, e.color));
                    }
                    createPopup(e.x, e.y, Math.floor(p.damage));

                    if (e.hp <= 0) {
                        e.markedForDeletion = true;
                        score += e.scoreValue;
                        player.addExp(e.expValue);

                        for (let i = 0; i < 12; i++) {
                            particles.push(new Particle(e.x, e.y, e.color));
                        }
                    }
                }
            });
        });

        projectiles = projectiles.filter(p => !p.markedForDeletion);
        enemyProjectiles = enemyProjectiles.filter(ep => !ep.markedForDeletion);
        enemies.forEach(e => e.draw());
        enemies = enemies.filter(e => !e.markedForDeletion);
        particles = particles.filter(p => p.alpha > 0);
        popups = popups.filter(p => p.alpha > 0);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#2d2d42';
    ctx.lineWidth = 1;
    const startX = Math.floor(camera.x / 50) * 50;
    const endX = startX + canvas.width + 50;
    const startY = Math.floor(camera.y / 50) * 50;
    const endY = startY + canvas.height + 50;

    for (let x = startX; x < endX; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x - camera.x, 0);
        ctx.lineTo(x - camera.x, canvas.height);
        ctx.stroke();
    }
    for (let y = startY; y < endY; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y - camera.y);
        ctx.lineTo(canvas.width, y - camera.y);
        ctx.stroke();
    }

    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 6;
    ctx.strokeRect(-camera.x, -camera.y, WORLD.width, WORLD.height);

    drawSafeZone();

    drawHousesInterior();

    particles.forEach(p => p.draw());
    projectiles.forEach(p => p.draw());
    enemyProjectiles.forEach(ep => ep.draw());
    enemies.forEach(e => e.draw());
    if (!gameOver) player.draw();

    drawHousesRoof();
    popups.forEach(p => p.draw());

    drawMinimap();
    drawFullMap();

    requestAnimationFrame(loop);
}

init();
loop();
</script>
