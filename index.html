<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>5자리 숫자 코드 멀티플레이 슈팅 게임</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            flex-direction: column;
        }
        #ui {
            background: #222;
            padding: 25px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            width: 320px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #444;
            text-align: center;
            width: 90%;
            background: #333;
            color: white;
        }
        button {
            padding: 12px;
            font-size: 15px;
            background-color: #00ffcc;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            width: 100%;
        }
        button:hover {
            background-color: #00cc88;
        }
        canvas {
            border: 2px solid #ffffff;
            background-color: #111111;
            display: none;
        }
        .code-display {
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
            margin: 5px 0;
        }
    </style>
    <!-- PeerJS 라이브러리 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="ui">
    <h2>2D 멀티 슈팅</h2>
    <input type="text" id="nicknameInput" placeholder="닉네임 입력" maxlength="10">
    
    <button onclick="createRoom()">5자리 방 만들기</button>
    
    <div id="roomCodeArea" style="display:none; text-align:center;">
        <span>방 코드: </span>
        <div id="roomCodeDisplay" class="code-display">00000</div>
        <p style="font-size:12px; color:#aaa; margin:2px 0;">상대방이 접속할 때까지 기다려주세요...</p>
    </div>

    <hr style="width:100%; border-color:#444; margin: 10px 0;">
    
    <input type="text" id="joinIdInput" placeholder="5자리 숫자 코드 입력" maxlength="5">
    <button onclick="joinRoom()" style="background-color: #ffcc00;">참가하기</button>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
// 5자리 접두사 (PeerJS 공용 서버 식별용)
const PREFIX = "gun-game-room-5num-";

let peer = null;
let conn = null;
let myNickname = "플레이어";

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const myPlayer = { x: 100, y: 300, angle: 0, color: '#00ffcc', name: '' };
const otherPlayer = { x: 700, y: 300, angle: 0, color: '#ff4444', name: '상대방' };

const keys = {};
const mouse = { x: 0, y: 0 };
const bullets = [];

// 5자리 무작위 숫자 생성 함수
function generate5DigitCode() {
    return Math.floor(10000 + Math.random() * 90000).toString();
}

// 방 만들기 (호스트)
function createRoom() {
    myNickname = document.getElementById('nicknameInput').value.trim() || "호스트";
    myPlayer.name = myNickname;
    myPlayer.x = 100;

    const roomCode = generate5DigitCode();
    const fullPeerId = PREFIX + roomCode;

    peer = new Peer(fullPeerId);

    peer.on('open', (id) => {
        document.getElementById('roomCodeDisplay').innerText = roomCode;
        document.getElementById('roomCodeArea').style.display = 'block';
    });

    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
        startGameUI();
    });

    peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
            alert('중복된 코드입니다. 다시 시도해주세요.');
            location.reload();
        } else {
            alert('오류 발생: ' + err.type);
        }
    });
}

// 방 참가하기 (게스트)
function joinRoom() {
    const inputCode = document.getElementById('joinIdInput').value.trim();
    if (inputCode.length !== 5 || isNaN(inputCode)) {
        return alert('5자리 숫자를 정확히 입력해주세요.');
    }

    myNickname = document.getElementById('nicknameInput').value.trim() || "게스트";
    myPlayer.name = myNickname;
    myPlayer.x = 700;

    peer = new Peer(); // 랜덤 ID로 게스트 접속

    peer.on('open', () => {
        const targetFullId = PREFIX + inputCode;
        conn = peer.connect(targetFullId);

        conn.on('open', () => {
            setupConnection();
            startGameUI();
        });

        conn.on('error', () => {
            alert('방을 찾을 수 없거나 접속할 수 없습니다.');
        });
    });
}

function startGameUI() {
    document.getElementById('ui').style.display = 'none';
    canvas.style.display = 'block';
    initGameEvents();
}

function setupConnection() {
    conn.on('data', (data) => {
        if (data.type === 'state') {
            otherPlayer.x = data.x;
            otherPlayer.y = data.y;
            otherPlayer.angle = data.angle;
            otherPlayer.name = data.name;
        } else if (data.type === 'shoot') {
            bullets.push(data.bullet);
        }
    });
}

function initGameEvents() {
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('click', shoot);

    // 내 위치/상태를 상대방에게 동기화 (초당 30회)
    setInterval(() => {
        if (conn && conn.open) {
            conn.send({
                type: 'state',
                x: myPlayer.x,
                y: myPlayer.y,
                angle: myPlayer.angle,
                name: myPlayer.name
            });
        }
    }, 1000 / 30);

    gameLoop();
}

function shoot() {
    const bullet = {
        x: myPlayer.x,
        y: myPlayer.y,
        dx: Math.cos(myPlayer.angle) * 8,
        dy: Math.sin(myPlayer.angle) * 8
    };
    bullets.push(bullet);

    if (conn && conn.open) {
        conn.send({ type: 'shoot', bullet: bullet });
    }
}

function update() {
    // WASD 이동
    if (keys['w'] || keys['W']) myPlayer.y -= 4;
    if (keys['s'] || keys['S']) myPlayer.y += 4;
    if (keys['a'] || keys['A']) myPlayer.x -= 4;
    if (keys['d'] || keys['D']) myPlayer.x += 4;

    // 조준 각도
    myPlayer.angle = Math.atan2(mouse.y - myPlayer.y, mouse.x - myPlayer.x);

    // 총알 위치 이동 및 제거
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.dx;
        b.y += b.dy;
        if (b.x < 0 || b.x > 800 || b.y < 0 || b.y > 600) {
            bullets.splice(i, 1);
        }
    }
}

function drawPlayer(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    
    // 닉네임 표시
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, 0, -25);

    // 캐릭터 및 총구 그리기
    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(0, -3, 22, 6);
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 캐릭터 그리기
    drawPlayer(myPlayer);
    if (conn && conn.open) drawPlayer(otherPlayer);

    // 총알 그리기
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffff00';
        ctx.fill();
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
