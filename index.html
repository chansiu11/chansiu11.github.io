<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MMO 오픈월드 슈팅 게임</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            flex-direction: column;
            overflow: hidden;
        }
        #ui {
            position: absolute;
            background: rgba(20, 20, 20, 0.95);
            padding: 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            width: 320px;
            z-index: 10;
        }
        input {
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #444;
            text-align: center;
            width: 90%;
            background: #222;
            color: white;
        }
        button {
            padding: 12px;
            font-size: 15px;
            background-color: #00ffcc;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            width: 100%;
        }
        button:hover { background-color: #00cc88; }
        #statusHUD {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 5;
            display: none;
        }
        canvas {
            border: 1px solid #333;
            background-color: #1a1a1a;
            display: none;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="ui">
    <h2>오픈월드 PVP 슈팅</h2>
    <input type="text" id="nicknameInput" placeholder="닉네임 입력" maxlength="10">
    
    <button onclick="createRoom()">비밀 방 생성 (호스트)</button>
    <div id="roomCodeDisplay" style="color:#00ffcc; font-weight:bold;"></div>

    <hr style="width:100%; border-color:#444; margin: 5px 0;">
    
    <input type="text" id="joinIdInput" placeholder="비워두면 공용서버 접속" maxlength="5">
    <button onclick="joinRoom()" style="background-color: #ffcc00;">공동 서버 접속</button>
</div>

<div id="statusHUD">
    <span id="zoneStatus" style="color: #00ffcc;">[안전 지대]</span> | 
    PVP 상태: <span id="pvpTimer">OFF</span>
</div>

<canvas id="gameCanvas" width="900" height="700"></canvas>

<script>
const WORLD_SIZE = 2400; 
// 세이프존 크기 반으로 축소 (400 -> 200)
const SAFEZONE = { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2, radius: 200 };

// 장애물 목록
const obstacles = [
    { x: 800, y: 800, w: 250, h: 50 },
    { x: 1400, y: 800, w: 50, h: 250 },
    { x: 800, y: 1500, w: 250, h: 50 },
    { x: 1500, y: 1500, w: 180, h: 180 },
    { x: 500, y: 1200, w: 50, h: 300 }
];

const PUBLIC_ROOM_ID = "gungame-public-server-room-v1";

let peer = null, conn = null;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const myPlayer = {
    x: SAFEZONE.x, y: SAFEZONE.y,
    angle: 0,
    speed: 0.8,
    hp: 100, maxHp: 100,
    name: '플레이어',
    color: '#00ffcc',
    inPVP: false // 죽기 전까지 영구 전투 상태 유지 변수
};

const otherPlayer = {
    x: SAFEZONE.x + 50, y: SAFEZONE.y + 50,
    angle: 0,
    hp: 100, maxHp: 100,
    name: '상대방',
    color: '#ff4444',
    inPVP: false
};

const keys = {};
const mouse = { x: 0, y: 0 };
const bullets = [];

function generateShortId() {
    return Math.random().toString(36).substring(2, 7).toLowerCase();
}

function createRoom() {
    const nick = document.getElementById('nicknameInput').value.trim();
    if(nick) myPlayer.name = nick;
    
    const code = generateShortId();
    peer = new Peer('gungame-room-' + code);
    
    peer.on('open', () => {
        document.getElementById('roomCodeDisplay').innerText = "생성된 코드: " + code;
    });
    
    peer.on('connection', c => {
        conn = c;
        setupConnection();
        startGame();
    });
}

function joinRoom() {
    const input = document.getElementById('joinIdInput').value.trim().toLowerCase();
    const nick = document.getElementById('nicknameInput').value.trim();
    if(nick) myPlayer.name = nick;

    peer = new Peer();
    peer.on('open', () => {
        // 코드 비워두면 공용서버 ID로 접속
        const targetPeerId = input === "" ? PUBLIC_ROOM_ID : 'gungame-room-' + input;
        
        // 공용 서버 호스트 시도
        if(input === "") {
            const hostPeer = new Peer(PUBLIC_ROOM_ID);
            hostPeer.on('open', () => {
                peer = hostPeer;
                peer.on('connection', c => {
                    conn = c;
                    setupConnection();
                    startGame();
                });
                startGame();
            });
            hostPeer.on('error', (err) => {
                // 이미 공용 호스트가 존재하면 해당 호스트에 접속
                if(err.type === 'unavailable-id') {
                    conn = peer.connect(PUBLIC_ROOM_ID);
                    conn.on('open', () => {
                        setupConnection();
                        startGame();
                    });
                }
            });
        } else {
            conn = peer.connect(targetPeerId);
            conn.on('open', () => {
                setupConnection();
                startGame();
            });
            conn.on('error', () => {
                alert('방을 찾을 수 없습니다.');
            });
        }
    });
}

function startGame() {
    document.getElementById('ui').style.display = 'none';
    document.getElementById('statusHUD').style.display = 'block';
    canvas.style.display = 'block';
    initEvents();
}

function setupConnection() {
    conn.on('data', data => {
        if(data.type === 'state') {
            Object.assign(otherPlayer, data.player);
        } else if(data.type === 'shoot') {
            bullets.push(data.bullet);
        } else if(data.type === 'hit') {
            myPlayer.hp -= data.damage;
            myPlayer.inPVP = true; // 대미지 받으면 전투 상태 돌입
            
            // 사망 시 리스폰 및 전투 상태 해제
            if(myPlayer.hp <= 0) {
                alert("사망하셨습니다! 세이프존에서 리스폰합니다.");
                respawnPlayer();
            }
        }
    });
}

function respawnPlayer() {
    myPlayer.hp = myPlayer.maxHp;
    myPlayer.x = SAFEZONE.x;
    myPlayer.y = SAFEZONE.y;
    myPlayer.inPVP = false; // 사망해야만 전투 상태 해제
}

function initEvents() {
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('click', shoot);

    setInterval(() => {
        if(conn && conn.open) {
            conn.send({ type: 'state', player: myPlayer });
        }
    }, 1000 / 30);

    gameLoop();
}

function shoot() {
    const distFromCenter = Math.hypot(myPlayer.x - SAFEZONE.x, myPlayer.y - SAFEZONE.y);
    if(distFromCenter < SAFEZONE.radius) return;

    myPlayer.inPVP = true; // 공격 시 사망 전까지 전투 상태 유지

    // 총알 속도 50으로 설정
    const speed = 50;
    const bullet = {
        x: myPlayer.x, y: myPlayer.y,
        prevX: myPlayer.x, prevY: myPlayer.y,
        dx: Math.cos(myPlayer.angle) * speed,
        dy: Math.sin(myPlayer.angle) * speed,
        owner: myPlayer.name
    };
    bullets.push(bullet);

    if(conn && conn.open) {
        conn.send({ type: 'shoot', bullet });
    }
}

// 점이 사각형 장애물 내부에 있는지 확인
function pointInObstacle(px, py) {
    for (let obs of obstacles) {
        if (px >= obs.x && px <= obs.x + obs.w && py >= obs.y && py <= obs.y + obs.h) {
            return true;
        }
    }
    return false;
}

// 총알 이동 궤적 선분과 사각형 장애물의 충돌 검사 (벽 뚫기 완전 방지)
function bulletCollidesWithObstacle(x1, y1, x2, y2) {
    const steps = 10;
    for (let i = 0; i <= steps; i++) {
        const checkX = x1 + (x2 - x1) * (i / steps);
        const checkY = y1 + (y2 - y1) * (i / steps);
        if (pointInObstacle(checkX, checkY)) return true;
    }
    return false;
}

function checkObstacleCollision(x, y, radius) {
    for (let obs of obstacles) {
        if (x + radius > obs.x && x - radius < obs.x + obs.w &&
            y + radius > obs.y && y - radius < obs.y + obs.h) {
            return true;
        }
    }
    return false;
}

function update() {
    let dx = 0, dy = 0;
    if (keys['w'] || keys['W']) dy -= myPlayer.speed;
    if (keys['s'] || keys['S']) dy += myPlayer.speed;
    if (keys['a'] || keys['A']) dx -= myPlayer.speed;
    if (keys['d'] || keys['D']) dx += myPlayer.speed;

    let nextX = myPlayer.x + dx;
    let nextY = myPlayer.y + dy;

    nextX = Math.max(20, Math.min(WORLD_SIZE - 20, nextX));
    nextY = Math.max(20, Math.min(WORLD_SIZE - 20, nextY));

    if (!checkObstacleCollision(nextX, myPlayer.y, 15)) myPlayer.x = nextX;
    if (!checkObstacleCollision(myPlayer.x, nextY, 15)) myPlayer.y = nextY;

    // 전투 중인 경우 세이프존 들어가지 못하도록 통제
    const distToCenter = Math.hypot(myPlayer.x - SAFEZONE.x, myPlayer.y - SAFEZONE.y);
    if (myPlayer.inPVP && distToCenter < SAFEZONE.radius + 15) {
        const angle = Math.atan2(myPlayer.y - SAFEZONE.y, myPlayer.x - SAFEZONE.x);
        myPlayer.x = SAFEZONE.x + Math.cos(angle) * (SAFEZONE.radius + 15);
        myPlayer.y = SAFEZONE.y + Math.sin(angle) * (SAFEZONE.radius + 15);
    }

    const screenCenterX = canvas.width / 2;
    const screenCenterY = canvas.height / 2;
    myPlayer.angle = Math.atan2(mouse.y - screenCenterY, mouse.x - screenCenterX);

    // HUD 정보 업데이트
    const inSafe = distToCenter < SAFEZONE.radius;
    document.getElementById('zoneStatus').innerText = inSafe ? "[안전 지대]" : "[PVP 가능 지역]";
    document.getElementById('zoneStatus').style.color = inSafe ? "#00ffcc" : "#ff4444";
    
    const pvpUI = document.getElementById('pvpTimer');
    if(myPlayer.inPVP) {
        pvpUI.innerText = "ON (사망 전까지 유지)";
        pvpUI.style.color = "#ff4444";
    } else {
        pvpUI.innerText = "OFF";
        pvpUI.style.color = "#aaa";
    }

    // 총알 이동 및 벽 충돌 검사
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.prevX = b.x;
        b.prevY = b.y;
        b.x += b.dx;
        b.y += b.dy;

        // 속도가 빠른 총알이 벽을 통과하지 못하도록 선분 정밀 충돌 처리
        if (bulletCollidesWithObstacle(b.prevX, b.prevY, b.x, b.y)) {
            bullets.splice(i, 1);
            continue;
        }

        // 상대방에게 명중
        if(b.owner !== myPlayer.name && !inSafe) {
            const hitDist = Math.hypot(b.x - myPlayer.x, b.y - myPlayer.y);
            if(hitDist < 18) {
                myPlayer.hp -= 20;
                myPlayer.inPVP = true; // 피격 시 전투 상태 유지
                bullets.splice(i, 1);
                
                if(conn && conn.open) conn.send({ type: 'hit', damage: 20 });
                
                if(myPlayer.hp <= 0) {
                    alert("사망하셨습니다! 세이프존에서 리스폰합니다.");
                    respawnPlayer();
                }
                continue;
            }
        }

        if (b.x < 0 || b.x > WORLD_SIZE || b.y < 0 || b.y > WORLD_SIZE) {
            bullets.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const camX = canvas.width / 2 - myPlayer.x;
    const camY = canvas.height / 2 - myPlayer.y;

    ctx.save();
    ctx.translate(camX, camY);

    // 격자 배경
    ctx.strokeStyle = '#2d2d2d';
    ctx.lineWidth = 1;
    for (let x = 0; x <= WORLD_SIZE; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
    }
    for (let y = 0; y <= WORLD_SIZE; y += 80) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
    }

    // 장애물 그리기
    ctx.fillStyle = '#444444';
    ctx.strokeStyle = '#777777';
    ctx.lineWidth = 3;
    obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    });

    // 외곽 경계선
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 5;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

    // 세이프존 (축소된 크기)
    ctx.beginPath();
    ctx.arc(SAFEZONE.x, SAFEZONE.y, SAFEZONE.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 255, 200, 0.12)';
    ctx.fill();
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 날아가는 총알 및 선명한 궤적 잔상 그리기
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.moveTo(b.prevX, b.prevY);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffff00';
        ctx.fill();
    });

    // 플레이어
    drawEntity(myPlayer);
    if (conn && conn.open) drawEntity(otherPlayer);

    ctx.restore();
}

function drawEntity(p) {
    ctx.save();
    ctx.translate(p.x, p.y);

    const barWidth = 40;
    const barHeight = 6;
    
    // HP 바
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-barWidth/2, -35, barWidth, barHeight);
    
    ctx.fillStyle = p.hp > 30 ? '#00ff55' : '#ff3333';
    ctx.fillRect(-barWidth/2, -35, barWidth * (p.hp / p.maxHp), barHeight);

    ctx.fillStyle = '#ffffff';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, 0, -42);

    // 전투 중 표시 테두리
    if(p.inPVP) {
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.rotate(p.angle);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(0, -3, 22, 6);
    
    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
