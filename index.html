<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Large Map Keyboard RPG with Minimap</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #111118;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas#gameCanvas {
            background-color: #1e1e2d;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .stats-panel {
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            width: fit-content;
        }
        .bar-container {
            width: 200px;
            height: 14px;
            background: #444;
            border-radius: 7px;
            margin-top: 5px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s ease-out;
        }
        #hp-fill { background: #e74c3c; }
        #exp-fill { background: #f1c40f; }
        .text-stat {
            font-size: 14px;
            margin-bottom: 2px;
            font-weight: bold;
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 150px;
            height: 150px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.7);
        }
        canvas#minimapCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game-over-screen.hidden {
            display: none;
        }
        .restart-hint {
            margin-top: 15px;
            font-size: 16px;
            color: #f1c40f;
            font-weight: bold;
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-layer">
        <div class="stats-panel">
            <div class="text-stat" id="level-txt">LV. 1</div>
            <div class="bar-container">
                <div id="hp-fill" class="bar-fill"></div>
            </div>
            <div class="bar-container">
                <div id="exp-fill" class="bar-fill"></div>
            </div>
            <div class="text-stat" id="score-txt" style="margin-top: 8px;">Score: 0</div>
        </div>

        <div id="minimap-container">
            <canvas id="minimapCanvas" width="150" height="150"></canvas>
        </div>

        <div class="controls-hint">
            이동: WASD<br>
            공격 방향: 방향키 (↑ ↓ ← →)<br>
            대시: Spacebar
        </div>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1 style="font-size: 40px; color: #e74c3c; margin-bottom: 10px;">GAME OVER</h1>
        <p id="final-score" style="font-size: 18px;">최종 점수: 0</p>
        <p class="restart-hint">스페이스바(Space)를 눌러 다시 시작</p>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

// 맵 및 카메라 설정
const WORLD = {
    width: 2400,
    height: 1800
};

const camera = {
    x: 0,
    y: 0,
    width: canvas.width,
    height: canvas.height,
    update(targetX, targetY) {
        this.x = targetX - this.width / 2;
        this.y = targetY - this.height / 2;
        this.x = Math.max(0, Math.min(WORLD.width - this.width, this.x));
        this.y = Math.max(0, Math.min(WORLD.height - this.height, this.y));
    }
};

let keys = {};
let lastAttackTime = 0;
let lastDashTime = 0;
let gameOver = false;

let player;
let projectiles = [];
let enemies = [];
let particles = [];
let popups = [];
let score = 0;

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameOver && e.code === 'Space') {
        restartGame();
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

class Player {
    constructor() {
        this.x = WORLD.width / 2;
        this.y = WORLD.height / 2;
        this.radius = 16;
        this.speed = 4.5;
        this.maxHp = 100;
        this.hp = 100;
        this.level = 1;
        this.exp = 0;
        this.nextExp = 50;
        this.attackSpeed = 200;
        this.damage = 25;
        this.angle = 0;
        this.dashCooldown = 1200;
    }

    update() {
        let dx = 0, dy = 0;
        if (keys['KeyW']) dy -= 1;
        if (keys['KeyS']) dy += 1;
        if (keys['KeyA']) dx -= 1;
        if (keys['KeyD']) dx += 1;

        if (dx !== 0 && dy !== 0) {
            dx *= 0.7071;
            dy *= 0.7071;
        }

        const now = Date.now();
        if (keys['Space'] && now - lastDashTime > this.dashCooldown && (dx !== 0 || dy !== 0)) {
            this.x += dx * 70;
            this.y += dy * 70;
            lastDashTime = now;
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(this.x, this.y, '#3498db'));
            }
        } else {
            this.x += dx * this.speed;
            this.y += dy * this.speed;
        }

        this.x = Math.max(this.radius, Math.min(WORLD.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(WORLD.height - this.radius, this.y));

        let attackDx = 0, attackDy = 0;
        if (keys['ArrowUp']) attackDy -= 1;
        if (keys['ArrowDown']) attackDy += 1;
        if (keys['ArrowLeft']) attackDx -= 1;
        if (keys['ArrowRight']) attackDx += 1;

        if (attackDx !== 0 || attackDy !== 0) {
            this.angle = Math.atan2(attackDy, attackDx);
            this.attack();
        }
    }

    attack() {
        const now = Date.now();
        if (now - lastAttackTime > this.attackSpeed) {
            projectiles.push(new Projectile(this.x, this.y, this.angle, this.damage));
            lastAttackTime = now;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y);
        ctx.rotate(this.angle);

        ctx.fillStyle = '#bdc3c7';
        ctx.fillRect(10, -3, 16, 6);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#3498db';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2980b9';
        ctx.stroke();

        ctx.restore();
    }

    addExp(amount) {
        this.exp += amount;
        if (this.exp >= this.nextExp) {
            this.exp -= this.nextExp;
            this.level++;
            this.nextExp = Math.floor(this.nextExp * 1.5);
            this.maxHp += 15;
            this.hp = this.maxHp;
            this.damage += 5;
            createPopup(this.x, this.y - 20, "LEVEL UP!", "#f1c40f");
        }
        updateUI();
    }
}

class Projectile {
    constructor(x, y, angle, damage) {
        this.x = x;
        this.y = y;
        this.speed = 12;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.radius = 5;
        this.damage = damage;
        this.markedForDeletion = false;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > WORLD.width || this.y < 0 || this.y > WORLD.height) {
            this.markedForDeletion = true;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#f39c12';
        ctx.fill();
    }
}

class Enemy {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        
        if (type === 0) {
            this.radius = 14;
            this.speed = 2.0;
            this.hp = 40;
            this.color = '#e74c3c';
            this.expValue = 15;
            this.scoreValue = 100;
        } else if (type === 1) {
            this.radius = 10;
            this.speed = 3.5;
            this.hp = 20;
            this.color = '#e67e22';
            this.expValue = 20;
            this.scoreValue = 150;
        } else {
            this.radius = 28;
            this.speed = 1.2;
            this.hp = 220;
            this.color = '#9b59b6';
            this.expValue = 80;
            this.scoreValue = 500;
        }
        
        this.maxHp = this.hp;
        this.markedForDeletion = false;
    }

    update() {
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;

        const dist = Math.hypot(player.x - this.x, player.y - this.y);
        if (dist < player.radius + this.radius) {
            player.hp -= 0.6;
            if (player.hp <= 0) endGame();
            updateUI();
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y);
        ctx.fillStyle = this.color;
        ctx.beginPath();

        if (this.type === 0) {
            ctx.rect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
        } else if (this.type === 1) {
            ctx.moveTo(0, -this.radius * 1.3);
            ctx.lineTo(this.radius, this.radius);
            ctx.lineTo(-this.radius, this.radius);
            ctx.closePath();
        } else {
            for (let i = 0; i < 5; i++) {
                const a = (Math.PI * 2 / 5) * i;
                const px = Math.cos(a) * this.radius;
                const py = Math.sin(a) * this.radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        }
        ctx.fill();

        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-this.radius, -this.radius - 8, this.radius * 2, 4);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(-this.radius, -this.radius - 8, (this.radius * 2) * (this.hp / this.maxHp), 4);
        }

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.03;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
    }
}

class Popup {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.alpha = 1;
        this.vy = -1;
    }

    update() {
        this.y += this.vy;
        this.alpha -= 0.02;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = 'bold 14px Segoe UI';
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, this.x - camera.x, this.y - camera.y);
        ctx.restore();
    }
}

function createPopup(x, y, text, color = '#fff') {
    popups.push(new Popup(x, y, text, color));
}

function spawnEnemies() {
    if (enemies.length < 50 && Math.random() < 0.05) {
        // 플레이어 시야 밖 스폰
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 300 + 500;
        let x = player.x + Math.cos(angle) * distance;
        let y = player.y + Math.sin(angle) * distance;

        x = Math.max(20, Math.min(WORLD.width - 20, x));
        y = Math.max(20, Math.min(WORLD.height - 20, y));

        const rand = Math.random();
        let type = 0;
        if (rand > 0.7 && rand < 0.93) type = 1;
        else if (rand >= 0.93) type = 2;

        enemies.push(new Enemy(x, y, type));
    }
}

function updateUI() {
    document.getElementById('level-txt').innerText = `LV. ${player.level}`;
    document.getElementById('hp-fill').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    document.getElementById('exp-fill').style.width = `${(player.exp / player.nextExp) * 100}%`;
    document.getElementById('score-txt').innerText = `Score: ${score}`;
}

function drawMinimap() {
    minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);

    const scaleX = minimapCanvas.width / WORLD.width;
    const scaleY = minimapCanvas.height / WORLD.height;

    // 현재 카메라 화면 범위 표시
    minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    minimapCtx.lineWidth = 1;
    minimapCtx.strokeRect(
        camera.x * scaleX,
        camera.y * scaleY,
        camera.width * scaleX,
        camera.height * scaleY
    );

    // 몬스터 표시
    enemies.forEach(e => {
        minimapCtx.fillStyle = e.color;
        minimapCtx.fillRect(e.x * scaleX - 1, e.y * scaleY - 1, 3, 3);
    });

    // 플레이어 표시
    minimapCtx.fillStyle = '#00ffcc';
    minimapCtx.beginPath();
    minimapCtx.arc(player.x * scaleX, player.y * scaleY, 3, 0, Math.PI * 2);
    minimapCtx.fill();
}

function init() {
    player = new Player();
    projectiles = [];
    enemies = [];
    particles = [];
    popups = [];
    score = 0;
    gameOver = false;
    document.getElementById('game-over-screen').classList.add('hidden');
    updateUI();
}

function endGame() {
    gameOver = true;
    document.getElementById('final-score').innerText = `최종 점수: ${score}`;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

function restartGame() {
    init();
}

function loop() {
    if (!gameOver) {
        spawnEnemies();
        player.update();
        camera.update(player.x, player.y);

        projectiles.forEach(p => p.update());
        enemies.forEach(e => e.update());
        particles.forEach(p => p.update());
        popups.forEach(p => p.update());

        projectiles.forEach(p => {
            enemies.forEach(e => {
                const dist = Math.hypot(p.x - e.x, p.y - e.y);
                if (dist < p.radius + e.radius) {
                    p.markedForDeletion = true;
                    e.hp -= p.damage;

                    for (let i = 0; i < 5; i++) {
                        particles.push(new Particle(p.x, p.y, e.color));
                    }
                    createPopup(e.x, e.y, Math.floor(p.damage));

                    if (e.hp <= 0) {
                        e.markedForDeletion = true;
                        score += e.scoreValue;
                        player.addExp(e.expValue);

                        for (let i = 0; i < 12; i++) {
                            particles.push(new Particle(e.x, e.y, e.color));
                        }
                    }
                }
            });
        });

        projectiles = projectiles.filter(p => !p.markedForDeletion);
        enemies = enemies.filter(e => !e.markedForDeletion);
        particles = particles.filter(p => p.alpha > 0);
        popups = popups.filter(p => p.alpha > 0);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 월드 그리드 배경
    ctx.strokeStyle = '#2d2d42';
    ctx.lineWidth = 1;
    const startX = Math.floor(camera.x / 50) * 50;
    const endX = startX + canvas.width + 50;
    const startY = Math.floor(camera.y / 50) * 50;
    const endY = startY + canvas.height + 50;

    for (let x = startX; x < endX; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x - camera.x, 0);
        ctx.lineTo(x - camera.x, canvas.height);
        ctx.stroke();
    }
    for (let y = startY; y < endY; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y - camera.y);
        ctx.lineTo(canvas.width, y - camera.y);
        ctx.stroke();
    }

    // 월드 경계선
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 4;
    ctx.strokeRect(-camera.x, -camera.y, WORLD.width, WORLD.height);

    particles.forEach(p => p.draw());
    projectiles.forEach(p => p.draw());
    enemies.forEach(e => e.draw());
    if (!gameOver) player.draw();
    popups.forEach(p => p.draw());

    drawMinimap();

    requestAnimationFrame(loop);
}

init();
loop();
</script>

</body>
</html>
