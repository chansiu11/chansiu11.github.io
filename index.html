```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🍎 사과게임</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#16210f,#304b1b);
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    width:min(96vw,600px);
    padding:18px;
    background:#111a0d;
    border:3px solid #6e9c3b;
    border-radius:22px;
    box-shadow:0 20px 60px #0008;
}

h1{
    text-align:center;
    margin:0 0 12px;
    font-size:34px;
}

#info{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.box{
    flex:1;
    background:#243719;
    border:2px solid #54762f;
    border-radius:12px;
    padding:9px;
    text-align:center;
}

.label{
    font-size:12px;
    color:#b7d693;
}

.value{
    font-size:24px;
    font-weight:bold;
}

#board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    background:#344823;
    padding:8px;
    border-radius:15px;
}

.cell{
    aspect-ratio:1;
    background:#1c2915;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    user-select:none;
    transition:transform .12s,background .12s;
}

.cell:hover{
    background:#293c1d;
}

.apple{
    width:76%;
    height:76%;
    border-radius:50%;
    background:#d93333;
    border:4px solid #a51f1f;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    font-size:clamp(15px,5vw,28px);
    font-weight:bold;
    color:white;
    box-shadow:inset -6px -8px 0 #a71f1f,
               0 5px 8px #0008;
}

.apple::before{
    content:"";
    position:absolute;
    width:12px;
    height:7px;
    background:#5d9c38;
    top:-7px;
    right:5px;
    border-radius:100%;
    transform:rotate(-25deg);
}

.apple::after{
    content:"";
    position:absolute;
    width:4px;
    height:13px;
    background:#58381e;
    top:-9px;
    right:15px;
    transform:rotate(15deg);
}

.apple.merge{
    animation:merge .25s ease;
}

@keyframes merge{
    0%{
        transform:scale(.5);
    }
    60%{
        transform:scale(1.3);
    }
    100%{
        transform:scale(1);
    }
}

#message{
    min-height:28px;
    text-align:center;
    margin:12px 0;
    color:#ffe68b;
    font-weight:bold;
}

#controls{
    display:flex;
    justify-content:center;
    gap:8px;
}

button{
    border:0;
    background:#689f38;
    color:white;
    font-size:16px;
    font-weight:bold;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#82bd48;
}

#help{
    text-align:center;
    margin-top:12px;
    color:#a8bc92;
    font-size:12px;
    line-height:1.6;
}

#gameover{
    display:none;
    text-align:center;
    background:#000b;
    padding:18px;
    border-radius:15px;
    margin-top:12px;
}

#gameover h2{
    margin:0 0 8px;
    color:#ffdf65;
}
</style>
</head>

<body>

<div id="game">

<h1>🍎 사과게임</h1>

<div id="info">

    <div class="box">
        <div class="label">점수</div>
        <div class="value" id="score">0</div>
    </div>

    <div class="box">
        <div class="label">최고 점수</div>
        <div class="value" id="best">0</div>
    </div>

    <div class="box">
        <div class="label">최대 사과</div>
        <div class="value" id="max">1</div>
    </div>

</div>

<div id="board"></div>

<div id="message">
    같은 숫자의 사과를 클릭해서 합쳐보세요!
</div>

<div id="controls">
    <button onclick="newGame()">🔄 다시 시작</button>
</div>

<div id="gameover">
    <h2>🍎 게임 종료!</h2>
    <div id="finalScore"></div>
    <br>
    <button onclick="newGame()">다시 플레이</button>
</div>

<div id="help">
    PC: 방향키로 이동 · 클릭으로 사과 선택<br>
    모바일: 사과를 터치해서 합치기
</div>

</div>

<script>

const SIZE = 5;

let board = [];
let score = 0;

let selected = -1;

let best =
    Number(localStorage.getItem("appleBest") || 0);

const boardElement =
    document.getElementById("board");

const scoreElement =
    document.getElementById("score");

const bestElement =
    document.getElementById("best");

const maxElement =
    document.getElementById("max");

const messageElement =
    document.getElementById("message");

const gameoverElement =
    document.getElementById("gameover");

const finalScoreElement =
    document.getElementById("finalScore");


/* =========================
   게임 시작
========================= */

function newGame(){

    board = [];

    score = 0;

    selected = -1;

    gameoverElement.style.display = "none";

    for(let i=0;i<SIZE*SIZE;i++){

        board.push(
            Math.floor(Math.random()*3)+1
        );

    }

    messageElement.textContent =
        "같은 숫자의 사과를 클릭해서 합쳐보세요!";

    render();

}


/* =========================
   화면 그리기
========================= */

function render(){

    boardElement.innerHTML = "";

    let maxValue = 1;

    for(let i=0;i<board.length;i++){

        const cell =
            document.createElement("div");

        cell.className = "cell";

        const value = board[i];

        if(value > 0){

            maxValue =
                Math.max(maxValue,value);

            const apple =
                document.createElement("div");

            apple.className = "apple";

            apple.textContent = value;

            if(i === selected){
                apple.classList.add("merge");
            }

            cell.appendChild(apple);

        }

        cell.addEventListener(
            "click",
            ()=>selectApple(i)
        );

        boardElement.appendChild(cell);
    }

    scoreElement.textContent = score;

    bestElement.textContent = best;

    maxElement.textContent = maxValue;

}


/* =========================
   사과 선택
========================= */

function selectApple(index){

    if(board[index] <= 0){
        return;
    }

    if(selected === -1){

        selected = index;

        messageElement.textContent =
            board[index] +
            " 사과를 선택했습니다. 같은 숫자를 선택하세요!";

        render();

        return;
    }


    if(selected === index){

        selected = -1;

        render();

        return;
    }


    const first = board[selected];

    const second = board[index];


    /*
       같은 숫자면 합체
    */

    if(first === second){

        const newValue =
            first + 1;

        board[index] = newValue;

        board[selected] = 0;

        score += newValue * 10;

        if(score > best){

            best = score;

            localStorage.setItem(
                "appleBest",
                best
            );

        }

        selected = -1;

        messageElement.textContent =
            "🍎 " +
            first +
            " + " +
            second +
            " = " +
            newValue +
            "!";

        render();

        checkGameOver();

    }
    else{

        messageElement.textContent =
            "❌ 숫자가 다릅니다!";

        selected = index;

        render();

    }

}


/* =========================
   게임 종료 검사
========================= */

function checkGameOver(){

    /*
       빈칸이 있으면 계속
    */

    if(board.includes(0)){
        return;
    }


    /*
       합칠 수 있는 같은 숫자가
       붙어 있는지 검사
    */

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            const index =
                y*SIZE+x;

            const value =
                board[index];

            if(x < SIZE-1){

                if(
                    board[index+1] === value
                ){
                    return;
                }

            }

            if(y < SIZE-1){

                if(
                    board[index+SIZE] === value
                ){
                    return;
                }

            }

        }

    }


    /*
       게임 종료
    */

    gameoverElement.style.display =
        "block";

    finalScoreElement.textContent =
        "최종 점수: " + score;

    messageElement.textContent =
        "게임이 끝났습니다!";

}


/* =========================
   방향키 조작
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight"
        ){

            event.preventDefault();

            moveSelection(event.key);

        }

        if(event.key === "Enter"){

            if(selected !== -1){

                selectApple(selected);

            }

        }

        if(
            event.key.toLowerCase() === "r"
        ){

            newGame();

        }

    }
);


/* =========================
   키보드 선택 이동
========================= */

let cursor = 0;

function moveSelection(key){

    let x =
        cursor % SIZE;

    let y =
        Math.floor(cursor / SIZE);


    if(key === "ArrowUp"){
        y--;
    }

    if(key === "ArrowDown"){
        y++;
    }

    if(key === "ArrowLeft"){
        x--;
    }

    if(key === "ArrowRight"){
        x++;
    }


    x = Math.max(
        0,
        Math.min(SIZE-1,x)
    );

    y = Math.max(
        0,
        Math.min(SIZE-1,y)
    );


    cursor =
        y*SIZE+x;

    selected = cursor;

    render();

}


/* =========================
   시작
========================= */

newGame();

</script>

</body>
</html>
