<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국 민물 생태계 & 황소개구리 실시간 시뮬레이터</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #666; margin-top: 0; }
        
        .main-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 맵 스타일 */
        #simCanvas {
            background: linear-gradient(to bottom, #d4edda, #cce5ff);
            border: 3px solid #2c3e50;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 제어 패널 스타일 */
        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .status-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #3498db;
            font-size: 0.9em;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #219653; }
        button.danger { background-color: #e74c3c; }
        button.danger:hover { background-color: #c0392b; }
        button.solution { background-color: #2980b9; }
        button.solution:hover { background-color: #1f618d; }

        .legend {
            font-size: 0.85em;
            line-height: 1.5;
        }
        .legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <h1>🐸 한국 민물 생태계 실시간 시뮬레이터</h1>
    <p>개체들이 무작위로 움직이며 먹고 먹히는 생태계 흐름을 관찰하세요.</p>

    <div class="main-container">
        <!-- 캔버스 맵 -->
        <canvas id="simCanvas" width="600" height="400"></canvas>

        <!-- 제어 패널 -->
        <div class="control-panel">
            <h3>컨트롤 패널</h3>
            
            <div class="status-box" id="statusText">
                상태: 안정적인 토종 생태계 유지 중
            </div>

            <button class="danger" onclick="injectBullfrog()">1. 황소개구리 투입 (교란)</button>
            <button class="solution" onclick="applySolution()">2. 포획 및 천적 투입 (해결)</button>
            <button onclick="resetSim()">초기화</button>

            <div class="legend">
                <strong>범례:</strong><br>
                <span style="background: #27ae60;"></span> 생산자 (수초/플랑크톤)<br>
                <span style="background: #f1c40f;"></span> 1차 소비자 (올챙이/초식)<br>
                <span style="background: #e67e22;"></span> 토종 2차 (참개구리/물고기)<br>
                <span style="background: #c0392b;"></span> 황소개구리 (외래종)<br>
                <span style="background: #8e44ad;"></span> 최상위 (백로/수리부엉이)
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let entities = [];
        let stateMessage = "안정적인 토종 생태계 유지 중";

        // 개체 클래스 정의
        class Entity {
            constructor(type, x, y) {
                this.type = type; // 'producer', 'primary', 'secondary', 'bullfrog', 'apex'
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.energy = 100;
                
                switch(type) {
                    case 'producer': this.color = '#27ae60'; this.radius = 4; this.speed = 0.5; break;
                    case 'primary': this.color = '#f1c40f'; this.radius = 6; this.speed = 1.2; break;
                    case 'secondary': this.color = '#e67e22'; this.radius = 8; this.speed = 1.5; break;
                    case 'bullfrog': this.color = '#c0392b'; this.radius = 11; this.speed = 1.8; break;
                    case 'apex': this.color = '#8e44ad'; this.radius = 13; this.speed = 1.0; break;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // 벽 충돌 시 방향 전환
                if (this.x < this.radius || this.x > canvas.width - this.radius) this.vx *= -1;
                if (this.y < this.radius || this.y > canvas.height - this.radius) this.vy *= -1;

                // 약간의 무작위 움직임 변화
                if (Math.random() < 0.05) {
                    this.vx += (Math.random() - 0.5) * 0.5;
                    this.vy += (Math.random() - 0.5) * 0.5;
                    // 속도 제한
                    const currentSpeed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                    if (currentSpeed > this.speed * 1.5) {
                        this.vx = (this.vx / currentSpeed) * this.speed;
                        this.vy = (this.vy / currentSpeed) * this.speed;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        // 초기 생태계 세팅
        function initEntities() {
            entities = [];
            // 생산자 생성
            for (let i = 0; i < 40; i++) {
                entities.push(new Entity('producer', Math.random()*canvas.width, Math.random()*canvas.height));
            }
            // 1차 소비자 생성
            for (let i = 0; i < 20; i++) {
                entities.push(new Entity('primary', Math.random()*canvas.width, Math.random()*canvas.height));
            }
            // 2차 소비자 생성
            for (let i = 0; i < 10; i++) {
                entities.push(new Entity('secondary', Math.random()*canvas.width, Math.random()*canvas.height));
            }
            // 최상위 소비자 생성
            for (let i = 0; i < 3; i++) {
                entities.push(new Entity('apex', Math.random()*canvas.width, Math.random()*canvas.height));
            }
        }

        function resetSim() {
            initEntities();
            stateMessage = "상태: 초기화됨 (안정적인 토종 생태계)";
            document.getElementById('statusText').innerText = stateMessage;
            document.getElementById('statusText').style.borderLeftColor = "#3498db";
        }

        // 황소개구리 투입
        function injectBullfrog() {
            // 황소개구리 8마리 투입
            for (let i = 0; i < 8; i++) {
                entities.push(new Entity('bullfrog', Math.random()*canvas.width, Math.random()*canvas.height));
            }
            stateMessage = "⚠️ 경고: 황소개구리 유입! 토종 양서류와 물고기를 무차별 포식하며 생태계가 파괴되는 중!";
            document.getElementById('statusText').innerText = stateMessage;
            document.getElementById('statusText').style.borderLeftColor = "#e74c3c";
        }

        // 해결책 적용 (집단 포식 및 천적 개입)
        function applySolution() {
            // 황소개구리 대폭 제거
            entities = entities.filter(e => e.type !== 'bullfrog' || Math.random() < 0.2);
            // 토종 및 최상위 개체 보충
            for (let i = 0; i < 5; i++) {
                entities.push(new Entity('secondary', Math.random()*canvas.width, Math.random()*canvas.height));
            }
            stateMessage = "✅ 회복 중: 적극적인 퇴치 사업과 생태계 복원으로 토종 생물들이 다시 균형을 찾아가는 중!";
            document.getElementById('statusText').innerText = stateMessage;
            document.getElementById('statusText').style.borderLeftColor = "#27ae60";
        }

        // 충돌 및 포식 메커니즘 처리
        function handleInteractions() {
            for (let i = 0; i < entities.length; i++) {
                for (let j = i + 1; j < entities.length; j++) {
                    let e1 = entities[i];
                    let e2 = entities[j];

                    let dx = e1.x - e2.x;
                    let dy = e1.y - e2.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < e1.radius + e2.radius) {
                        // 포식 관계 판정
                        // 황소개구리는 1차, 2차 소비자를 잡아먹음
                        if (e1.type === 'bullfrog' && (e2.type === 'primary' || e2.type === 'secondary')) {
                            entities.splice(j, 1); // e2 사망
                            e1.radius = Math.min(e1.radius + 1, 16); // 먹어서 커짐
                            break;
                        } else if (e2.type === 'bullfrog' && (e1.type === 'primary' || e1.type === 'secondary')) {
                            entities.splice(i, 1);
                            e2.radius = Math.min(e2.radius + 1, 16);
                            break;
                        }

                        // 최상위 소비자는 황소개구리나 2차 소비자를 먹음
                        if (e1.type === 'apex' && (e2.type === 'secondary' || e2.type === 'bullfrog')) {
                            entities.splice(j, 1);
                            break;
                        } else if (e2.type === 'apex' && (e1.type === 'secondary' || e1.type === 'bullfrog')) {
                            entities.splice(i, 1);
                            break;
                        }
                    }
                }
            }
        }

        // 메인 애니메이션 루프
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            handleInteractions();

            // 개체 업데이트 및 렌더링
            entities.forEach(e => {
                e.update();
                e.draw();
            });

            requestAnimationFrame(animate);
        }

        // 실행
        initEntities();
        animate();
    </script>

</body>
</html>
