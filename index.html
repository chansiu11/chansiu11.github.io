<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>물불 어드벤처</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

body{
    overflow:hidden;
    background:#101522;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}


/* =========================
   메뉴
========================= */

.screen{

    position:fixed;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        #16243d,
        #0d1423
    );

    color:white;

    z-index:20;
}


.title{

    font-size:46px;

    font-weight:900;

    margin-bottom:35px;

    text-shadow:
    4px 4px #000;

}


.menuButton{

    width:250px;

    height:65px;

    margin:10px;

    border:none;

    border-radius:16px;

    background:#278be0;

    color:white;

    font-size:21px;

    font-weight:bold;

    box-shadow:
    0 6px 0 #12518a;

}


.menuButton:active{

    transform:translateY(5px);

    box-shadow:
    0 1px 0 #12518a;

}


/* =========================
   스테이지 선택
========================= */

#stageScreen{

    display:none;

}


.stageGrid{

    display:grid;

    grid-template-columns:
    repeat(3,90px);

    gap:15px;

}


.stage{

    width:90px;

    height:90px;

    border-radius:15px;

    border:3px solid white;

    background:#3479ba;

    color:white;

    font-size:28px;

    font-weight:bold;

}


.stage.locked{

    background:#444;

    opacity:.5;

}


.back{

    margin-top:25px;

    background:#555;

    box-shadow:
    0 5px 0 #222;

}


/* =========================
   게임 UI
========================= */

#gameUI{

    display:none;

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:10;

}


#levelText{

    position:absolute;

    top:10px;

    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:18px;

    font-weight:bold;

    text-shadow:
    2px 2px #000;

}


/* =========================
   모바일 버튼
========================= */

.controls{

    position:absolute;

    bottom:15px;

    display:flex;

    gap:8px;

    pointer-events:auto;

}


#waterControls{

    left:15px;

}


#fireControls{

    right:15px;

}


.control{

    width:55px;

    height:55px;

    border-radius:15px;

    border:3px solid white;

    background:#27384d;

    color:white;

    font-size:21px;

    font-weight:bold;

    box-shadow:
    0 4px 0 #111;

}


.control:active{

    transform:translateY(3px);

}


/* =========================
   결과 화면
========================= */

#resultScreen{

    display:none;

}


.resultTitle{

    font-size:42px;

    font-weight:900;

    margin-bottom:20px;

}


.resultText{

    margin-bottom:25px;

    color:#ddd;

    font-size:18px;

}

</style>
</head>

<body>


<!-- =====================================================
     게임 캔버스
===================================================== -->

<canvas id="game"></canvas>


<!-- =====================================================
     메인 메뉴
===================================================== -->

<div id="menuScreen" class="screen">

    <div class="title">
        💧🔥 물불 어드벤처
    </div>

    <button
    class="menuButton"
    id="startButton">

        게임 시작

    </button>

</div>


<!-- =====================================================
     스테이지 선택
===================================================== -->

<div id="stageScreen" class="screen">

    <div class="title">
        스테이지 선택
    </div>


    <div class="stageGrid">

        <button class="stage"
        data-stage="1">
            1
        </button>

        <button class="stage"
        data-stage="2">
            2
        </button>

        <button class="stage"
        data-stage="3">
            3
        </button>

        <button class="stage"
        data-stage="4">
            4
        </button>

        <button class="stage"
        data-stage="5">
            5
        </button>

        <button class="stage locked">
            🔒
        </button>

    </div>


    <button
    class="menuButton back"
    id="stageBack">

        뒤로

    </button>

</div>


<!-- =====================================================
     게임 UI
===================================================== -->

<div id="gameUI">

    <div id="levelText">
        STAGE 1
    </div>


    <!-- 물 조작 -->

    <div
    class="controls"
    id="waterControls">

        <button
        class="control"
        id="waterLeft">
            ◀
        </button>

        <button
        class="control"
        id="waterRight">
            ▶
        </button>

        <button
        class="control"
        id="waterJump">
            ▲
        </button>

    </div>


    <!-- 불 조작 -->

    <div
    class="controls"
    id="fireControls">

        <button
        class="control"
        id="fireLeft">
            ◀
        </button>

        <button
        class="control"
        id="fireRight">
            ▶
        </button>

        <button
        class="control"
        id="fireJump">
            ▲
        </button>

    </div>

</div>


<!-- =====================================================
     결과 화면
===================================================== -->

<div id="resultScreen" class="screen">

    <div
    class="resultTitle"
    id="resultTitle">

        실패!

    </div>


    <div
    class="resultText"
    id="resultText">

        다시 도전해보세요.

    </div>


    <button
    class="menuButton"
    id="retryButton">

        다시 시작

    </button>


    <button
    class="menuButton back"
    id="resultMenuButton">

        스테이지 선택

    </button>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


let W = innerWidth;

let H = innerHeight;


function resize(){

    W = innerWidth;

    H = innerHeight;

    canvas.width = W;

    canvas.height = H;

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   게임 상태
===================================================== */

let currentStage = 1;

let cameraX = 0;

let gameState = "menu";


/* =====================================================
   입력
===================================================== */

const keys = {};


window.addEventListener(
    "keydown",
    function(e){

        keys[e.key] = true;

        if(
            e.key === "r" ||
            e.key === "R"
        ){

            if(
                gameState === "dead"
            ){

                startStage(
                    currentStage
                );

            }

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[e.key] = false;

    }
);


/* =====================================================
   캐릭터
===================================================== */

const water = {

    x:100,

    y:430,

    w:20,

    h:30,

    vx:0,

    vy:0,

    speed:3.2,

    jump:9,

    grounded:false,

    dead:false,

    color:"#249eea"

};


const fire = {

    x:145,

    y:430,

    w:20,

    h:30,

    vx:0,

    vy:0,

    speed:3.2,

    jump:9,

    grounded:false,

    dead:false,

    color:"#ef542f"

};


/* =====================================================
   맵 크기
===================================================== */

const world = {

    width:5000,

    height:650,

    floor:540

};


/* =====================================================
   플랫폼
===================================================== */

let platforms = [];

let waterHazards = [];

let fireHazards = [];

let gems = [];

let doors = [];


/* =====================================================
   스테이지 생성
===================================================== */

function createStage(stage){

    platforms = [];

    waterHazards = [];

    fireHazards = [];

    gems = [];

    doors = [];


    /* 바닥 */

    platforms.push({

        x:0,

        y:540,

        w:5000,

        h:110

    });


    /* 기본 플랫폼 */

    for(
        let i=0;
        i<16;
        i++
    ){

        platforms.push({

            x:250+i*290,

            y:
            420-
            (i%3)*55,

            w:180,

            h:22

        });

    }


    /* 高低差 */

    platforms.push({

        x:700,

        y:300,

        w:220,

        h:22

    });


    platforms.push({

        x:1350,

        y:270,

        w:230,

        h:22

    });


    platforms.push({

        x:2100,

        y:330,

        w:250,

        h:22

    });


    platforms.push({

        x:2900,

        y:260,

        w:250,

        h:22

    });


    platforms.push({

        x:3800,

        y:320,

        w:300,

        h:22

    });


    /* 물 위험 */

    waterHazards.push({

        x:520,

        y:515,

        w:160,

        h:25

    });


    waterHazards.push({

        x:1700,

        y:515,

        w:180,

        h:25

    });


    waterHazards.push({

        x:3250,

        y:515,

        w:170,

        h:25

    });


    /* 불 위험 */

    fireHazards.push({

        x:850,

        y:515,

        w:170,

        h:25

    });


    fireHazards.push({

        x:2350,

        y:515,

        w:180,

        h:25

    });


    fireHazards.push({

        x:4100,

        y:515,

        w:180,

        h:25

    });


    /* 보석 */

    for(
        let i=0;
        i<12;
        i++
    ){

        gems.push({

            x:
            300+i*370,

            y:
            360-(i%3)*50,

            type:
            i%2===0
            ?"water"
            :"fire",

            taken:false

        });

    }


    /* 출구 */

    doors.push({

        x:4750,

        y:480,

        w:30,

        h:60,

        type:"water"

    });


    doors.push({

        x:4800,

        y:480,

        w:30,

        h:60,

        type:"fire"

    });

}


/* =====================================================
   스테이지 시작
===================================================== */

function startStage(stage){

    currentStage = stage;

    createStage(stage);


    water.x = 100;

    water.y = 500;

    water.vx = 0;

    water.vy = 0;

    water.dead = false;


    fire.x = 145;

    fire.y = 500;

    fire.vx = 0;

    fire.vy = 0;

    fire.dead = false;


    cameraX = 0;

    gameState = "playing";


    document
    .getElementById("menuScreen")
    .style.display="none";


    document
    .getElementById("stageScreen")
    .style.display="none";


    document
    .getElementById("resultScreen")
    .style.display="none";


    document
    .getElementById("gameUI")
    .style.display="block";


    document
    .getElementById("levelText")
    .textContent =
    "STAGE " + stage;

}


/* =====================================================
   메뉴
===================================================== */

document
.getElementById("startButton")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("menuScreen")
        .style.display="none";

        document
        .getElementById("stageScreen")
        .style.display="flex";

    }
);


/* =====================================================
   스테이지 버튼
===================================================== */

document
.querySelectorAll(".stage:not(.locked)")
.forEach(
    button=>{

        button.addEventListener(
            "click",
            function(){

                startStage(
                    Number(
                        button.dataset.stage
                    )
                );

            }
        );

    }
);


/* =====================================================
   뒤로
===================================================== */

document
.getElementById("stageBack")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("stageScreen")
        .style.display="none";

        document
        .getElementById("menuScreen")
        .style.display="flex";

    }
);


/* =====================================================
   모바일 버튼
===================================================== */

function mobileButton(
    id,
    key
){

    const button =
    document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointerleave",
        function(){

            keys[key] = false;

        }
    );

}


/* 물 */

mobileButton(
    "waterLeft",
    "a"
);

mobileButton(
    "waterRight",
    "d"
);

mobileButton(
    "waterJump",
    "w"
);


/* 불 */

mobileButton(
    "fireLeft",
    "ArrowLeft"
);

mobileButton(
    "fireRight",
    "ArrowRight"
);

mobileButton(
    "fireJump",
    "ArrowUp"
);


/* =====================================================
   충돌
===================================================== */

function collision(a,b){

    return (

        a.x < b.x+b.w &&

        a.x+a.w > b.x &&

        a.y < b.y+b.h &&

        a.y+a.h > b.y

    );

}


/* =====================================================
   캐릭터 업데이트
===================================================== */

function updateCharacter(
    p,
    left,
    right,
    jump
){

    p.vx = 0;


    if(keys[left]){

        p.vx =
        -p.speed;

    }


    if(keys[right]){

        p.vx =
        p.speed;

    }


    if(
        keys[jump] &&
        p.grounded
    ){

        p.vy =
        -p.jump;

        p.grounded =
        false;

    }


    /* 중력 */

    p.vy += 0.42;


    p.x += p.vx;

    p.y += p.vy;


    p.grounded=false;


    /* 플랫폼 */

    for(
        const platform
        of platforms
    ){

        if(

            p.x < platform.x+
            platform.w &&

            p.x+p.w >
            platform.x &&

            p.y+p.h >
            platform.y &&

            p.y+p.h-p.vy
            <= platform.y

        ){

            p.y =
            platform.y-p.h;

            p.vy=0;

            p.grounded=true;

        }

    }


    /* 경계 */

    if(p.x<0){

        p.x=0;

    }


    if(
        p.x+p.w>
        world.width
    ){

        p.x =
        world.width-p.w;

    }


    /* 낙사 */

    if(p.y>700){

        p.dead=true;

    }

}


/* =====================================================
   위험 지역
===================================================== */

function checkHazards(
    p,
    type
){

    /* 물은 불 캐릭터에게 위험 */

    if(type==="fire"){

        for(
            const hazard
            of waterHazards
        ){

            if(
                collision(
                    p,
                    hazard
                )
            ){

                p.dead=true;

            }

        }

    }


    /* 불은 물 캐릭터에게 위험 */

    if(type==="water"){

        for(
            const hazard
            of fireHazards
        ){

            if(
                collision(
                    p,
                    hazard
                )
            ){

                p.dead=true;

            }

        }

    }

}


/* =====================================================
   보석
===================================================== */

function collectGems(){

    for(
        const gem
        of gems
    ){

        if(gem.taken)
            continue;


        const target =
        gem.type==="water"
        ?water
        :fire;


        if(

            Math.abs(
                target.x-gem.x
            )<30 &&

            Math.abs(
                target.y-gem.y
            )<45

        ){

            gem.taken=true;

        }

    }

}


/* =====================================================
   출구
===================================================== */

function checkDoors(){

    let waterAtDoor=false;

    let fireAtDoor=false;


    for(
        const door
        of doors
    ){

        if(
            door.type==="water" &&
            collision(
                water,
                door
            )
        ){

            waterAtDoor=true;

        }


        if(
            door.type==="fire" &&
            collision(
                fire,
                door
            )
        ){

            fireAtDoor=true;

        }

    }


    if(
        waterAtDoor &&
        fireAtDoor
    ){

        gameState="win";

        showResult(
            true
        );

    }

}


/* =====================================================
   사망
===================================================== */

function showResult(win){

    gameState =
    win
    ?"win"
    :"dead";


    document
    .getElementById("gameUI")
    .style.display="none";


    document
    .getElementById("resultScreen")
    .style.display="flex";


    const title =
    document
    .getElementById("resultTitle");


    const text =
    document
    .getElementById("resultText");


    if(win){

        title.textContent =
        "🎉 스테이지 클리어!";

        text.textContent =
        "두 캐릭터가 출구에 도착했습니다.";

    }else{

        title.textContent =
        "💥 게임 오버!";

        text.textContent =
        "캐릭터가 위험 지역에 닿았습니다.";

    }

}


/* =====================================================
   다시 시작
===================================================== */

document
.getElementById("retryButton")
.addEventListener(
    "click",
    function(){

        startStage(
            currentStage
        );

    }
);


/* =====================================================
   결과 → 스테이지 선택
===================================================== */

document
.getElementById("resultMenuButton")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("resultScreen")
        .style.display="none";


        document
        .getElementById("stageScreen")
        .style.display="flex";


        gameState="stage";

    }
);


/* =====================================================
   카메라
===================================================== */

function updateCamera(){

    const center =
    (water.x+fire.x)/2;


    cameraX =
    center-W/2;


    cameraX =
    Math.max(
        0,
        Math.min(
            world.width-W,
            cameraX
        )
    );

}


/* =====================================================
   배경
===================================================== */

function drawBackground(){

    const gradient =
    ctx.createLinearGradient(
        0,
        0,
        0,
        H
    );


    gradient.addColorStop(
        0,
        "#182844"
    );


    gradient.addColorStop(
        1,
        "#344c64"
    );


    ctx.fillStyle =
    gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* 背景 산 */

    ctx.fillStyle=
    "#263b50";


    for(
        let x=-cameraX%400-400;
        x<W+400;
        x+=400
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            350
        );

        ctx.lineTo(
            x+200,
            160
        );

        ctx.lineTo(
            x+400,
            350
        );

        ctx.closePath();

        ctx.fill();

    }

}


/* =====================================================
   플랫폼 그리기
===================================================== */

function drawPlatforms(){

    for(
        const p
        of platforms
    ){

        const x =
        p.x-cameraX;


        ctx.fillStyle=
        "#634b39";


        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );


        ctx.fillStyle=
        "#9a7955";


        ctx.fillRect(
            x,
            p.y,
            p.w,
            6
        );

    }

}


/* =====================================================
   위험지역 그리기
===================================================== */

function drawHazards(){

    for(
        const h
        of waterHazards
    ){

        const x =
        h.x-cameraX;


        ctx.fillStyle=
        "#168de0";


        ctx.fillRect(
            x,
            h.y,
            h.w,
            h.h
        );


        ctx.fillStyle=
        "#62caff";


        ctx.fillRect(
            x,
            h.y,
            h.w,
            5
        );

    }


    for(
        const h
        of fireHazards
    ){

        const x =
        h.x-cameraX;


        ctx.fillStyle=
        "#e8482e";


        ctx.fillRect(
            x,
            h.y,
            h.w,
            h.h
        );


        ctx.fillStyle=
        "#ffb329";


        ctx.fillRect(
            x,
            h.y,
            h.w,
            5
        );

    }

}


/* =====================================================
   보석 그리기
===================================================== */

function drawGems(){

    for(
        const g
        of gems
    ){

        if(g.taken)
            continue;


        const x =
        g.x-cameraX;


        ctx.beginPath();


        ctx.moveTo(
            x,
            g.y-12
        );


        ctx.lineTo(
            x+9,
            g.y
        );


        ctx.lineTo(
            x,
            g.y+12
        );


        ctx.lineTo(
            x-9,
            g.y
        );


        ctx.closePath();


        ctx.fillStyle =
        g.type==="water"
        ?" #35baff"
        :"#ff653c";


        ctx.fill();


        ctx.strokeStyle=
        "white";


        ctx.stroke();

    }

}


/* =====================================================
   캐릭터
===================================================== */

function drawCharacter(p){

    const x =
    p.x-cameraX;


    /* 몸 */

    ctx.fillStyle=
    p.color;


    ctx.fillRect(
        x,
        p.y,
        p.w,
        p.h
    );


    /* 머리 */

    ctx.beginPath();


    ctx.arc(
        x+p.w/2,
        p.y-7,
        12,
        0,
        Math.PI*2
    );


    ctx.fillStyle=
    p.color;


    ctx.fill();


    /* 눈 */

    ctx.fillStyle=
    "white";


    ctx.beginPath();


    ctx.arc(
        x+7,
        p.y-9,
        3,
        0,
        Math.PI*2
    );


    ctx.arc(
        x+15,
        p.y-9,
        3,
        0,
        Math.PI*2
    );


    ctx.fill();


    /* 이름 */

    ctx.fillStyle=
    "white";


    ctx.font=
    "bold 10px Arial";


    ctx.textAlign=
    "center";


    ctx.fillText(

        p===water
        ?"WATER"
        :"FIRE",

        x+p.w/2,
        p.y-23

    );

}


/* =====================================================
   출구
===================================================== */

function drawDoors(){

    for(
        const door
        of doors
    ){

        const x =
        door.x-cameraX;


        ctx.fillStyle =
        door.type==="water"
        ?" #218edb"
        :"#e74b32";


        ctx.fillRect(
            x,
            door.y,
            door.w,
            door.h
        );


        ctx.fillStyle=
        "white";


        ctx.font=
        "16px Arial";


        ctx.fillText(

            door.type==="water"
            ?"💧"
            :"🔥",

            x+4,
            door.y+35

        );

    }

}


/* =====================================================
   게임 업데이트
===================================================== */

function update(){

    if(
        gameState!=="playing"
    ){

        return;

    }


    updateCharacter(
        water,
        "a",
        "d",
        "w"
    );


    updateCharacter(
        fire,
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp"
    );


    checkHazards(
        water,
        "water"
    );


    checkHazards(
        fire,
        "fire"
    );


    collectGems();


    checkDoors();


    /* 죽으면 즉시 멈춤 */

    if(
        water.dead ||
        fire.dead
    ){

        showResult(
            false
        );

        return;

    }


    updateCamera();

}


/* =====================================================
   그리기
===================================================== */

function draw(){

    drawBackground();

    drawPlatforms();

    drawHazards();

    drawGems();

    drawDoors();

    drawCharacter(
        water
    );

    drawCharacter(
        fire
    );

}


/* =====================================================
   게임 루프
===================================================== */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}


loop();

</script>

</body>
</html>
