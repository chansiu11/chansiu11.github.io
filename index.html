<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>암 치료 및 종양 성장 예측 시뮬레이션 (Cellular Automata)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a24;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 10px;
            color: #4da6ff;
            font-size: 1.5rem;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }
        .panel {
            background: #242432;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .controls {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .simulation {
            flex: 2;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #4da6ff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start { background-color: #2e7d32; color: white; }
        .btn-start:hover { background-color: #388e3c; }
        .btn-pause { background-color: #f57f17; color: white; }
        .btn-pause:hover { background-color: #fbc02d; }
        .btn-reset { background-color: #c62828; color: white; }
        .btn-reset:hover { background-color: #d32f2f; }
        
        canvas {
            border: 2px solid #333;
            border-radius: 4px;
            background-color: #111;
        }
        .stats {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .stat-card {
            background: #181820;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid #4da6ff;
        }
        .stat-card.red { border-left-color: #ff5252; }
        .stat-card.purple { border-left-color: #ab47bc; }
        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 3px;
        }
        .legend {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        
        /* Modal Style for Equation */
        .info-box {
            font-size: 0.8rem;
            background: #181820;
            padding: 10px;
            border-radius: 4px;
            color: #bbb;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>종양 성장 및 방사선/항암 치료 시뮬레이션</h1>

    <div class="container">
        <div class="panel controls">
            <div class="info-box">
                <strong>Gompertz 성장 모델 & 모의 치료</strong><br>
                암세포는 밀도가 높아질수록 성장 속도가 감퇴합니다. 항암/방사선 투여 주기 시 치료제가 투입되며, 확률적으로 저항성 세포가 발현합니다.
            </div>

            <div class="control-group">
                <label>세포 증식율 (Gompertz a) <span id="val-growth">0.15</span></label>
                <input type="range" id="param-growth" min="0.05" max="0.4" step="0.01" value="0.15">
            </div>

            <div class="control-group">
                <label>치료제 사멸 효율 <span id="val-kill">0.70</span></label>
                <input type="range" id="param-kill" min="0.1" max="0.95" step="0.05" value="0.70">
            </div>

            <div class="control-group">
                <label>내성(저항성) 변이 확률 <span id="val-resist">0.05</span></label>
                <input type="range" id="param-resist" min="0.0" max="0.2" step="0.01" value="0.05">
            </div>

            <div class="control-group">
                <label>치료 주기 (Step) <span id="val-interval">40</span></label>
                <input type="range" id="param-interval" min="10" max="100" step="5" value="40">
            </div>

            <div class="btn-group">
                <button class="btn-start" id="btn-start">시작</button>
                <button class="btn-pause" id="btn-pause">일시정지</button>
                <button class="btn-reset" id="btn-reset">초기화</button>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="color-box" style="background:#ff5252;"></div>일반 암세포</div>
                <div class="legend-item"><div class="color-box" style="background:#ab47bc;"></div>내성 암세포</div>
                <div class="legend-item"><div class="color-box" style="background:#111; border:1px solid #333;"></div>빈 공간</div>
            </div>
        </div>

        <div class="panel simulation">
            <canvas id="simCanvas" width="400" height="400"></canvas>
            
            <div class="stats">
                <div class="stat-card">
                    <div>경과 시간 (Step)</div>
                    <div class="stat-value" id="stat-step">0</div>
                </div>
                <div class="stat-card red">
                    <div>일반 암세포 수</div>
                    <div class="stat-value" id="stat-normal">0</div>
                </div>
                <div class="stat-card purple">
                    <div>내성 암세포 수</div>
                    <div class="stat-value" id="stat-resistant">0</div>
                </div>
            </div>

            <canvas id="chartCanvas" width="400" height="100"></canvas>
        </div>
    </div>

    <script>
        const GRID_SIZE = 100;
        const CELL_SIZE = 4;
        
        // 상태 정의: 0: 빈공간, 1: 일반 암세포, 2: 내성 암세포
        const EMPTY = 0;
        const NORMAL = 1;
        const RESISTANT = 2;

        let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(EMPTY));
        let isRunning = false;
        let stepCount = 0;
        let animId = null;

        // 히스토리 데이터 (그래프용)
        let historyNormal = [];
        let historyResistant = [];

        // DOM 요소
        const simCanvas = document.getElementById('simCanvas');
        const simCtx = simCanvas.getContext('2d');
        const chartCanvas = document.getElementById('chartCanvas');
        const chartCtx = chartCanvas.getContext('2d');

        // 파라미터 UI
        const paramGrowth = document.getElementById('param-growth');
        const paramKill = document.getElementById('param-kill');
        const paramResist = document.getElementById('param-resist');
        const paramInterval = document.getElementById('param-interval');

        // 값 표시 업데이트
        paramGrowth.oninput = () => document.getElementById('val-growth').innerText = paramGrowth.value;
        paramKill.oninput = () => document.getElementById('val-kill').innerText = paramKill.value;
        paramResist.oninput = () => document.getElementById('val-resist').innerText = paramResist.value;
        paramInterval.oninput = () => document.getElementById('val-interval').innerText = paramInterval.value;

        // 시뮬레이션 초기화
        function initSimulation() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(EMPTY));
            stepCount = 0;
            historyNormal = [];
            historyResistant = [];

            // 중앙에 시드 암세포 생성
            const center = Math.floor(GRID_SIZE / 2);
            for (let i = -2; i <= 2; i++) {
                for (let j = -2; j <= 2; j++) {
                    if (Math.random() < 0.8) {
                        grid[center + i][center + j] = NORMAL;
                    }
                }
            }
            
            drawGrid();
            drawChart();
            updateStats();
        }

        // 세포 그리기
        function drawGrid() {
            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] !== EMPTY) {
                        simCtx.fillStyle = grid[r][c] === NORMAL ? '#ff5252' : '#ab47bc';
                        simCtx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 0.5, CELL_SIZE - 0.5);
                    }
                }
            }
        }

        // 시뮬레이션 1 스텝 진행 (Gompertz 특성 + Cellular Automata 적용)
        function updateSimulation() {
            stepCount++;
            const newGrid = grid.map(arr => [...arr]);
            
            let totalCells = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] !== EMPTY) totalCells++;
                }
            }

            // Gompertz 기반 성장 억제 인자 (지각 밀도가 높아질수록 성장율 감소)
            const maxCapacity = GRID_SIZE * GRID_SIZE * 0.7;
            const densityFactor = Math.max(0.01, 1 - Math.log(totalCells + 1) / Math.log(maxCapacity));
            
            const baseGrowthRate = parseFloat(paramGrowth.value);
            const resistRate = parseFloat(paramResist.value);
            const killRate = parseFloat(paramKill.value);
            const interval = parseInt(paramInterval.value);

            const isTreatmentStep = (stepCount % interval === 0);

            // 주변 8방향 이웃 탐색 함수
            const getEmptyNeighbors = (r, c) => {
                const neighbors = [];
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                            if (grid[nr][nc] === EMPTY) {
                                neighbors.push([nr, nc]);
                            }
                        }
                    }
                }
                return neighbors;
            };

            // Cellular Automata 상태 업데이트
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const current = grid[r][c];

                    if (current !== EMPTY) {
                        // 1. 치료제 투여 이벤트 처리
                        if (isTreatmentStep) {
                            if (current === NORMAL && Math.random() < killRate) {
                                newGrid[r][c] = EMPTY;
                                continue;
                            }
                        }

                        // 2. 세포 분열/증식 (비어있는 이웃 칸으로 전이)
                        const emptyNeighbors = getEmptyNeighbors(r, c);
                        if (emptyNeighbors.length > 0) {
                            const effectiveGrowth = baseGrowthRate * densityFactor;
                            if (Math.random() < effectiveGrowth) {
                                const [targetR, targetC] = emptyNeighbors[Math.floor(Math.random() * emptyNeighbors.length)];
                                
                                // 일반 세포 분열 시 확률적으로 내성 변이 발생
                                if (current === NORMAL) {
                                    newGrid[targetR][targetC] = (Math.random() < resistRate) ? RESISTANT : NORMAL;
                                } else {
                                    newGrid[targetR][targetC] = RESISTANT;
                                }
                            }
                        }
                    }
                }
            }

            grid = newGrid;
            
            // 통계 업데이트
            let normalCnt = 0, resistCnt = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === NORMAL) normalCnt++;
                    if (grid[r][c] === RESISTANT) resistCnt++;
                }
            }
            
            historyNormal.push(normalCnt);
            historyResistant.push(resistCnt);
            if (historyNormal.length > 100) {
                historyNormal.shift();
                historyResistant.shift();
            }

            updateStats(normalCnt, resistCnt);
            drawGrid();
            drawChart();

            // 치료 투여 시각 효과 (화면 잠깐 반짝)
            if (isTreatmentStep) {
                simCtx.fillStyle = 'rgba(77, 166, 255, 0.3)';
                simCtx.fillRect(0, 0, simCanvas.width, simCanvas.height);
            }
        }

        // 실시간 그래프 그리기
        function drawChart() {
            chartCtx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
            
            const w = chartCanvas.width;
            const h = chartCanvas.height;
            const maxVal = Math.max(...historyNormal, ...historyResistant, 500);

            // 가이드라인
            chartCtx.strokeStyle = '#333';
            chartCtx.beginPath();
            chartCtx.moveTo(0, h/2); chartCtx.lineTo(w, h/2);
            chartCtx.stroke();

            // 일반 암세포 추이 (적색)
            chartCtx.strokeStyle = '#ff5252';
            chartCtx.lineWidth = 2;
            chartCtx.beginPath();
            for (let i = 0; i < historyNormal.length; i++) {
                const x = (i / 100) * w;
                const y = h - (historyNormal[i] / maxVal) * h;
                if (i === 0) chartCtx.moveTo(x, y);
                else chartCtx.lineTo(x, y);
            }
            chartCtx.stroke();

            // 내성 암세포 추이 (보라색)
            chartCtx.strokeStyle = '#ab47bc';
            chartCtx.beginPath();
            for (let i = 0; i < historyResistant.length; i++) {
                const x = (i / 100) * w;
                const y = h - (historyResistant[i] / maxVal) * h;
                if (i === 0) chartCtx.moveTo(x, y);
                else chartCtx.lineTo(x, y);
            }
            chartCtx.stroke();
        }

        function updateStats(normal = 0, resistant = 0) {
            document.getElementById('stat-step').innerText = stepCount;
            document.getElementById('stat-normal').innerText = normal;
            document.getElementById('stat-resistant').innerText = resistant;
        }

        function loop() {
            if (isRunning) {
                updateSimulation();
                animId = setTimeout(loop, 100);
            }
        }

        // 이벤트 리스너
        document.getElementById('btn-start').addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                loop();
            }
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isRunning = false;
            clearTimeout(animId);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            isRunning = false;
            clearTimeout(animId);
            initSimulation();
        });

        // 초기화 실행
        initSimulation();
    </script>
</body>
</html>
