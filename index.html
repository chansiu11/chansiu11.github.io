<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2D 배틀필드 로얄</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: white; font-family: sans-serif; overflow: hidden;
        }
        #ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); padding: 25px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 12px; align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); width: 360px; z-index: 10;
        }
        #waitingRoom {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95); padding: 30px; border-radius: 12px;
            display: none; flex-direction: column; gap: 15px; align-items: center;
            box-shadow: 0 0 25px rgba(0,255,200,0.3); width: 400px; z-index: 10; text-align: center;
        }
        input[type="text"] {
            padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid #444;
            text-align: center; width: 90%; background: #222; color: white;
        }
        button {
            padding: 12px; font-size: 15px; background-color: #00ffcc; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; color: #000; width: 100%;
        }
        button:hover { background-color: #00cc88; }
        #statusHUD {
            position: absolute; top: 20px; left: 20px; font-size: 16px; font-weight: bold;
            text-shadow: 2px 2px 4px #000; z-index: 5; display: none; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
        }
        #inventory {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; height: 350px; background: rgba(20, 20, 20, 0.95);
            border: 2px solid #00ffcc; border-radius: 10px; z-index: 20; display: none;
            padding: 20px; flex-direction: column; gap: 15px;
        }
        .inv-section { border: 1px solid #444; padding: 10px; border-radius: 6px; background: #1a1a1a; }
        .inv-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        .inv-item {
            padding: 8px 12px; background: #333; border: 1px solid #666; border-radius: 4px;
            cursor: pointer; font-size: 13px;
        }
        .inv-item:hover { background: #00ffcc; color: #000; }
        canvas { width: 100vw; height: 100vh; display: none; background-color: #1a1a1a; }
    </style>
</head>
<body>

<div id="ui">
    <h2>2D 배틀필드 로얄</h2>
    <input type="text" id="nicknameInput" placeholder="닉네임 입력" maxlength="10">
    <button onclick="enterLobby()" style="background-color: #ffcc00;">공동 서버 접속 (대기실)</button>
</div>

<div id="waitingRoom">
    <h2>대기실 (매치메이킹)</h2>
    <p>인원: <span id="playerCount" style="color:#00ffcc; font-size:20px; font-weight:bold;">1</span> / 10</p>
    <p>남은 시간: <span id="timerDisplay" style="color:#ff4444; font-size:22px; font-weight:bold;">10</span>초</p>
    <div style="font-size: 13px; color: #aaa;">10명이 채워지거나 시간이 지나면 자동 시작됩니다.</div>
</div>

<div id="statusHUD">
    [무기]: <span id="hudWeapon" style="color:#00ffcc;">돌격소총</span> | 
    [장착 스코프]: <span id="hudScope" style="color:#ffcc00;">없음</span> <br>
    [도움말]: E(아이템 줍기) / Tab(가방 열기) / 우클릭(조준)
</div>

<div id="inventory">
    <h3 style="margin:0; text-align:center; color:#00ffcc;">가방 (인벤토리)</h3>
    <div class="inv-section">
        <strong>현재 무기 스코프 장착:</strong>
        <div id="equippedScopeArea" style="margin-top:5px; color:#aaa;">장착된 스코프 없음</div>
    </div>
    <div class="inv-section">
        <strong>보유 중인 스코프 (클릭 시 장착):</strong>
        <div id="scopeList" class="inv-grid"></div>
    </div>
    <button onclick="toggleInventory()" style="margin-top:auto;">닫기 (Tab)</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// 5배 확장된 맵 크기 (12000 x 12000)
const WORLD_SIZE = 12000; 

// 스코프 5종 설정
const SCOPES = {
    '1x': { name: "1배율 (레드닷)", zoom: 0.15, offset: 150 },
    '2x': { name: "2배율", zoom: 0.35, offset: 250 },
    '3x': { name: "3배율", zoom: 0.55, offset: 380 },
    '4x': { name: "4배율", zoom: 0.80, offset: 520 },
    '8x': { name: "8배율", zoom: 1.30, offset: 750 }
};

// 무기 데이터 (AR, SR, SHOTGUN)
const WEAPONS = {
    ar: { name: "돌격소총", cooldown: 110, bulletSpeed: 55, damage: 12.5, pellets: 1, spread: 0.03 },
    sniper: { name: "스나이퍼", cooldown: 900, bulletSpeed: 110, damage: 65, pellets: 1, spread: 0.005 },
    shotgun: { name: "샷건", cooldown: 800, bulletSpeed: 45, damage: 10, pellets: 8, spread: 0.18 }
};

let gameStarted = false;
let waitingTimer = null;
let timeLeft = 10;
let currentPlayers = 1;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// 플레이어 정보
const myPlayer = {
    x: WORLD_SIZE / 2, y: WORLD_SIZE / 2,
    angle: 0, speed: 2.5, hp: 100, maxHp: 100,
    name: '플레이어', weapon: 'ar',
    equippedScope: null,
    inventory: { scopes: ['1x', '2x', '3x', '4x', '8x'] }, // 테스트용 스코프 지급
    isAiming: false, isShooting: false, lastShootTime: 0
};

const camera = { x: myPlayer.x, y: myPlayer.y, zoom: 1 };
const keys = {};
const mouse = { x: 0, y: 0 };
const bullets = [];
const droppedItems = [];

// 월드 드랍 아이템 생성
for(let i=0; i<150; i++) {
    const types = ['ar', 'sniper', 'shotgun', '1x', '2x', '3x', '4x', '8x'];
    droppedItems.push({
        x: Math.random() * (WORLD_SIZE - 200) + 100,
        y: Math.random() * (WORLD_SIZE - 200) + 100,
        type: types[Math.floor(Math.random() * types.length)]
    });
}

function enterLobby() {
    const nick = document.getElementById('nicknameInput').value.trim();
    if(nick) myPlayer.name = nick;
    
    document.getElementById('ui').style.display = 'none';
    document.getElementById('waitingRoom').style.display = 'flex';
    
    // 매치메이킹 타이머 (10초 카운트다운)
    waitingTimer = setInterval(() => {
        timeLeft--;
        document.getElementById('timerDisplay').innerText = timeLeft;
        
        // 가상 유저 참여 시뮬레이션
        if(Math.random() > 0.4 && currentPlayers < 10) {
            currentPlayers++;
            document.getElementById('playerCount').innerText = currentPlayers;
        }

        if (timeLeft <= 0 || currentPlayers >= 10) {
            clearInterval(waitingTimer);
            startGame();
        }
    }, 1000);
}

function startGame() {
    document.getElementById('waitingRoom').style.display = 'none';
    document.getElementById('statusHUD').style.display = 'block';
    canvas.style.display = 'block';
    gameStarted = true;
    resizeCanvas();
    initEvents();
    gameLoop();
}

function initEvents() {
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if(e.key === 'Tab') {
            e.preventDefault();
            toggleInventory();
        }
        if(e.key.toLowerCase() === 'e') {
            pickupItem();
        }
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    
    canvas.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('mousedown', e => {
        if (e.button === 2) myPlayer.isAiming = true;
        if (e.button === 0) myPlayer.isShooting = true;
    });
    canvas.addEventListener('mouseup', e => {
        if (e.button === 2) myPlayer.isAiming = false;
        if (e.button === 0) myPlayer.isShooting = false;
    });
}

function toggleInventory() {
    const inv = document.getElementById('inventory');
    if(inv.style.display === 'flex') {
        inv.style.display = 'none';
    } else {
        renderInventory();
        inv.style.display = 'flex';
    }
}

function renderInventory() {
    const scopeArea = document.getElementById('equippedScopeArea');
    const scopeList = document.getElementById('scopeList');
    
    scopeArea.innerHTML = myPlayer.equippedScope 
        ? `${SCOPES[myPlayer.equippedScope].name} <button style="width:auto; padding:2px 8px; margin-left:10px;" onclick="unequipScope()">해제</button>` 
        : "장착된 스코프 없음";
        
    scopeList.innerHTML = "";
    myPlayer.inventory.scopes.forEach(sc => {
        const item = document.createElement('div');
        item.className = 'inv-item';
        item.innerText = SCOPES[sc].name;
        item.onclick = () => equipScope(sc);
        scopeList.appendChild(item);
    });
}

function equipScope(scKey) {
    myPlayer.equippedScope = scKey;
    updateHUD();
    renderInventory();
}

function unequipScope() {
    myPlayer.equippedScope = null;
    updateHUD();
    renderInventory();
}

function pickupItem() {
    for(let i = droppedItems.length - 1; i >= 0; i--) {
        const item = droppedItems[i];
        if(Math.hypot(myPlayer.x - item.x, myPlayer.y - item.y) < 40) {
            if(['ar', 'sniper', 'shotgun'].includes(item.type)) {
                myPlayer.weapon = item.type;
            } else {
                myPlayer.inventory.scopes.push(item.type);
            }
            droppedItems.splice(i, 1);
            updateHUD();
            break;
        }
    }
}

function updateHUD() {
    document.getElementById('hudWeapon').innerText = WEAPONS[myPlayer.weapon].name;
    document.getElementById('hudScope').innerText = myPlayer.equippedScope ? SCOPES[myPlayer.equippedScope].name : "없음";
}

function shoot() {
    const w = WEAPONS[myPlayer.weapon];
    for(let i=0; i < w.pellets; i++) {
        const spread = (Math.random() - 0.5) * w.spread;
        const angle = myPlayer.angle + spread;
        bullets.push({
            x: myPlayer.x, y: myPlayer.y,
            dx: Math.cos(angle) * w.bulletSpeed,
            dy: Math.sin(angle) * w.bulletSpeed,
            damage: w.damage
        });
    }
}

function update() {
    if(!gameStarted) return;

    // 이동 처리
    let dx = 0, dy = 0;
    if (keys['w']) dy -= 1;
    if (keys['s']) dy += 1;
    if (keys['a']) dx -= 1;
    if (keys['d']) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
    myPlayer.x = Math.max(50, Math.min(WORLD_SIZE - 50, myPlayer.x + dx * myPlayer.speed));
    myPlayer.y = Math.max(50, Math.min(WORLD_SIZE - 50, myPlayer.y + dy * myPlayer.speed));

    // 사격
    if (myPlayer.isShooting) {
        const now = Date.now();
        if (now - myPlayer.lastShootTime >= WEAPONS[myPlayer.weapon].cooldown) {
            shoot();
            myPlayer.lastShootTime = now;
        }
    }

    // 카메라 및 조준 시야 연산
    const screenCenterX = canvas.width / 2;
    const screenCenterY = canvas.height / 2;
    let targetCamX = myPlayer.x;
    let targetCamY = myPlayer.y;
    let targetZoom = 1.0;

    if (myPlayer.isAiming) {
        const sc = myPlayer.equippedScope ? SCOPES[myPlayer.equippedScope] : { zoom: 0.15, offset: 120 };
        const mouseOffsetX = mouse.x - screenCenterX;
        const mouseOffsetY = mouse.y - screenCenterY;
        const dist = Math.hypot(mouseOffsetX, mouseOffsetY);

        if (dist > 0) {
            const actualOffset = Math.min(dist, sc.offset);
            targetCamX += (mouseOffsetX / dist) * actualOffset;
            targetCamY += (mouseOffsetY / dist) * actualOffset;
        }
        targetZoom = 1.0 + sc.zoom;
    }

    camera.x += (targetCamX - camera.x) * 0.1;
    camera.y += (targetCamY - camera.y) * 0.1;
    camera.zoom += (targetZoom - camera.zoom) * 0.1;

    myPlayer.angle = Math.atan2((camera.y + (mouse.y - screenCenterY) / camera.zoom) - myPlayer.y, (camera.x + (mouse.x - screenCenterX) / camera.zoom) - myPlayer.x);

    // 총알 이동
    for(let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.dx; b.y += b.dy;
        if(b.x < 0 || b.x > WORLD_SIZE || b.y < 0 || b.y > WORLD_SIZE) bullets.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(!gameStarted) return;

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(camera.zoom, camera.zoom);
    ctx.translate(-camera.x, -camera.y);

    // 격자 배경
    ctx.strokeStyle = '#252525'; ctx.lineWidth = 2;
    for (let x = 0; x <= WORLD_SIZE; x += 200) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
    }
    for (let y = 0; y <= WORLD_SIZE; y += 200) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
    }

    // 아이템 드랍 그리기
    droppedItems.forEach(item => {
        ctx.fillStyle = ['ar', 'sniper', 'shotgun'].includes(item.type) ? '#ffcc00' : '#00ffcc';
        ctx.beginPath(); ctx.arc(item.x, item.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(item.type.toUpperCase(), item.x, item.y - 12);
    });

    // 총알 그리기
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 3;
    bullets.forEach(b => {
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.dx*0.3, b.y - b.dy*0.3); ctx.stroke();
    });

    // 플레이어 그리기
    ctx.save();
    ctx.translate(myPlayer.x, myPlayer.y);
    ctx.rotate(myPlayer.angle);
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#aaa';
    ctx.fillRect(0, -3, 25, 6);
    ctx.restore();

    ctx.restore();

    // 스코프별 십자선(Crosshair) 렌더링
    if(myPlayer.isAiming) {
        drawScopeCrosshair(myPlayer.equippedScope);
    }
}

// 5종 스코프 개별 조준선 그리기 함수
function drawScopeCrosshair(scopeType) {
    const cx = mouse.x;
    const cy = mouse.y;
    ctx.save();

    if (!scopeType || scopeType === '1x') { // 레드닷
        ctx.fillStyle = 'red';
        ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
    } 
    else if (scopeType === '2x') { // 2배율
        ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();
    } 
    else if (scopeType === '3x') { // 3배율 (쉐브론)
        ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - 8, cy + 8); ctx.lineTo(cx, cy); ctx.lineTo(cx + 8, cy + 8);
        ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy + 8); ctx.lineTo(cx, cy + 20); ctx.stroke();
    } 
    else if (scopeType === '4x') { // 4배율
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx - 25, cy); ctx.lineTo(cx + 25, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - 25); ctx.lineTo(cx, cy + 25); ctx.stroke();
        ctx.strokeStyle = 'red';
        ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.stroke();
    } 
    else if (scopeType === '8x') { // 8배율 (스나이퍼 고배율)
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx - 50, cy); ctx.lineTo(cx + 50, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - 50); ctx.lineTo(cx, cy + 50); ctx.stroke();
        for(let i = -30; i <= 30; i += 10) {
            if(i === 0) continue;
            ctx.beginPath(); ctx.moveTo(cx + i, cy - 3); ctx.lineTo(cx + i, cy + 3); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx - 3, cy + i); ctx.lineTo(cx + 3, cy + i); ctx.stroke();
        }
        ctx.fillStyle = 'red';
        ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
