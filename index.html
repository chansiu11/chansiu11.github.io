<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100x Ultra Large Map RPG - Advanced Combat System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #111118;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas#gameCanvas {
            background-color: #1e1e2d;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .stats-panel {
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            width: fit-content;
        }
        .bar-container {
            width: 200px;
            height: 14px;
            background: #444;
            border-radius: 7px;
            margin-top: 6px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.05s linear;
        }
        #hp-fill { background: #e74c3c; }
        #stamina-fill { background: #2ecc71; }
        #stamina-fill.exhausted { background: #e67e22; }
        #exp-fill { background: #f1c40f; }
        .text-stat {
            font-size: 14px;
            margin-top: 6px;
            font-weight: bold;
        }
        #ammo-stat {
            color: #f39c12;
            font-size: 16px;
            margin-top: 6px;
            font-weight: bold;
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 90px;
            height: 90px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.7);
        }
        canvas#minimapCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #fullmap-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        #fullmap-modal.hidden {
            display: none;
        }
        canvas#fullmapCanvas {
            border: 2px solid #555;
            border-radius: 8px;
            background: #000;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game-over-screen.hidden {
            display: none;
        }
        .restart-hint {
            margin-top: 15px;
            font-size: 16px;
            color: #f1c40f;
            font-weight: bold;
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-layer">
        <div class="stats-panel">
            <div class="bar-container">
                <div id="hp-fill" class="bar-fill"></div>
            </div>
            <div id="ammo-stat">무기: 맨손 (속도 +0.3)</div>
            <div class="bar-container">
                <div id="stamina-fill" class="bar-fill"></div>
            </div>
            <div class="text-stat" id="level-txt">LV. 1</div>
            <div class="bar-container">
                <div id="exp-fill" class="bar-fill"></div>
            </div>
            <div class="text-stat" id="score-txt">Score: 0</div>
            <div class="text-stat" style="color: #2ecc71;">SafeZone: 맵 중앙 (0,0) / R: 700px</div>
        </div>

        <div id="minimap-container">
            <canvas id="minimapCanvas" width="90" height="90"></canvas>
        </div>

        <div class="controls-hint">
            이동: WASD (Shift: 달리기)<br>
            무기교체: 1(맨손) / 2(칼) / 3(총)<br>
            스킬: C (찌르기), V (회전베기), E (섬광베기), R (궁극기: 검기파동)<br>
            공격: 스페이스바 | 대시: Q (0.5초) | 지도: M
        </div>
    </div>

    <div id="fullmap-modal" class="hidden">
        <h2 style="margin-bottom: 10px; color: #3498db;">WORLD MAP (M으로 닫기)</h2>
        <canvas id="fullmapCanvas" width="500" height="375"></canvas>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1 style="font-size: 40px; color: #e74c3c; margin-bottom: 10px;">GAME OVER</h1>
        <p id="final-score" style="font-size: 18px;">최종 점수: 0</p>
        <p class="restart-hint">Q 또는 스페이스바를 눌러 다시 시작</p>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

const fullmapCanvas = document.getElementById('fullmapCanvas');
const fullmapCtx = fullmapCanvas.getContext('2d');

const WORLD = { width: 24000, height: 18000 };
const DETECT_RANGE = 350;
const SAFE_ZONE_CENTER = { x: WORLD.width / 2, y: WORLD.height / 2 };
const SAFE_ZONE_RADIUS = DETECT_RANGE * 2;
const AUTO_TARGET_RANGE = 300;

let houses = [
    { id: 1, x: SAFE_ZONE_CENTER.x - 1200, y: SAFE_ZONE_CENTER.y - 1000, width: 300, height: 240, wallThickness: 16, doorWidth: 70, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#373a40', floorColor: '#4a4e54' },
    { id: 2, x: SAFE_ZONE_CENTER.x + 1000, y: SAFE_ZONE_CENTER.y + 900, width: 280, height: 220, wallThickness: 16, doorWidth: 65, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#2c3e50', floorColor: '#34495e' },
    { id: 3, x: SAFE_ZONE_CENTER.x - 1100, y: SAFE_ZONE_CENTER.y + 1100, width: 320, height: 250, wallThickness: 18, doorWidth: 75, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#4a3b32', floorColor: '#5c4a3e' },
    { id: 4, x: SAFE_ZONE_CENTER.x + 1200, y: SAFE_ZONE_CENTER.y - 1200, width: 260, height: 200, wallThickness: 15, doorWidth: 60, roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08, roofColor: '#1b2631', floorColor: '#2e4053' }
];

let ammoBoxes = [];

function generateRandomHouses(count) {
    const roofColors = ['#2980b9', '#8e44ad', '#16a085', '#d35400', '#2c3e50'];
    const floorColors = ['#34495e', '#2c3e50', '#4a4e54', '#5c4a3e', '#283747'];

    for (let i = 0; i < count; i++) {
        let rx, ry, distToSafeZone;
        let w = Math.floor(Math.random() * 180) + 250;
        let h = Math.floor(Math.random() * 140) + 200;
        do {
            rx = Math.floor(Math.random() * (WORLD.width - w - 1000)) + 500;
            ry = Math.floor(Math.random() * (WORLD.height - h - 1000)) + 500;
            distToSafeZone = Math.hypot(rx + w/2 - SAFE_ZONE_CENTER.x, ry + h/2 - SAFE_ZONE_CENTER.y);
        } while (distToSafeZone < SAFE_ZONE_RADIUS + 400);

        houses.push({
            id: 21 + i, x: rx, y: ry, width: w, height: h,
            wallThickness: Math.floor(Math.random() * 8) + 14,
            doorWidth: Math.floor(Math.random() * 30) + 65,
            roofAlpha: 1.0, targetAlpha: 1.0, fadeSpeed: 0.08,
            roofColor: roofColors[Math.floor(Math.random() * roofColors.length)],
            floorColor: floorColors[Math.floor(Math.random() * floorColors.length)]
        });
    }
}
generateRandomHouses(15);

function initAmmoInHouses() {
    ammoBoxes = [];
    houses.forEach(house => {
        if (Math.random() < 0.6) {
            const count = Math.floor(Math.random() * 4) + 5;
            ammoBoxes.push({
                x: house.x + house.wallThickness + 20 + Math.random() * (house.width - house.wallThickness * 2 - 40),
                y: house.y + house.wallThickness + 20 + Math.random() * (house.height - house.wallThickness * 2 - 40),
                amount: count, radius: 10, taken: false
            });
        }
    });
}

function getHouseContainingPoint(px, py) {
    return houses.find(house => 
        px >= house.x + house.wallThickness && px <= house.x + house.width - house.wallThickness &&
        py >= house.y + house.wallThickness && py <= house.y + house.height - house.wallThickness
    );
}

function checkWallCollision(nextX, nextY, radius) {
    let correctedX = nextX;
    let correctedY = nextY;

    houses.forEach(house => {
        const t = house.wallThickness;
        const doorLeft = house.x + (house.width - house.doorWidth) / 2;
        const doorRight = house.x + (house.width + house.doorWidth) / 2;

        const walls = [
            { x: house.x, y: house.y, w: house.width, h: t },
            { x: house.x, y: house.y, w: t, h: house.height },
            { x: house.x + house.width - t, y: house.y, w: t, h: house.height },
            { x: house.x, y: house.y + house.height - t, w: doorLeft - house.x, h: t },
            { x: doorRight, y: house.y + house.height - t, w: (house.x + house.width) - doorRight, h: t }
        ];

        walls.forEach(w => {
            const closestX = Math.max(w.x, Math.min(correctedX, w.x + w.w));
            const closestY = Math.max(w.y, Math.min(correctedY, w.y + w.h));
            const distX = correctedX - closestX;
            const distY = correctedY - closestY;
            const distance = Math.hypot(distX, distY);

            if (distance < radius) {
                const overlap = radius - distance;
                if (distance === 0) correctedY += overlap;
                else {
                    correctedX += (distX / distance) * overlap;
                    correctedY += (distY / distance) * overlap;
                }
            }
        });
    });

    return { x: correctedX, y: correctedY };
}

function checkLineWallCollision(x1, y1, x2, y2) {
    for (let house of houses) {
        const t = house.wallThickness;
        const doorLeft = house.x + (house.width - house.doorWidth) / 2;
        const doorRight = house.x + (house.width + house.doorWidth) / 2;

        const walls = [
            { x: house.x, y: house.y, w: house.width, h: t },
            { x: house.x, y: house.y, w: t, h: house.height },
            { x: house.x + house.width - t, y: house.y, w: t, h: house.height },
            { x: house.x, y: house.y + house.height - t, w: doorLeft - house.x, h: t },
            { x: doorRight, y: house.y + house.height - t, w: (house.x + house.width) - doorRight, h: t }
        ];

        for (let w of walls) {
            if (x2 >= w.x && x2 <= w.x + w.w && y2 >= w.y && y2 <= w.y + w.h) return true;
        }
    }
    return false;
}

const camera = {
    x: 0, y: 0, width: canvas.width, height: canvas.height,
    update(targetX, targetY) {
        this.x = Math.max(0, Math.min(WORLD.width - this.width, targetX - this.width / 2));
        this.y = Math.max(0, Math.min(WORLD.height - this.height, targetY - this.height / 2));
    }
};

let keys = {};
let lockedTarget = null;
let lastAttackTime = 0;
let gameOver = false;
let isFullMapOpen = false;

let player;
let projectiles = [];
let enemyProjectiles = [];
let enemies = [];
let particles = [];
let popups = [];
let score = 0;
let usedSpawnPoints = [];

function applyStun(target, duration, isSuperArmor = false) {
    if (isSuperArmor && target === player) return;
    target.stunTimer = Date.now() + (duration * 1000);
}

window.addEventListener('keydown', e => {
    if (e.code === 'Space') e.preventDefault();
    keys[e.code] = true;
    
    if (e.code === 'Digit1') { player.weapon = 'bare'; updateUI(); }
    if (e.code === 'Digit2') { player.weapon = 'sword'; updateUI(); }
    if (e.code === 'Digit3') { player.weapon = 'gun'; updateUI(); }

    if (e.code === 'KeyM' && !gameOver) {
        isFullMapOpen = !isFullMapOpen;
        document.getElementById('fullmap-modal').classList.toggle('hidden', !isFullMapOpen);
    }

    if (!gameOver && !isFullMapOpen && player.weapon === 'sword') {
        if (e.code === 'KeyC') player.useSkill('C');
        if (e.code === 'KeyV') player.useSkill('V');
        if (e.code === 'KeyE') player.useSkill('E');
        if (e.code === 'KeyR') player.useSkill('R');
    }

    if (gameOver && (e.code === 'KeyQ' || e.code === 'Space')) restartGame();
});
window.addEventListener('keyup', e => keys[e.code] = false);

class Player {
    constructor() {
        this.x = SAFE_ZONE_CENTER.x;
        this.y = SAFE_ZONE_CENTER.y;
        this.radius = 16;
        this.baseSpeed = 1.3;
        this.runSpeed = 2.5;
        this.speed = 1.3;
        
        // 3. 기본 체력 3배 (100 -> 300)
        this.maxHp = 300;
        this.hp = 300;
        
        this.maxStamina = 100;
        this.stamina = 100;
        this.staminaDrainRun = 0.4;
        this.staminaCostDash = 25;
        this.staminaRegen = 0.3;
        this.lastStaminaUseTime = 0;
        this.isExhausted = false;
        
        this.weapon = 'bare'; // 'bare', 'sword', 'gun'
        this.ammo = 15;
        this.maxAmmo = 30;

        this.level = 1;
        this.exp = 0;
        this.nextExp = 50;
        this.attackSpeed = 200;
        this.damage = 50; // 기본 칼 데미지
        this.angle = 0;
        
        // 5. 대시 쿨타임 0.5초 (500ms)
        this.dashCooldown = 500;
        this.lastDashTime = 0;

        // 6. 기절 및 7. 메커니즘 관련
        this.stunTimer = 0;
        this.isCasting = false;
        this.castType = null; // 'normal', 'skill'
        this.castEndTime = 0;
        this.isSuperArmor = false;
        this.pendingAttackAction = null;

        // 스킬 및 이펙트
        this.slashAnimTimer = 0;
        this.slashAnimAngle = 0;
        this.slashAnimType = 'normal';
    }

    update() {
        if (isFullMapOpen) return;
        const now = Date.now();

        // 6. 기절 처리
        if (now < this.stunTimer) return;

        // 7. 공격/스킬 캐스팅 판정 완료 처리
        if (this.isCasting && now >= this.castEndTime) {
            this.isCasting = false;
            this.isSuperArmor = false;
            if (this.pendingAttackAction) {
                this.pendingAttackAction();
                this.pendingAttackAction = null;
            }
        }

        const speedBonus = (this.weapon === 'bare') ? 0.3 : 0;
        const currentBaseSpeed = this.baseSpeed + speedBonus;
        const currentRunSpeed = this.runSpeed + speedBonus;

        const hasKeyMove = keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'];
        const hasKeyAim = keys['ArrowUp'] || keys['ArrowDown'] || keys['ArrowLeft'] || keys['ArrowRight'];
        
        let dx = 0, dy = 0;
        if (hasKeyMove) {
            if (keys['KeyW']) dy -= 1;
            if (keys['KeyS']) dy += 1;
            if (keys['KeyA']) dx -= 1;
            if (keys['KeyD']) dx += 1;
            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
        }

        const isMoving = (dx !== 0 || dy !== 0);
        const isShiftPressed = keys['ShiftLeft'] || keys['ShiftRight'];

        if (this.isExhausted && this.stamina >= this.maxStamina) this.isExhausted = false;

        if (isMoving && isShiftPressed && !this.isExhausted && this.stamina > 0) {
            this.speed = currentRunSpeed;
            this.stamina = Math.max(0, this.stamina - this.staminaDrainRun);
            this.lastStaminaUseTime = now;
            if (this.stamina === 0) this.isExhausted = true;
        } else {
            this.speed = currentBaseSpeed;
            if (now - this.lastStaminaUseTime > 500) {
                this.stamina = Math.min(this.maxStamina, this.stamina + this.staminaRegen);
            }
        }

        let targetX = this.x;
        let targetY = this.y;

        // 대시 처리 (쿨타임 0.5초)
        if (keys['KeyQ'] && now - this.lastDashTime > this.dashCooldown && isMoving && !this.isExhausted) {
            if (this.stamina >= this.staminaCostDash) {
                this.stamina -= this.staminaCostDash;
                this.lastStaminaUseTime = now;
                const dashDist = 110;
                let currentDashX = this.x;
                let currentDashY = this.y;

                for (let i = 1; i <= 15; i++) {
                    let nextDashX = this.x + (dx * dashDist * (i / 15));
                    let nextDashY = this.y + (dy * dashDist * (i / 15));
                    let pos = checkWallCollision(nextDashX, nextDashY, this.radius);
                    if (Math.abs(pos.x - nextDashX) > 0.1 || Math.abs(pos.y - nextDashY) > 0.1) break;
                    currentDashX = nextDashX;
                    currentDashY = nextDashY;
                }

                targetX = currentDashX;
                targetY = currentDashY;
                this.lastDashTime = now;
                for (let i = 0; i < 10; i++) particles.push(new Particle(this.x, this.y, '#3498db'));
                if (this.stamina === 0) this.isExhausted = true;
            }
        } else {
            targetX += dx * this.speed;
            targetY += dy * this.speed;
        }

        const posAfterWall = checkWallCollision(targetX, targetY, this.radius);
        this.x = Math.max(this.radius, Math.min(WORLD.width - this.radius, posAfterWall.x));
        this.y = Math.max(this.radius, Math.min(WORLD.height - this.radius, posAfterWall.y));

        ammoBoxes.forEach(box => {
            if (!box.taken) {
                if (Math.hypot(this.x - box.x, this.y - box.y) < this.radius + box.radius) {
                    box.taken = true;
                    const gained = Math.min(box.amount, this.maxAmmo - this.ammo);
                    this.ammo = Math.min(this.maxAmmo, this.ammo + box.amount);
                    createPopup(box.x, box.y, `+${gained} AMMO`, '#f39c12');
                    updateUI();
                }
            }
        });

        if (hasKeyAim) {
            let aimDx = 0, aimDy = 0;
            if (keys['ArrowUp']) aimDy -= 1;
            if (keys['ArrowDown']) aimDy += 1;
            if (keys['ArrowLeft']) aimDx -= 1;
            if (keys['ArrowRight']) aimDx += 1;

            if (aimDx !== 0 || aimDy !== 0) {
                const keyAngle = Math.atan2(aimDy, aimDx);
                let foundEnemy = null;
                let minDiff = Math.PI / 3;

                for (let enemy of enemies) {
                    if (Math.hypot(enemy.x - this.x, enemy.y - this.y) <= AUTO_TARGET_RANGE) {
                        let diff = Math.abs(keyAngle - Math.atan2(enemy.y - this.y, enemy.x - this.x));
                        if (diff > Math.PI) diff = Math.PI * 2 - diff;
                        if (diff < minDiff) { minDiff = diff; foundEnemy = enemy; }
                    }
                }
                if (foundEnemy) lockedTarget = foundEnemy;
                else { lockedTarget = null; this.angle = keyAngle; }
            }
        }

        if (lockedTarget) {
            if (lockedTarget.markedForDeletion || lockedTarget.hp <= 0) lockedTarget = null;
            else this.angle = Math.atan2(lockedTarget.y - this.y, lockedTarget.x - this.x);
        }

        if (keys['Space']) this.attack();
        updateUI();
    }

    attack() {
        const now = Date.now();
        if (now - lastAttackTime < this.attackSpeed || this.isCasting) return;

        if (this.weapon === 'bare') {
            // 1. 주먹: 칼 데미지의 1/10
            const fistDamage = this.damage * 0.1;
            this.executeMelee(fistDamage, 50, '#cccccc', 'bare');
            lastAttackTime = now;
        } else if (this.weapon === 'sword') {
            // 7. 칼: 0.1초 선딜레이 & 취소 가능
            this.isCasting = true;
            this.castType = 'normal';
            this.isSuperArmor = false;
            this.castEndTime = now + 100; // 0.1초
            this.pendingAttackAction = () => {
                this.executeMelee(this.damage, 70, '#e74c3c', 'sword');
            };
            lastAttackTime = now;
        } else if (this.weapon === 'gun') {
            if (this.ammo > 0) {
                this.ammo--;
                projectiles.push(new Projectile(this.x, this.y, this.angle, this.damage * 0.8));
                lastAttackTime = now;
                updateUI();
            } else {
                createPopup(this.x, this.y - 20, "NO AMMO!", "#e74c3c");
                lastAttackTime = now;
            }
        }
    }

    // 2. 스킬 구현 (C, V, E, R)
    useSkill(key) {
        const now = Date.now();
        if (this.isCasting) return;

        // 7. 스킬: 0.2초 선딜레이 & 슈퍼아머 (기절 안당함)
        this.isCasting = true;
        this.castType = 'skill';
        this.isSuperArmor = true;
        this.castEndTime = now + 200; // 0.2초

        this.pendingAttackAction = () => {
            if (key === 'C') { // C: 찌르기 (기절 0.5초)
                this.slashAnimTimer = Date.now();
                this.slashAnimAngle = this.angle;
                this.slashAnimType = 'C';
                this.executeAreaDamage(120, this.damage * 1.5, 0.5);
            } else if (key === 'V') { // V: 회전베기 (기절 0.8초)
                this.slashAnimTimer = Date.now();
                this.slashAnimAngle = this.angle;
                this.slashAnimType = 'V';
                this.executeAreaDamage(100, this.damage * 2.0, 0.8, true);
            } else if (key === 'E') { // E: 섬광베기 (대시 공격, 기절 1.0초)
                this.slashAnimTimer = Date.now();
                this.slashAnimAngle = this.angle;
                this.slashAnimType = 'E';
                this.x += Math.cos(this.angle) * 150;
                this.y += Math.sin(this.angle) * 150;
                const pos = checkWallCollision(this.x, this.y, this.radius);
                this.x = pos.x; this.y = pos.y;
                this.executeAreaDamage(110, this.damage * 2.5, 1.0);
            } else if (key === 'R') { // R: 궁극기 검기파동 (기절 2.0초)
                this.slashAnimTimer = Date.now();
                this.slashAnimAngle = this.angle;
                this.slashAnimType = 'R';
                for (let i = -2; i <= 2; i++) {
                    const swordWaveAngle = this.angle + (i * 0.15);
                    projectiles.push(new Projectile(this.x, this.y, swordWaveAngle, this.damage * 3, true, 2.0));
                }
            }
        };
    }

    executeMelee(dmg, range, color, type) {
        this.slashAnimTimer = Date.now();
        this.slashAnimAngle = this.angle;
        this.slashAnimType = type;

        enemies.forEach(e => {
            if (Math.hypot(e.x - this.x, e.y - this.y) - e.radius <= range) {
                e.takeDamage(dmg, 0.2); // 일반공격 기절 0.2초
                for (let i = 0; i < 6; i++) particles.push(new Particle(e.x, e.y, color));
            }
        });
    }

    executeAreaDamage(range, dmg, stunDuration, fullCircle = false) {
        enemies.forEach(e => {
            const dist = Math.hypot(e.x - this.x, e.y - this.y);
            if (dist <= range) {
                if (fullCircle) {
                    e.takeDamage(dmg, stunDuration);
                } else {
                    let diff = Math.abs(this.angle - Math.atan2(e.y - this.y, e.x - this.x));
                    if (diff > Math.PI) diff = Math.PI * 2 - diff;
                    if (diff <= Math.PI / 3) e.takeDamage(dmg, stunDuration);
                }
            }
        });
    }

    takeDamage(amount, stunTime) {
        // 7. 칼 공격 선딜레이 중 피격 시 취소 및 기절
        if (this.isCasting && this.castType === 'normal') {
            this.isCasting = false;
            this.pendingAttackAction = null;
            applyStun(this, stunTime, false);
            createPopup(this.x, this.y - 30, "ATTACK CANCELED!", "#e74c3c");
        } else {
            applyStun(this, stunTime, this.isSuperArmor);
        }

        this.hp -= amount;
        createPopup(this.x, this.y - 15, `-${Math.floor(amount)}`, '#e74c3c');
        if (this.hp <= 0) endGame();
        updateUI();
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y);

        // HP 바
        const barWidth = 36, barHeight = 5;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(-barWidth / 2, -this.radius - 12, barWidth, barHeight);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(-barWidth / 2, -this.radius - 12, Math.max(0, (this.hp / this.maxHp) * barWidth), barHeight);

        // 6. 기절 이펙트
        if (Date.now() < this.stunTimer) {
            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 12px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText("★STUN★", 0, -this.radius - 20);
        }

        ctx.rotate(this.angle);
        if (this.weapon === 'gun') {
            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(10, -3, 16, 6);
        } else if (this.weapon === 'sword') {
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(8, -2, 20, 4);
        }

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#3498db';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2980b9';
        ctx.stroke();
        ctx.restore();

        // 2. 스킬 이펙트 연출
        const now = Date.now();
        if (now - this.slashAnimTimer < 200) {
            ctx.save();
            ctx.translate(this.x - camera.x, this.y - camera.y);
            ctx.rotate(this.slashAnimAngle);
            ctx.beginPath();

            if (this.slashAnimType === 'C') {
                ctx.fillStyle = 'rgba(231, 76, 60, 0.6)';
                ctx.fillRect(0, -10, 120, 20);
            } else if (this.slashAnimType === 'V') {
                ctx.arc(0, 0, 100, 0, Math.PI * 2);
                ctx.strokeStyle = '#9b59b6';
                ctx.lineWidth = 6; ctx.stroke();
            } else if (this.slashAnimType === 'E') {
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 8;
                ctx.arc(0, 0, 110, -Math.PI / 3, Math.PI / 3);
                ctx.stroke();
            } else if (this.slashAnimType === 'R') {
                ctx.strokeStyle = '#e67e22';
                ctx.lineWidth = 12;
                ctx.arc(0, 0, 140, -Math.PI / 2, Math.PI / 2);
                ctx.stroke();
            } else {
                ctx.arc(0, 0, 60, -Math.PI / 4, Math.PI / 4);
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 4; ctx.stroke();
            }
            ctx.restore();
        }
    }

    addExp(amount) {
        this.exp += amount;
        if (this.exp >= this.nextExp) {
            this.exp -= this.nextExp;
            this.level++;
            this.nextExp = Math.floor(this.nextExp * 1.5);
            this.maxHp += 45;
            this.hp = this.maxHp;
            this.damage += 10;
            createPopup(this.x, this.y - 20, "LEVEL UP!", "#f1c40f");
        }
        updateUI();
    }
}

class Enemy {
    constructor(x, y, type, isSpecial = false, specialTraits = {}) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.isSpecial = isSpecial;
        this.traits = specialTraits; // { hpBoost, hasSkill, useRanged }

        this.stunTimer = 0;
        this.lastSkillTime = Date.now();
        this.nextSkillInterval = Math.random() * 3000 + 3000;

        // 4. 빨간몹(0), 주황색몹(1), 보라색몹(2) 외형/체력 스펙 설정
        if (type === 0) { // 기존 빨간색 -> 사각형
            this.radius = 14; this.speed = 2.4; this.hp = 400; // 기존 40 * 10
            this.color = '#e74c3c'; this.expValue = 15; this.scoreValue = 100;
        } else if (type === 1) { // 기존 주황색 -> 삼각형
            this.radius = 10; this.speed = 3.6; this.hp = 200; // 기존 20 * 10
            this.color = '#e67e22'; this.expValue = 20; this.scoreValue = 150;
        } else { // 기존 보라색 -> 오각형
            this.radius = 28; this.speed = 1.3; this.hp = 2200; // 기존 220 * 10
            this.color = '#9b59b6'; this.expValue = 80; this.scoreValue = 500;
            this.lastShootTime = 0; this.shootInterval = 1800;
        }

        // 4. 특수 몹 스폰 시 체력 5배 증가 옵션
        if (this.isSpecial && this.traits.hpBoost) {
            this.hp *= 5;
        }

        this.maxHp = this.hp;
        this.markedForDeletion = false;
    }

    takeDamage(amount, stunTime) {
        applyStun(this, stunTime);
        this.hp -= amount;
        createPopup(this.x, this.y - 10, Math.floor(amount));
        if (this.hp <= 0) {
            this.markedForDeletion = true;
            score += this.scoreValue;
            player.addExp(this.expValue);
            for (let i = 0; i < 12; i++) particles.push(new Particle(this.x, this.y, this.color));
        }
    }

    update() {
        if (Date.now() < this.stunTimer) return;

        const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
        const now = Date.now();

        // 4. 활과 칼을 같이 쓰는 특수몹 AI
        if (this.isSpecial && this.traits.useRanged && this.traits.hasSkill) {
            if (distToPlayer > 180) {
                // 멀리있을 땐 다가가면서 활을 쏨
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
                if (now - this.lastSkillTime > 1500) {
                    enemyProjectiles.push(new EnemyProjectile(this.x, this.y, angle, 15));
                    this.lastSkillTime = now;
                }
            } else {
                // 일정 거리 이하 다가오면 칼 사용
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * (this.speed * 1.2);
                this.y += Math.sin(angle) * (this.speed * 1.2);
                if (distToPlayer <= player.radius + this.radius + 15) {
                    player.takeDamage(15, 0.2);
                }
            }
            this.keepOutOfSafeZone();
            return;
        }

        // 일반 특수몹 스킬 발동 (랜덤 시간)
        if (this.isSpecial && this.traits.hasSkill && now - this.lastSkillTime > this.nextSkillInterval) {
            this.lastSkillTime = now;
            this.nextSkillInterval = Math.random() * 4000 + 2000;
            // 특수 스킬 베기
            if (distToPlayer <= 150) {
                player.takeDamage(35, 0.5);
                createPopup(this.x, this.y - 20, "SPECIAL SKILL!", "#9b59b6");
            }
        }

        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        let targetX = this.x, targetY = this.y;

        if (distToPlayer <= DETECT_RANGE) {
            targetX += Math.cos(angle) * this.speed;
            targetY += Math.sin(angle) * this.speed;
        }

        if (distToPlayer < player.radius + this.radius) {
            player.takeDamage(10, 0.2);
        }

        const pos = checkWallCollision(targetX, targetY, this.radius);
        this.x = pos.x; this.y = pos.y;
        this.keepOutOfSafeZone();
    }

    keepOutOfSafeZone() {
        const distFromCenter = Math.hypot(this.x - SAFE_ZONE_CENTER.x, this.y - SAFE_ZONE_CENTER.y);
        const minAllowedDist = SAFE_ZONE_RADIUS + this.radius;
        if (distFromCenter < minAllowedDist) {
            const angleFromCenter = Math.atan2(this.y - SAFE_ZONE_CENTER.y, this.x - SAFE_ZONE_CENTER.x);
            this.x = SAFE_ZONE_CENTER.x + Math.cos(angleFromCenter) * minAllowedDist;
            this.y = SAFE_ZONE_CENTER.y + Math.sin(angleFromCenter) * minAllowedDist;
        }
    }

    draw() {
        if (this.x < camera.x - 100 || this.x > camera.x + camera.width + 100 ||
            this.y < camera.y - 100 || this.y > camera.y + camera.height + 100) return;

        ctx.save();
        ctx.translate(this.x - camera.x, this.y - camera.y);

        if (this.isSpecial) {
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2); ctx.stroke();
        }

        // 6. 기절 표시
        if (Date.now() < this.stunTimer) {
            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 10px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText("★STUN★", 0, -this.radius - 14);
        }

        ctx.fillStyle = this.color;
        ctx.beginPath();
        if (this.type === 0) ctx.rect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
        else if (this.type === 1) {
            ctx.moveTo(0, -this.radius * 1.3);
            ctx.lineTo(this.radius, this.radius); ctx.lineTo(-this.radius, this.radius);
            ctx.closePath();
        } else {
            for (let i = 0; i < 5; i++) {
                const a = (Math.PI * 2 / 5) * i;
                const px = Math.cos(a) * this.radius, py = Math.sin(a) * this.radius;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
        }
        ctx.fill();

        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-this.radius, -this.radius - 8, this.radius * 2, 4);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(-this.radius, -this.radius - 8, (this.radius * 2) * (this.hp / this.maxHp), 4);
        }
        ctx.restore();
    }
}

class Projectile {
    constructor(x, y, angle, damage, isPenetrating = false, stunDuration = 0.2) {
        this.x = x; this.y = y;
        this.speed = 13;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.radius = 5;
        this.damage = damage;
        this.isPenetrating = isPenetrating;
        this.stunDuration = stunDuration;
        this.markedForDeletion = false;
    }

    update() {
        this.x += this.vx; this.y += this.vy;
        if (checkLineWallCollision(this.x - this.vx, this.y - this.vy, this.x, this.y)) {
            this.markedForDeletion = true; return;
        }
        if (this.x < camera.x || this.x > camera.x + camera.width ||
            this.y < camera.y || this.y > camera.y + camera.height) {
            this.markedForDeletion = true;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.isPenetrating ? '#e67e22' : '#f39c12';
        ctx.fill();
    }
}

class EnemyProjectile {
    constructor(x, y, angle, damage) {
        this.x = x; this.y = y;
        this.speed = 6;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.radius = 6; this.damage = damage;
        this.markedForDeletion = false;
    }

    update() {
        this.x += this.vx; this.y += this.vy;
        if (checkLineWallCollision(this.x - this.vx, this.y - this.vy, this.x, this.y)) {
            this.markedForDeletion = true; return;
        }
        if (Math.hypot(player.x - this.x, player.y - this.y) < player.radius + this.radius) {
            player.takeDamage(this.damage, 0.2);
            this.markedForDeletion = true;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#9b59b6';
        ctx.fill();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
    }
    update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.03; }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath(); ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color; ctx.fill();
        ctx.restore();
    }
}

class Popup {
    constructor(x, y, text, color) {
        this.x = x; this.y = y; this.text = text; this.color = color;
        this.alpha = 1; this.vy = -1;
    }
    update() { this.y += this.vy; this.alpha -= 0.02; }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = 'bold 14px Segoe UI'; ctx.fillStyle = this.color;
        ctx.fillText(this.text, this.x - camera.x, this.y - camera.y);
        ctx.restore();
    }
}

function createPopup(x, y, text, color = '#fff') { popups.push(new Popup(x, y, text, color)); }

// 4. 특수몹 10% 확률 스폰 로직
function spawnEnemies() {
    if (enemies.length >= 35) return;

    if (Math.random() < 0.04) {
        const dist = Math.random() * 500 + 300;
        const angle = Math.random() * Math.PI * 2;
        let cx = Math.max(200, Math.min(WORLD.width - 200, player.x + Math.cos(angle) * dist));
        let cy = Math.max(200, Math.min(WORLD.height - 200, player.y + Math.sin(angle) * dist));

        if (Math.hypot(cx - SAFE_ZONE_CENTER.x, cy - SAFE_ZONE_CENTER.y) <= SAFE_ZONE_RADIUS + 50) return;

        const isSpecial = Math.random() < 0.10; // 10% 확률 특수몹
        const traits = {
            hpBoost: Math.random() < 0.50,  // 50% 확률 체력 5배
            hasSkill: Math.random() < 0.50, // 50% 확률 스킬
            useRanged: Math.random() < 0.50 // 50% 확률 원거리 사용
        };

        const type = Math.floor(Math.random() * 3);
        enemies.push(new Enemy(cx, cy, type, isSpecial, traits));
    }
}

function updateUI() {
    document.getElementById('hp-fill').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    const staminaFill = document.getElementById('stamina-fill');
    staminaFill.style.width = `${Math.max(0, (player.stamina / player.maxStamina) * 100)}%`;
    staminaFill.classList.toggle('exhausted', player.isExhausted);

    const ammoStat = document.getElementById('ammo-stat');
    if (player.weapon === 'bare') ammoStat.innerText = `무기: 맨손 (속도 +0.3 / 주먹 공격)`;
    else if (player.weapon === 'sword') ammoStat.innerText = `무기: 칼 (C/V/E/R 스킬 사용 가능)`;
    else ammoStat.innerText = `무기: 총 (총알: ${player.ammo}/${player.maxAmmo})`;

    document.getElementById('level-txt').innerText = `LV. ${player.level}`;
    document.getElementById('exp-fill').style.width = `${(player.exp / player.nextExp) * 100}%`;
    document.getElementById('score-txt').innerText = `Score: ${score}`;
}

function drawSafeZone() {
    const sx = SAFE_ZONE_CENTER.x - camera.x;
    const sy = SAFE_ZONE_CENTER.y - camera.y;
    ctx.save();
    ctx.beginPath(); ctx.arc(sx, sy, SAFE_ZONE_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(46, 204, 113, 0.15)'; ctx.fill();
    ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
}

function drawMinimap() {
    minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
    const rangeX = canvas.width * 3, rangeY = canvas.height * 3;
    const startX = player.x - rangeX / 2, startY = player.y - rangeY / 2;
    const scaleX = minimapCanvas.width / rangeX, scaleY = minimapCanvas.height / rangeY;

    enemies.forEach(e => {
        minimapCtx.fillStyle = e.color;
        minimapCtx.fillRect((e.x - startX) * scaleX - 1, (e.y - startY) * scaleY - 1, 3, 3);
    });

    minimapCtx.fillStyle = '#00ffcc';
    minimapCtx.beginPath();
    minimapCtx.arc((player.x - startX) * scaleX, (player.y - startY) * scaleY, 2.5, 0, Math.PI * 2);
    minimapCtx.fill();
}

function drawFullMap() {
    if (!isFullMapOpen) return;
    fullmapCtx.clearRect(0, 0, fullmapCanvas.width, fullmapCanvas.height);
    const scaleX = fullmapCanvas.width / WORLD.width, scaleY = fullmapCanvas.height / WORLD.height;

    enemies.forEach(e => {
        fullmapCtx.fillStyle = e.color;
        fullmapCtx.fillRect(e.x * scaleX, e.y * scaleY, 2, 2);
    });

    fullmapCtx.fillStyle = '#00ffcc';
    fullmapCtx.beginPath();
    fullmapCtx.arc(player.x * scaleX, player.y * scaleY, 4, 0, Math.PI * 2);
    fullmapCtx.fill();
}

function init() {
    player = new Player();
    projectiles = []; enemyProjectiles = []; enemies = [];
    particles = []; popups = []; lockedTarget = null;
    score = 0; gameOver = false; isFullMapOpen = false;
    
    initAmmoInHouses();
    document.getElementById('fullmap-modal').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    for (let i = 0; i < 6; i++) spawnEnemies();
    updateUI();
}

function endGame() {
    gameOver = true;
    document.getElementById('final-score').innerText = `최종 점수: ${score}`;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

function restartGame() { init(); }

function loop() {
    if (!gameOver && !isFullMapOpen) {
        spawnEnemies();
        player.update();
        camera.update(player.x, player.y);

        projectiles.forEach(p => p.update());
        enemyProjectiles.forEach(ep => ep.update());
        enemies.forEach(e => e.update());
        particles.forEach(p => p.update());
        popups.forEach(p => p.update());

        projectiles.forEach(p => {
            enemies.forEach(e => {
                if (Math.hypot(p.x - e.x, p.y - e.y) < p.radius + e.radius) {
                    if (!p.isPenetrating) p.markedForDeletion = true;
                    e.takeDamage(p.damage, p.stunDuration);
                }
            });
        });

        projectiles = projectiles.filter(p => !p.markedForDeletion);
        enemyProjectiles = enemyProjectiles.filter(ep => !ep.markedForDeletion);
        enemies = enemies.filter(e => !e.markedForDeletion);
        particles = particles.filter(p => p.alpha > 0);
        popups = popups.filter(p => p.alpha > 0);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawSafeZone();

    particles.forEach(p => p.draw());
    projectiles.forEach(p => p.draw());
    enemyProjectiles.forEach(ep => ep.draw());
    enemies.forEach(e => e.draw());
    if (!gameOver) player.draw();

    popups.forEach(p => p.draw());
    drawMinimap();
    drawFullMap();

    requestAnimationFrame(loop);
}

init();
loop();
</script>
