<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2D 샌드박스 멀티 슈팅</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: white; font-family: sans-serif; overflow: hidden;
        }
        #ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); padding: 25px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 12px; align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); width: 380px; z-index: 50;
        }
        #waitingRoom {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95); padding: 30px; border-radius: 12px;
            display: none; flex-direction: column; gap: 15px; align-items: center;
            box-shadow: 0 0 25px rgba(0,255,200,0.3); width: 420px; z-index: 50; text-align: center;
        }
        input[type="text"], select, input[type="number"] {
            padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid #444;
            text-align: center; width: 100%; background: #222; color: white;
        }
        .form-group { width: 100%; text-align: left; font-size: 14px; color: #ccc; }
        .form-group label { display: block; margin-bottom: 5px; }
        button {
            padding: 12px; font-size: 15px; background-color: #00ffcc; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; color: #000; width: 100%;
        }
        button:hover { background-color: #00cc88; }
        #statusHUD {
            position: absolute; top: 20px; left: 20px; font-size: 14px; font-weight: bold;
            text-shadow: 2px 2px 4px #000; z-index: 20; display: none; background: rgba(0,0,0,0.6);
            padding: 12px; border-radius: 8px; pointer-events: none;
        }
        #inventory {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; height: 380px; background: rgba(20, 20, 20, 0.95);
            border: 2px solid #00ffcc; border-radius: 10px; z-index: 60; display: none;
            padding: 20px; flex-direction: column; gap: 12px;
        }
        .inv-section { border: 1px solid #444; padding: 10px; border-radius: 6px; background: #1a1a1a; }
        .inv-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        .inv-item {
            padding: 8px 12px; background: #333; border: 1px solid #666; border-radius: 4px;
            cursor: pointer; font-size: 13px;
        }
        .inv-item:hover { background: #00ffcc; color: #000; }
        #minimapCanvas {
            position: absolute; bottom: 20px; right: 20px; width: 200px; height: 200px;
            background: rgba(15, 15, 15, 0.9); border: 2px solid #00ffcc; border-radius: 50%;
            z-index: 20; display: none; box-shadow: 0 0 15px rgba(0,255,200,0.2); pointer-events: none;
        }
        #fullMapOverlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vh; height: 80vh; background: rgba(10, 10, 10, 0.92);
            border: 3px solid #00ffcc; border-radius: 12px; z-index: 70; display: none;
            box-shadow: 0 0 30px rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center;
        }
        #victoryOverlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85); border: 4px solid #ffcc00; padding: 40px;
            border-radius: 20px; text-align: center; display: none; z-index: 100;
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.5);
        }
        #damageOverlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 15; opacity: 0;
            box-shadow: inset 0 0 100px 50px rgba(255, 0, 0, 0.8); transition: opacity 0.1s ease-out;
        }
        canvas#gameCanvas { position: absolute; top:0; left:0; width: 100vw; height: 100vh; display: none; background-color: #000; z-index: 1; }

        /* 모바일 터치 패드 UI */
        #mobileControls {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 30; pointer-events: none; display: none;
        }
        .touch-zone { position: absolute; pointer-events: auto; }
        #joystickContainer {
            bottom: 40px; left: 40px; width: 140px; height: 140px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
        }
        #joystickKnob {
            position: absolute; top: 45px; left: 45px; width: 50px; height: 50px;
            background: rgba(0, 255, 204, 0.6); border-radius: 50%;
        }
        #aimPadContainer {
            bottom: 40px; right: 180px; width: 140px; height: 140px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
        }
        #aimPadKnob {
            position: absolute; top: 45px; left: 45px; width: 50px; height: 50px;
            background: rgba(255, 68, 68, 0.6); border-radius: 50%;
        }
        .mobile-btn {
            position: absolute; width: 65px; height: 65px; border-radius: 50%;
            background: rgba(0,0,0,0.6); border: 2px solid #00ffcc; color: white;
            font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center;
        }
        #btnFire { bottom: 110px; right: 40px; background: rgba(255, 50, 50, 0.7); border-color: #ff5555; }
        #btnReload { bottom: 35px; right: 110px; }
        #btnPickup { bottom: 185px; right: 40px; }
        #btnBag { bottom: 185px; right: 110px; }
        #btnMap { top: 20px; right: 20px; width: 55px; height: 55px; border-color: #ffcc00; color: #ffcc00; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="damageOverlay"></div>

<div id="ui">
    <h2>2D 슈팅 게임 메인 메뉴</h2>
    <input type="text" id="nicknameInput" placeholder="닉네임 입력" maxlength="10">

    <div class="form-group">
        <label for="platformSelect">플레이 조작 기기:</label>
        <select id="platformSelect">
            <option value="pc">PC (키보드 & 마우스)</option>
            <option value="mobile">Mobile (터치 패드)</option>
        </select>
    </div>

    <button onclick="createRoom()">방 생성 (방장)</button>
    <div id="roomCodeDisplay" style="color:#00ffcc; font-weight:bold;"></div>

    <hr style="width:100%; border-color:#444; margin: 2px 0;">
    
    <input type="text" id="joinIdInput" placeholder="방 코드 입력" maxlength="5">
    <button onclick="joinRoom()" style="background-color: #ffcc00;">방 참가하기</button>
</div>

<div id="waitingRoom">
    <h2>대기실 설정</h2>
    <p>방 코드: <span id="displayRoomCode" style="color:#00ffcc; font-size:20px; font-weight:bold;">-</span></p>
    
    <div class="form-group">
        <label for="gameModeSelect">게임 모드 선택:</label>
        <select id="gameModeSelect">
            <option value="deathmatch">데스매치 (맵 크기: 2,400 / 자기장 없음)</option>
            <option value="battleroyale">배틀로얄 (맵 크기: 24,000 / 자기장 포함)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="aiToggle">AI 봇 포함 여부:</label>
        <select id="aiToggle" onchange="toggleAiInput()">
            <option value="true">AI 봇 포함</option>
            <option value="false" selected>AI 봇 없음 (유저 전용)</option>
        </select>
    </div>

    <div class="form-group" id="aiDifficultyGroup" style="display:none;">
        <label for="aiDifficultySelect">AI 난이도 설정:</label>
        <select id="aiDifficultySelect">
            <option value="easy">쉬움</option>
            <option value="medium" selected>보통</option>
            <option value="hard">어려움</option>
        </select>
    </div>

    <div class="form-group" id="aiCountGroup" style="display:none;">
        <label for="aiCountInput">AI 봇 수 (최대 10):</label>
        <input type="number" id="aiCountInput" value="4" min="0" max="10">
    </div>

    <button id="startButton" onclick="hostStartGame()" style="background-color: #00ffcc; margin-top: 10px;">게임 시작</button>
</div>

<div id="victoryOverlay">
    <h1 id="victoryText" style="font-size: 48px; color: #ffcc00; margin: 0;">🏆 승리하셨습니다! 🏆</h1>
    <p style="font-size: 20px; color: #fff; margin-top: 15px;">5초 후 메인 메뉴로 이동합니다...</p>
</div>

<div id="statusHUD">
    [모드]: <span id="hudGameMode" style="color:#00ffcc;">데스매치</span> | 
    [생존 인원]: <span id="hudAliveCount" style="color:#ff4444; font-size: 16px;">1</span> 명 <br>
    [무기]: <span id="hudWeapon" style="color:#00ffcc;">맨손</span> | [탄약]: <span id="hudAmmo" style="color:#ffcc00;">- / -</span> <br>
    [장착 스코프]: <span id="hudScope" style="color:#ffcc00;">없음</span> <br>
    <div id="zoneHUD" style="display:none; margin-top:3px; color:#3388ff;">
        자기장 축소까지: <span id="zoneTimer">30</span>초 (단계: <span id="zonePhase">0</span>/5)
    </div>
    <span id="hudControlsHint">[조작법]: Shift(달리기) / Ctrl(은신) / E(줍기) / R(장전) / Tab(가방)</span>
</div>

<div id="mobileControls">
    <div id="joystickContainer" class="touch-zone">
        <div id="joystickKnob"></div>
    </div>
    <div id="aimPadContainer" class="touch-zone">
        <div id="aimPadKnob"></div>
    </div>
    <div id="btnFire" class="mobile-btn touch-zone">사격</div>
    <div id="btnReload" class="mobile-btn touch-zone">장전</div>
    <div id="btnPickup" class="mobile-btn touch-zone">줍기</div>
    <div id="btnBag" class="mobile-btn touch-zone">가방</div>
    <div id="btnMap" class="mobile-btn touch-zone">지도</div>
</div>

<div id="inventory">
    <h3 style="margin:0; text-align:center; color:#00ffcc;">가방 (인벤토리)</h3>
    <div class="inv-section">
        <strong>현재 무기:</strong>
        <div id="equippedWeaponArea" style="margin-top:5px; color:#aaa;">맨손</div>
    </div>
    <div class="inv-section">
        <strong>현재 장착 스코프:</strong>
        <div id="equippedScopeArea" style="margin-top:5px; color:#aaa;">없음</div>
    </div>
    <div class="inv-section">
        <strong>보유 중인 스코프:</strong>
        <div id="scopeList" class="inv-grid"></div>
    </div>
    <button onclick="toggleInventory()" style="margin-top:auto;">닫기 (Tab)</button>
</div>

<div id="fullMapOverlay" onclick="toggleFullMap()">
    <h3 style="margin: 10px 0 5px 0; color:#00ffcc;">전체 맵 (터치하여 닫기)</h3>
    <canvas id="fullMapCanvas" width="500" height="500"></canvas>
</div>

<canvas id="gameCanvas"></canvas>
<canvas id="minimapCanvas" width="200" height="200"></canvas>

<script>
// 기본 맵 크기 (동적 조절)
let WORLD_SIZE = 2400; 
let currentGameMode = 'deathmatch';

const SCOPES = {
    '1x': { name: "1배율 (레드닷)", viewOffset: 300 },
    '2x': { name: "2배율", viewOffset: 550 },
    '3x': { name: "3배율", viewOffset: 850 },
    '4x': { name: "4배율", viewOffset: 1200 },
    '8x': { name: "8배율", viewOffset: 1800 }
};

const WEAPONS = {
    ar: { name: "돌격소총", cooldown: 110, bulletSpeed: 90, damage: 12.5, pellets: 1, spread: 0.03, maxClip: 30 },
    sniper: { name: "스나이퍼", cooldown: 900, bulletSpeed: 160, damage: 65, pellets: 1, spread: 0.005, maxClip: 5 },
    shotgun: { name: "샷건", cooldown: 800, bulletSpeed: 75, damage: 10, pellets: 8, spread: 0.18, maxClip: 8 }
};

const AI_DIFFICULTY = {
    easy: { delay: 900, spread: 0.15, speedMult: 0.8 },
    medium: { delay: 400, spread: 0.08, speedMult: 1.0 },
    hard: { delay: 100, spread: 0.02, speedMult: 1.2 }
};

// 자기장 (배틀로얄 전용)
const safeZone = {
    x: 0, y: 0, radius: 0,
    targetX: 0, targetY: 0, targetRadius: 0,
    phase: 0, maxPhase: 5, timer: 30
};

let peer = null, conn = null;
let isHost = false;
let isMobile = false;
let aiDifficulty = 'medium';

let gameStarted = false;
let gameEnded = false;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimapCanvas');
const mCtx = minimapCanvas.getContext('2d');
const fullMapCanvas = document.getElementById('fullMapCanvas');
const fCtx = fullMapCanvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const myPlayer = {
    id: Math.random().toString(36).substring(2, 9),
    x: 1000, y: 1000,
    angle: 0, speed: 3.0, hp: 100, maxHp: 100,
    name: '플레이어', weapon: null,
    clipAmmo: 0, reserveAmmo: 0, isReloading: false,
    equippedScope: null,
    inventory: { scopes: [] },
    isAiming: false, isShooting: false, lastShootTime: 0,
    isMoving: false, movementMode: 'walk'
};

let remotePlayers = {};
const camera = { x: myPlayer.x, y: myPlayer.y };
const keys = {};
const mouse = { x: 0, y: 0 };
let mobileMoveVec = { x: 0, y: 0 };
let mobileAimVec = { x: 0, y: 0 };

const bullets = [];
const droppedItems = [];
const aiBots = [];
const obstacles = [];
const bloodParticles = [];

function generateMapObjects() {
    obstacles.length = 0;
    droppedItems.length = 0;

    const obstacleCount = (currentGameMode === 'battleroyale') ? 500 : 50;
    const itemCount = (currentGameMode === 'battleroyale') ? 800 : 80;

    for(let i = 0; i < obstacleCount; i++) {
        obstacles.push({
            x: Math.random() * (WORLD_SIZE - 400) + 200,
            y: Math.random() * (WORLD_SIZE - 400) + 200,
            w: Math.random() * 100 + 50,
            h: Math.random() * 100 + 50
        });
    }

    const types = ['ar', 'sniper', 'shotgun', '1x', '2x', '3x', '4x', '8x', 'ammo_ar', 'ammo_sniper', 'ammo_shotgun'];
    for(let i = 0; i < itemCount; i++) {
        droppedItems.push({
            x: Math.random() * (WORLD_SIZE - 200) + 100,
            y: Math.random() * (WORLD_SIZE - 200) + 100,
            type: types[Math.floor(Math.random() * types.length)]
        });
    }

    myPlayer.x = Math.random() * (WORLD_SIZE - 400) + 200;
    myPlayer.y = Math.random() * (WORLD_SIZE - 400) + 200;

    if (currentGameMode === 'battleroyale') {
        safeZone.x = WORLD_SIZE / 2;
        safeZone.y = WORLD_SIZE / 2;
        safeZone.radius = WORLD_SIZE * 0.7;
        safeZone.targetX = safeZone.x;
        safeZone.targetY = safeZone.y;
        safeZone.targetRadius = safeZone.radius;
    }
}

function generateShortId() { return Math.random().toString(36).substring(2, 7).toLowerCase(); }

function toggleAiInput() {
    const enabled = document.getElementById('aiToggle').value === 'true';
    document.getElementById('aiCountGroup').style.display = enabled ? 'block' : 'none';
    document.getElementById('aiDifficultyGroup').style.display = enabled ? 'block' : 'none';
}

function createRoom() {
    const nick = document.getElementById('nicknameInput').value.trim();
    if(nick) myPlayer.name = nick;
    isMobile = document.getElementById('platformSelect').value === 'mobile';
    isHost = true;

    const code = generateShortId();
    document.getElementById('displayRoomCode').innerText = code;
    
    document.getElementById('ui').style.display = 'none';
    document.getElementById('waitingRoom').style.display = 'flex';

    peer = new Peer('gungame-room-' + code);
    peer.on('connection', c => { 
        conn = c; 
        setupConnection();
    });
}

function joinRoom() {
    const input = document.getElementById('joinIdInput').value.trim().toLowerCase();
    const nick = document.getElementById('nicknameInput').value.trim();
    if(nick) myPlayer.name = nick;
    isMobile = document.getElementById('platformSelect').value === 'mobile';

    if(!input) { alert("방 코드를 입력해주세요."); return; }

    isHost = false;
    peer = new Peer();
    peer.on('open', () => {
        conn = peer.connect('gungame-room-' + input);
        setupConnection();
    });
}

function setupConnection() {
    conn.on('open', () => {
        if(!isHost) {
            document.getElementById('ui').style.display = 'none';
            document.getElementById('waitingRoom').style.display = 'flex';
            document.getElementById('startButton').style.display = 'none'; 
            document.getElementById('gameModeSelect').disabled = true;
            document.getElementById('waitingRoom').innerHTML += "<p style='color:#00ffcc;'>방장이 게임을 시작하기를 기다리는 중...</p>";
        }
    });

    conn.on('data', data => {
        if (data.type === 'START') {
            currentGameMode = data.mode;
            WORLD_SIZE = (currentGameMode === 'battleroyale') ? 24000 : 2400;
            aiDifficulty = data.aiDiff;
            startGame();
        } else if (data.type === 'UPDATE') {
            remotePlayers[data.player.id] = data.player;
        } else if (data.type === 'SHOOT') {
            bullets.push(data.bullet);
        }
    });

    conn.on('error', () => alert('통신 및 방 접속 오류가 발생하였습니다!'));
}

function hostStartGame() {
    currentGameMode = document.getElementById('gameModeSelect').value;
    WORLD_SIZE = (currentGameMode === 'battleroyale') ? 24000 : 2400;

    const includeAi = document.getElementById('aiToggle').value === 'true';
    const aiCount = parseInt(document.getElementById('aiCountInput').value) || 0;
    aiDifficulty = document.getElementById('aiDifficultySelect').value;

    if (includeAi) spawnAIBots(aiCount);

    if (conn) {
        conn.send({ type: 'START', mode: currentGameMode, aiDiff: aiDifficulty });
    }
    startGame();
}

function spawnAIBots(count) {
    for (let i = 0; i < count; i++) {
        aiBots.push({
            id: 'bot_' + i,
            x: Math.random() * (WORLD_SIZE - 400) + 200,
            y: Math.random() * (WORLD_SIZE - 400) + 200,
            angle: 0, hp: 100, maxHp: 100,
            name: `AI 봇_${i+1}`,
            weapon: null, clipAmmo: 0, reserveAmmo: 100,
            equippedScope: null, lastShootTime: 0
        });
    }
}

function startGame() {
    generateMapObjects();

    document.getElementById('ui').style.display = 'none';
    document.getElementById('waitingRoom').style.display = 'none';
    document.getElementById('statusHUD').style.display = 'block';

    if (currentGameMode === 'battleroyale') {
        document.getElementById('hudGameMode').innerText = '배틀로얄 (24,000)';
        document.getElementById('zoneHUD').style.display = 'block';
        startZoneTimer();
    } else {
        document.getElementById('hudGameMode').innerText = '데스매치 (2,400)';
        document.getElementById('zoneHUD').style.display = 'none';
    }

    if (isMobile) {
        document.getElementById('mobileControls').style.display = 'block';
        document.getElementById('hudControlsHint').style.display = 'none';
        initMobileControls();
    }

    canvas.style.display = 'block';
    minimapCanvas.style.display = 'block';
    gameStarted = true;

    updateHUD();
    resizeCanvas();
    initEvents();
    gameLoop();

    setInterval(() => {
        if (conn && gameStarted && !gameEnded) {
            conn.send({
                type: 'UPDATE',
                player: {
                    id: myPlayer.id,
                    x: myPlayer.x,
                    y: myPlayer.y,
                    angle: myPlayer.angle,
                    hp: myPlayer.hp,
                    name: myPlayer.name,
                    weapon: myPlayer.weapon
                }
            });
        }
    }, 20);
}

function startZoneTimer() {
    setInterval(() => {
        if (!gameStarted || gameEnded || currentGameMode !== 'battleroyale') return;

        safeZone.timer--;
        document.getElementById('zoneTimer').innerText = safeZone.timer;

        if (safeZone.timer <= 0) {
            safeZone.phase++;
            safeZone.timer = 30;
            safeZone.radius *= 0.6;
            document.getElementById('zonePhase').innerText = safeZone.phase;
        }

        // 자기장 데미지
        const distFromCenter = Math.hypot(myPlayer.x - safeZone.x, myPlayer.y - safeZone.y);
        if (distFromCenter > safeZone.radius && myPlayer.hp > 0) {
            myPlayer.hp -= 2;
            triggerDamageEffect();
            updateHUD();
        }
    }, 1000);
}

function initEvents() {
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if(e.key === 'Shift') keys['shift'] = true;
        if(e.key === 'Control') keys['control'] = true;
        if(e.key === 'Tab') { e.preventDefault(); toggleInventory(); }
        if(e.key.toLowerCase() === 'm') toggleFullMap();
        if(e.key.toLowerCase() === 'e') pickupItem();
        if(e.key.toLowerCase() === 'r') reloadWeapon(myPlayer);
    });
    window.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
        if(e.key === 'Shift') keys['shift'] = false;
        if(e.key === 'Control') keys['control'] = false;
    });
    canvas.addEventListener('mousemove', e => { 
        mouse.x = e.clientX; 
        mouse.y = e.clientY; 
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('mousedown', e => {
        if (e.button === 2) myPlayer.isAiming = true;
        if (e.button === 0) myPlayer.isShooting = true;
    });
    canvas.addEventListener('mouseup', e => {
        if (e.button === 2) myPlayer.isAiming = false;
        if (e.button === 0) myPlayer.isShooting = false;
    });
}

function initMobileControls() {
    const joyContainer = document.getElementById('joystickContainer');
    const joyKnob = document.getElementById('joystickKnob');
    let joyTouchId = null, joyCenter = {x:0, y:0};

    joyContainer.addEventListener('touchstart', e => {
        const touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
        const rect = joyContainer.getBoundingClientRect();
        joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        updateJoystick(touch);
    });
    window.addEventListener('touchmove', e => {
        for (let t of e.changedTouches) {
            if (t.identifier === joyTouchId) updateJoystick(t);
        }
    });
    const resetJoy = e => {
        for (let t of e.changedTouches) {
            if (t.identifier === joyTouchId) {
                joyTouchId = null;
                mobileMoveVec = { x: 0, y: 0 };
                joyKnob.style.top = '45px'; joyKnob.style.left = '45px';
            }
        }
    };
    window.addEventListener('touchend', resetJoy);
    window.addEventListener('touchcancel', resetJoy);

    function updateJoystick(touch) {
        let dx = touch.clientX - joyCenter.x;
        let dy = touch.clientY - joyCenter.y;
        let dist = Math.hypot(dx, dy);
        let maxDist = 45;
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
        joyKnob.style.left = (45 + dx) + 'px';
        joyKnob.style.top = (45 + dy) + 'px';
        mobileMoveVec = { x: dx / maxDist, y: dy / maxDist };
    }

    const aimPad = document.getElementById('aimPadContainer');
    const aimKnob = document.getElementById('aimPadKnob');
    let aimTouchId = null, aimCenter = {x:0, y:0};

    aimPad.addEventListener('touchstart', e => {
        const touch = e.changedTouches[0];
        aimTouchId = touch.identifier;
        const rect = aimPad.getBoundingClientRect();
        aimCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        updateAim(touch);
        myPlayer.isAiming = true;
    });
    window.addEventListener('touchmove', e => {
        for (let t of e.changedTouches) {
            if (t.identifier === aimTouchId) updateAim(t);
        }
    });
    const resetAim = e => {
        for (let t of e.changedTouches) {
            if (t.identifier === aimTouchId) {
                aimTouchId = null;
                mobileAimVec = { x: 0, y: 0 };
                aimKnob.style.top = '45px'; aimKnob.style.left = '45px';
                myPlayer.isAiming = false;
            }
        }
    };
    window.addEventListener('touchend', resetAim);
    window.addEventListener('touchcancel', resetAim);

    function updateAim(touch) {
        let dx = touch.clientX - aimCenter.x;
        let dy = touch.clientY - aimCenter.y;
        let dist = Math.hypot(dx, dy);
        let maxDist = 45;
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
        aimKnob.style.left = (45 + dx) + 'px';
        aimKnob.style.top = (45 + dy) + 'px';
        mobileAimVec = { x: dx / maxDist, y: dy / maxDist };
    }

    document.getElementById('btnFire').addEventListener('touchstart', (e) => { e.preventDefault(); myPlayer.isShooting = true; });
    document.getElementById('btnFire').addEventListener('touchend', (e) => { e.preventDefault(); myPlayer.isShooting = false; });
    document.getElementById('btnReload').addEventListener('touchstart', (e) => { e.preventDefault(); reloadWeapon(myPlayer); });
    document.getElementById('btnPickup').addEventListener('touchstart', (e) => { e.preventDefault(); pickupItem(); });
    document.getElementById('btnBag').addEventListener('touchstart', (e) => { e.preventDefault(); toggleInventory(); });
    document.getElementById('btnMap').addEventListener('touchstart', (e) => { e.preventDefault(); toggleFullMap(); });
}

function toggleFullMap() {
    const fMap = document.getElementById('fullMapOverlay');
    fMap.style.display = (fMap.style.display === 'flex') ? 'none' : 'flex';
}

function toggleInventory() {
    const inv = document.getElementById('inventory');
    inv.style.display = (inv.style.display === 'flex') ? 'none' : 'flex';
    if(inv.style.display === 'flex') renderInventory();
}

function renderInventory() {
    const weapArea = document.getElementById('equippedWeaponArea');
    const scopeArea = document.getElementById('equippedScopeArea');
    const scopeList = document.getElementById('scopeList');

    weapArea.innerHTML = myPlayer.weapon 
        ? `${WEAPONS[myPlayer.weapon].name} <button style="width:auto; padding:2px 8px; margin-left:10px;" onclick="unequipWeapon()">해제(버리기)</button>` 
        : "맨손";
    scopeArea.innerHTML = myPlayer.equippedScope 
        ? `${SCOPES[myPlayer.equippedScope].name} <button style="width:auto; padding:2px 8px; margin-left:10px;" onclick="unequipScope()">해제</button>` 
        : "없음";
        
    scopeList.innerHTML = "";
    myPlayer.inventory.scopes.forEach(sc => {
        const item = document.createElement('div');
        item.className = 'inv-item';
        item.innerText = SCOPES[sc].name;
        item.onclick = () => equipScope(sc);
        scopeList.appendChild(item);
    });
}

function unequipWeapon() {
    if(myPlayer.weapon) {
        droppedItems.push({ x: myPlayer.x, y: myPlayer.y, type: myPlayer.weapon });
        myPlayer.weapon = null;
        myPlayer.equippedScope = null;
        myPlayer.clipAmmo = 0;
        updateHUD();
        renderInventory();
    }
}

function equipScope(scKey) {
    if(!myPlayer.weapon) { alert("총기를 먼저 장착해야 합니다!"); return; }
    myPlayer.equippedScope = scKey; 
    updateHUD(); 
    renderInventory(); 
}

function unequipScope() { myPlayer.equippedScope = null; updateHUD(); renderInventory(); }

function reloadWeapon(p) {
    if(!p.weapon || p.isReloading) return;
    const maxClip = WEAPONS[p.weapon].maxClip;
    const needed = maxClip - p.clipAmmo;
    if(needed <= 0 || p.reserveAmmo <= 0) return;

    p.isReloading = true;
    setTimeout(() => {
        const load = Math.min(needed, p.reserveAmmo);
        p.clipAmmo += load;
        p.reserveAmmo -= load;
        p.isReloading = false;
        if(p === myPlayer) updateHUD();
    }, 1500);
}

function pickupItem() {
    for(let i = droppedItems.length - 1; i >= 0; i--) {
        const item = droppedItems[i];
        if(Math.hypot(myPlayer.x - item.x, myPlayer.y - item.y) < 50) {
            if(['ar', 'sniper', 'shotgun'].includes(item.type)) {
                if(myPlayer.weapon) droppedItems.push({ x: myPlayer.x, y: myPlayer.y, type: myPlayer.weapon });
                myPlayer.weapon = item.type;
                myPlayer.clipAmmo = WEAPONS[item.type].maxClip;
                myPlayer.reserveAmmo += WEAPONS[item.type].maxClip * 2;
            } else if(item.type.startsWith('ammo_')) {
                myPlayer.reserveAmmo += 30;
            } else {
                myPlayer.inventory.scopes.push(item.type);
            }
            droppedItems.splice(i, 1);
            updateHUD();
            break;
        }
    }
}

function updateHUD() {
    let activeRemotes = Object.values(remotePlayers).filter(p => p.hp > 0).length;
    const alive = (myPlayer.hp > 0 ? 1 : 0) + aiBots.length + activeRemotes;
    
    document.getElementById('hudAliveCount').innerText = alive;
    document.getElementById('hudWeapon').innerText = myPlayer.weapon ? WEAPONS[myPlayer.weapon].name : "맨손";
    document.getElementById('hudAmmo').innerText = myPlayer.weapon ? `${myPlayer.clipAmmo} / ${myPlayer.reserveAmmo} ${myPlayer.isReloading ? '(장전중...)' : ''}` : "- / -";
    document.getElementById('hudScope').innerText = myPlayer.equippedScope ? SCOPES[myPlayer.equippedScope].name : "없음";

    if (myPlayer.hp <= 0 && !gameEnded) {
        triggerEndGame(false);
    } else if (alive === 1 && myPlayer.hp > 0 && !gameEnded && (aiBots.length > 0 || activeRemotes > 0)) {
        triggerEndGame(true);
    }
}

function triggerEndGame(isWin) {
    gameEnded = true;
    const overlay = document.getElementById('victoryOverlay');
    const text = document.getElementById('victoryText');
    text.innerText = isWin ? "🏆 승리하셨습니다! 🏆" : "💀 사망하셨습니다! 💀";
    overlay.style.display = 'block';
    setTimeout(() => { location.reload(); }, 5000);
}

function triggerDamageEffect() {
    const overlay = document.getElementById('damageOverlay');
    overlay.style.opacity = '1';
    setTimeout(() => { overlay.style.opacity = '0'; }, 150);
}

function spawnBloodParticles(x, y) {
    for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        bloodParticles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            radius: Math.random() * 3 + 2, alpha: 1.0
        });
    }
}

function shoot(shooter, extraSpread = 0) {
    if(!shooter.weapon || shooter.clipAmmo <= 0 || shooter.isReloading) return;
    shooter.clipAmmo--;
    if(shooter === myPlayer) updateHUD();

    const w = WEAPONS[shooter.weapon];
    const isRunning = shooter.movementMode === 'sprint';
    const baseSpread = isRunning ? w.spread * 3.0 : w.spread;

    for(let i=0; i < w.pellets; i++) {
        const spread = (Math.random() - 0.5) * (baseSpread + extraSpread);
        const angle = shooter.angle + spread;
        const bullet = {
            x: shooter.x, y: shooter.y,
            prevX: shooter.x, prevY: shooter.y,
            dx: Math.cos(angle) * w.bulletSpeed,
            dy: Math.sin(angle) * w.bulletSpeed,
            damage: w.damage, ownerId: shooter.id
        };
        bullets.push(bullet);

        if (shooter === myPlayer && conn) {
            conn.send({ type: 'SHOOT', bullet: bullet });
        }
    }

    if(shooter.clipAmmo === 0) { reloadWeapon(shooter); }
}

function updateAI() {
    const now = Date.now();
    const diff = AI_DIFFICULTY[aiDifficulty];

    for(let i = aiBots.length - 1; i >= 0; i--) {
        const bot = aiBots[i];

        let targets = [myPlayer, ...Object.values(remotePlayers)].filter(p => p && p.hp > 0);
        let closestTarget = null;
        let minDst = 1200;

        targets.forEach(target => {
            const dst = Math.hypot(target.x - bot.x, target.y - bot.y);
            if(dst < minDst) { minDst = dst; closestTarget = target; }
        });

        if(closestTarget && bot.weapon) {
            bot.angle = Math.atan2(closestTarget.y - bot.y, closestTarget.x - bot.x);
            if (minDst > 150) {
                bot.x += Math.cos(bot.angle) * 2.0 * diff.speedMult;
                bot.y += Math.sin(bot.angle) * 2.0 * diff.speedMult;
            }
            if (now - bot.lastShootTime >= WEAPONS[bot.weapon].cooldown) {
                shoot(bot, diff.spread);
                bot.lastShootTime = now;
            }
        } else if(!bot.weapon) {
            let nearestItem = null;
            let minDist = 800;
            droppedItems.forEach(item => {
                if (['ar', 'sniper', 'shotgun'].includes(item.type)) {
                    let d = Math.hypot(item.x - bot.x, item.y - bot.y);
                    if (d < minDist) { minDist = d; nearestItem = item; }
                }
            });

            if (nearestItem) {
                bot.angle = Math.atan2(nearestItem.y - bot.y, nearestItem.x - bot.x);
                bot.x += Math.cos(bot.angle) * 2.5;
                bot.y += Math.sin(bot.angle) * 2.5;

                if (minDist < 40) {
                    bot.weapon = nearestItem.type;
                    bot.clipAmmo = WEAPONS[bot.weapon].maxClip;
                    droppedItems.splice(droppedItems.indexOf(nearestItem), 1);
                }
            }
        }
    }
}

function updatePlayerMovement() {
    if(myPlayer.hp <= 0) return;

    let moveX = 0, moveY = 0;
    if (isMobile) {
        moveX = mobileMoveVec.x; moveY = mobileMoveVec.y;
    } else {
        if (keys['w'] || keys['arrowup']) moveY -= 1;
        if (keys['s'] || keys['arrowdown']) moveY += 1;
        if (keys['a'] || keys['arrowleft']) moveX -= 1;
        if (keys['d'] || keys['arrowright']) moveX += 1;
    }

    myPlayer.isMoving = (moveX !== 0 || moveY !== 0);

    let moveSpeed = myPlayer.speed;
    if (keys['shift']) { moveSpeed *= 1.6; myPlayer.movementMode = 'sprint'; }
    else if (keys['control']) { moveSpeed *= 0.5; myPlayer.movementMode = 'sneak'; }
    else { myPlayer.movementMode = 'walk'; }

    if (myPlayer.isMoving) {
        let len = Math.hypot(moveX, moveY);
        let nx = (moveX / len) * moveSpeed;
        let ny = (moveY / len) * moveSpeed;

        let nextX = myPlayer.x + nx;
        let nextY = myPlayer.y + ny;

        let canMoveX = true, canMoveY = true;
        for (let obs of obstacles) {
            if (nextX > obs.x - 15 && nextX < obs.x + obs.w + 15 && myPlayer.y > obs.y - 15 && myPlayer.y < obs.y + obs.h + 15) canMoveX = false;
            if (myPlayer.x > obs.x - 15 && myPlayer.x < obs.x + obs.w + 15 && nextY > obs.y - 15 && nextY < obs.y + obs.h + 15) canMoveY = false;
        }

        if (canMoveX) myPlayer.x = Math.max(15, Math.min(WORLD_SIZE - 15, nextX));
        if (canMoveY) myPlayer.y = Math.max(15, Math.min(WORLD_SIZE - 15, nextY));
    }

    if (isMobile) {
        if (Math.hypot(mobileAimVec.x, mobileAimVec.y) > 0.1) myPlayer.angle = Math.atan2(mobileAimVec.y, mobileAimVec.x);
    } else {
        let screenCenterX = canvas.width / 2;
        let screenCenterY = canvas.height / 2;
        myPlayer.angle = Math.atan2(mouse.y - screenCenterY, mouse.x - screenCenterX);
    }

    if (myPlayer.isShooting && myPlayer.weapon) {
        const now = Date.now();
        if (now - myPlayer.lastShootTime >= WEAPONS[myPlayer.weapon].cooldown) {
            shoot(myPlayer);
            myPlayer.lastShootTime = now;
        }
    }

    camera.x = myPlayer.x; camera.y = myPlayer.y;
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.prevX = b.x; b.prevY = b.y;
        b.x += b.dx; b.y += b.dy;

        if (b.x < 0 || b.x > WORLD_SIZE || b.y < 0 || b.y > WORLD_SIZE) {
            bullets.splice(i, 1);
            continue;
        }

        if (b.ownerId !== myPlayer.id && myPlayer.hp > 0) {
            if (Math.hypot(b.x - myPlayer.x, b.y - myPlayer.y) < 18) {
                myPlayer.hp -= b.damage;
                triggerDamageEffect();
                spawnBloodParticles(myPlayer.x, myPlayer.y);
                bullets.splice(i, 1);
                updateHUD();
                continue;
            }
        }

        for (let j = aiBots.length - 1; j >= 0; j--) {
            const bot = aiBots[j];
            if (b.ownerId !== bot.id) {
                if (Math.hypot(b.x - bot.x, b.y - bot.y) < 18) {
                    bot.hp -= b.damage;
                    spawnBloodParticles(bot.x, bot.y);
                    if (bot.hp <= 0) { aiBots.splice(j, 1); updateHUD(); }
                    bullets.splice(i, 1);
                    break;
                }
            }
        }
    }
}

function gameLoop() {
    if (!gameStarted) return;

    updatePlayerMovement();
    updateAI();
    updateBullets();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(canvas.width / 2 - camera.x, canvas.height / 2 - camera.y);

    // 격자
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    for (let x = 0; x <= WORLD_SIZE; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
    }
    for (let y = 0; y <= WORLD_SIZE; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
    }

    // 테두리
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 5;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

    // 자기장 원 표시 (배틀로얄 모드만)
    if (currentGameMode === 'battleroyale') {
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.7)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(safeZone.x, safeZone.y, safeZone.radius, 0, Math.PI * 2);
        ctx.stroke();
    }

    // 장애물
    ctx.fillStyle = '#444';
    obstacles.forEach(obs => { ctx.fillRect(obs.x, obs.y, obs.w, obs.h); });

    // 드랍 아이템
    droppedItems.forEach(item => {
        ctx.fillStyle = item.type.startsWith('ammo') ? '#ffcc00' : '#00ffcc';
        ctx.beginPath(); ctx.arc(item.x, item.y, 6, 0, Math.PI * 2); ctx.fill();
    });

    // 피 이펙트
    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        let p = bloodParticles[i];
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
        if (p.alpha <= 0) { bloodParticles.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(255, 0, 0, ${p.alpha})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    }

    // 총알
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 3;
    bullets.forEach(b => {
        ctx.beginPath(); ctx.moveTo(b.prevX, b.prevY); ctx.lineTo(b.x, b.y); ctx.stroke();
    });

    // 원격 접속 플레이어
    Object.values(remotePlayers).forEach(p => {
        if(p.hp <= 0) return;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 25);
    });

    // AI 봇
    aiBots.forEach(bot => {
        ctx.save();
        ctx.translate(bot.x, bot.y);
        ctx.rotate(bot.angle);
        ctx.fillStyle = '#ff8800';
        ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(bot.name, bot.x, bot.y - 25);
    });

    // 본인 플레이어
    if (myPlayer.hp > 0) {
        ctx.save();
        ctx.translate(myPlayer.x, myPlayer.y);
        ctx.rotate(myPlayer.angle);
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
        if (myPlayer.weapon) { ctx.fillStyle = '#666'; ctx.fillRect(10, 3, 15, 5); }
        ctx.restore();

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(myPlayer.name, myPlayer.x, myPlayer.y - 25);
    }

    ctx.restore();

    drawMinimap();
    requestAnimationFrame(gameLoop);
}

function drawMinimap() {
    mCtx.clearRect(0, 0, 200, 200);
    const scale = 200 / WORLD_SIZE;

    mCtx.fillStyle = '#222';
    mCtx.fillRect(0, 0, 200, 200);

    if (currentGameMode === 'battleroyale') {
        mCtx.strokeStyle = '#0099ff';
        mCtx.lineWidth = 2;
        mCtx.beginPath();
        mCtx.arc(safeZone.x * scale, safeZone.y * scale, safeZone.radius * scale, 0, Math.PI * 2);
        mCtx.stroke();
    }

    mCtx.fillStyle = '#ff8800';
    aiBots.forEach(bot => {
        mCtx.fillRect(bot.x * scale - 2, bot.y * scale - 2, 4, 4);
    });

    if (myPlayer.hp > 0) {
        mCtx.fillStyle = '#00ffcc';
        mCtx.beginPath();
        mCtx.arc(myPlayer.x * scale, myPlayer.y * scale, 3, 0, Math.PI * 2);
        mCtx.fill();
    }
}
