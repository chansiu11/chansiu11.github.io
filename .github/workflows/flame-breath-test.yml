name: Hongryeon flame form game test
on:
  push:
    branches:
      - main
    paths:
      - 'rpggametest/index.html'
      - 'rpggametest/flame-breath-smoke.mjs'
      - '.github/workflows/flame-breath-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-game-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the game code
        run: python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/rpg-http.log 2>&1 &
      - name: Verify 5 forms against a training dummy in the real game
        run: node rpggametest/flame-breath-smoke.mjs
      - name: Retain genuine in-game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hongryeon-flame-actual-game-frames
          path: rpggametest/flame-preview/*.png
          if-no-files-found: warn
