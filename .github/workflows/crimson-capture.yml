name: Capture real Crimson gameplay frames
on:
  push:
    branches:
      - preview/crimson-skill-captures
    paths:
      - 'rpggametest/index.html'
      - 'rpggametest/combat-core.js'
      - 'rpggametest/capture-skills.mjs'
      - '.github/workflows/crimson-capture.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve exact checked-out game
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/rpg-http.log 2>&1 &
      - name: Capture real gameplay screenshots
        run: node rpggametest/capture-skills.mjs
      - name: Upload original screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crimson-real-gameplay-screenshots
          path: rpggametest/screenshots/*.png
          if-no-files-found: warn
      - name: Commit screenshots to preview branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpggametest/screenshots/
          git diff --cached --quiet || git commit -m "Capture real in-browser Crimson skill frames"
          git push origin "HEAD:${GITHUB_REF_NAME}"
